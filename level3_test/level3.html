// ================= FLUGSAURIER-RITT =================
// Kai rides a pterosaur through a canyon of rock pillars: tap / jump = flap the wings.
// 25 seconds; bumping into a rock 3 times = thrown off. Coins in the gaps.
const RIDE_T = 1500, RIDE_SP = 4.6, RIDE_X = 280, RIDE_FLAP = -5.4, RIDE_G = 0.3;
function startRide() {
  const k = S.kai; k.vx = 0; k.dir = 0;
  S.game = { id: 'ptero', t: 0, y: 170, vy: 0, pillars: [], coins: [], bumps: 0, inv: 0, got: 0, result: null, spawn: 30, scroll: 0, wing: 0 };
  S.phase = 'ride'; Audio.play('chime');
  flash(isTouchDev() ? 'Tippen = mit den Flügeln schlagen!' : 'Leertaste / Klick = mit den Flügeln schlagen!', 140);
}
function rideFlap() { const g = S.game; if (!g || g.result) return; g.vy = RIDE_FLAP; g.wing = 12; Audio.play('flap'); }
function ridePointer(p) {
  const g = S.game; if (!g) return;
  if (g.result) {
    if (g.result === 'lose' && inRect(p, GBTN.again)) { S.game = null; startRide(); return; }
    if (inRect(p, g.result === 'lose' ? GBTN.next2 : GBTN.next)) endRide();
    return;
  }
  rideFlap();
}
function gameKey(e) {
  if (S.phase === 'shop') { if (e.code === 'Escape' || e.code === 'Enter') leaveShop(); return; }
  if (S.phase === 'ride') {
    const g = S.game; if (!g) return;
    if (g.result) { if (e.code === 'Space' || e.code === 'Enter') endRide(); return; }
    if (!e.repeat && (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW')) { e.preventDefault(); rideFlap(); }
  }
}
function gameKeyUp() {}
const GBTN = { next: { x: W / 2 - 110, y: 250, w: 220, h: 44 }, again: { x: W / 2 - 235, y: 250, w: 220, h: 44 }, next2: { x: W / 2 + 15, y: 250, w: 220, h: 44 } };
// the ride uses the whole height of the screen (on a phone there is a lot of sky above the world)
const rideTop = () => -DY + 20;
const rideBox = g => ({ x1: RIDE_X - 34, x2: RIDE_X + 34, y1: g.y - 72, y2: g.y + 16 });
function updateRide(dt) {
  const g = S.game; if (!g || g.result) return;
  g.t += dt; g.scroll += RIDE_SP * dt;
  if (g.inv > 0) g.inv -= dt; if (g.wing > 0) g.wing -= dt;
  g.vy = Math.min(7, g.vy + RIDE_G * dt); g.y += g.vy * dt;
  if (g.y < rideTop() + 70) { g.y = rideTop() + 70; g.vy = Math.max(0, g.vy); }
  if (g.y > FLOOR - 16) { g.y = FLOOR - 16; g.vy = RIDE_FLAP * 0.8; bump(); }
  // new rock pillars with a gap (the gap gets a little smaller over time)
  g.spawn -= dt;
  if (g.spawn <= 0 && g.t < RIDE_T - 120) {
    g.spawn = 92;
    // the gap is somewhere between the very top of the screen and the ground – randomly high, low or in the middle,
    // but never more than ~230 px away from the last one (so it can always be reached)
    const gap = 224 - Math.min(14, g.t / RIDE_T * 18), lo = rideTop() + gap / 2 - 30, hi = FLOOR - 8 - gap / 2;
    let mid = lo + (hi - lo) * Math.random();
    if (g.lastMid != null) mid = clamp(mid, g.lastMid - 230, g.lastMid + 230);
    mid = clamp(mid, lo, hi); g.lastMid = mid;
    const top = mid - gap / 2;
    g.pillars.push({ x: W + 60, top, bot: top + gap, w: 74, hit: false });
    for (let i = 0; i < 3; i++) g.coins.push({ x: W + 60 + 37, y: top + gap / 2 + 14 + (i - 1) * 34, done: false });
  }
  for (const pl of g.pillars) pl.x -= RIDE_SP * dt;
  for (const c of g.coins) c.x -= RIDE_SP * dt;
  g.pillars = g.pillars.filter(pl => pl.x > -120); g.coins = g.coins.filter(c => c.x > -40 && !c.done);
  const b = rideBox(g);
  for (const pl of g.pillars) {
    if (b.x2 < pl.x || b.x1 > pl.x + pl.w) continue;
    if (b.y1 < pl.top || b.y2 > pl.bot) { if (!pl.hit) { pl.hit = true; bump(); } }
  }
  for (const c of g.coins) if (!c.done && Math.abs(c.x - RIDE_X) < 40 && c.y > b.y1 - 8 && c.y < b.y2 + 8) { c.done = true; S.coins++; g.got++; Audio.play('coin'); }
  if (g.bumps >= 3) { g.result = 'lose'; Audio.play('nomatch'); Audio.play('crash'); S.shake = 8; saveProgress(); }
  else if (g.t >= RIDE_T) {
    g.result = 'win'; S.coins += 20; SAVE.mini.ptero = true;
    g.pts = !SAVE.pts.mini_ptero; if (g.pts) { SAVE.pts.mini_ptero = true; S.score += PTS.mini; }
    saveProgress(); Audio.play('win'); Audio.play('cheer');
  }
}
function bump() {
  const g = S.game; if (g.inv > 0) return;
  g.bumps++; g.inv = 70; S.shake = 7; Audio.play('crash');
}
function endRide() {
  const k = S.kai, gate = SITES.ptero + 120;
  S.game = null; S.phase = 'play'; saveProgress();
  k.x = gate + 200; k.y = FLOOR; k.vy = 0; k.ground = true; k.platform = null; k.dir = 0; k.face = 1;
  Audio.play('tink');
}

// ---------------- update ----------------
function update(dt) {
  S.t += dt;
  if (S.msgTimer > 0) S.msgTimer -= dt;
  if (S.heartFlash > 0) S.heartFlash -= dt;
  if (S.shake > 0) S.shake = Math.max(0, S.shake - 0.5 * dt);
  if (playing()) S.wtime += dt;
  S.saveT = (S.saveT || 0) + dt; if (S.saveT > 120 && playing()) { S.saveT = 0; saveProgress(); }
  for (const p of S.pops) p.t += dt; S.pops = S.pops.filter(p => p.t < 60);
  updateParticles(dt);
  for (const o of S.objects) o.p += 0.05 * dt;
  if (S.phase === 'lore') { updateLore(dt); return; }
  if (!playing()) { if (S.phase === 'won') updateBossDead(dt); return; }
  if (S.reload > 0) S.reload -= dt;
  for (const c of S.cools) c.t -= dt; S.cools = S.cools.filter(c => c.t > 0);
  updatePlats(dt);
  updateKai(dt);
  updateSalas(dt);
  updateBats(dt);
  updateStalactites(dt);
  updateLava(dt);
  updateBombs(dt);
  updatePickups();
  updateSites();
  updateFights(dt);
  for (const x of CHECKPOINTS) if (S.kai.x > x && !S.fight) reachCheckpoint(x);
  const k = S.kai, ax = arenaX();
  if (ax != null) S.cam += (ax - S.cam) * Math.min(1, 0.08 * dt);
  else {
    const L = W * 0.32, R = W * 0.5, sx = k.x - S.cam;
    let target = S.cam;
    if (sx > R) target = k.x - R; else if (sx < L) target = k.x - L;
    target = clamp(target, 0, BOSS_X);
    if (Math.abs(target - S.cam) > 40) S.cam += (target - S.cam) * Math.min(1, 0.12 * dt);
    else S.cam = target;
  }
}
function updatePlats(dt) {
  for (const p of S.plats) {
    const ox = p.x, oy = p.y;
    if (p.kind === 'move') {
      p.ph += p.sp * dt;
      p.x = p.x0 + (1 - Math.cos(p.ph)) / 2 * p.ax;
      p.y = p.y0 - (1 - Math.cos(p.ph)) / 2 * p.ay;
    } else if (p.kind === 'sink') {
      // sinks slowly into the lava while Kai stands on it, comes back up when he is gone
      const on = S.kai.platform === p;
      if (on) p.y = Math.min(LAVA_Y + 30, p.y + 0.45 * dt); else p.y = Math.max(p.y0, p.y - 0.6 * dt);
    }
    p.dx = p.x - ox; p.dy = p.y - oy;
  }
}
const platSolid = p => !(p.kind === 'sink' && p.y > LAVA_Y);
function updateKai(dt) {
  const k = S.kai, prevY = k.y; k.prevY = prevY;
  if (k.inv > 0) k.inv -= dt;
  if (k.hurtT > 0) k.hurtT -= dt;
  if (k.landT > 0) k.landT -= dt;
  if (k.shootT > 0) k.shootT -= dt;
  k.faceAnim += (k.face - k.faceAnim) * Math.min(1, 0.7 * dt);
  const target = k.dir * SPEED * (S.phase === 'boss' ? 1.05 : 1);
  if (k.hurtT <= 0) {
    if (k.dir === 0) { const s = Math.sign(k.vx); k.vx -= s * Math.min(Math.abs(k.vx), BRAKE * dt); }
    else k.vx += clamp(target - k.vx, -ACC * dt * (k.ground ? 1 : 0.7), ACC * dt * (k.ground ? 1 : 0.7));
  }
  if (k.platform) k.x += k.platform.dx;
  let nx = k.x + k.vx * dt;
  const ax = arenaX(), minX = ax != null ? ax + 40 : 30, maxX = S.fight === 'volcano' || S.phase === 'won' ? VOLC.baseL - 30 : ax != null ? ax + W - 40 : VOLC.baseL - 30;
  if (nx < minX) { nx = minX; k.vx = 0; } if (nx > maxX) { nx = maxX; k.vx = 0; }
  k.x = nx;
  if (k.ground && Math.abs(k.vx) < Math.abs(target) - 0.3) k.pushT = (k.pushT + dt) % 40; else if (k.pushT > 0 && k.pushT < 34) k.pushT += dt; else k.pushT = 0;
  if (k.ground && k.platform) {
    const pl = k.platform;

    else k.y = pl.y;
  } else if (k.ground) {

    if (groundAt(k.x)) { k.y = FLOOR; k.onLava = false; }

  }

    if (k.heat > HEAT_MAX) burnOut();

    if (k.vy > 0) {
      for (const pl of S.plats) {
        if (!platSolid(pl) || k.x < pl.x - 14 || k.x > pl.x + pl.w + 14) continue;
        const top = pl.y;
        if (prevY <= top + 3 + Math.max(0, -pl.dy) && k.y >= top) { landOn(pl, top); break; }
      }
      if (!k.ground && k.y >= FLOOR && groundAt(k.x)) landOn(null, FLOOR);
      if (!k.ground && k.y >= LAVA_Y && !groundAt(k.x)) { landOn(null, LAVA_Y); k.onLava = true; Audio.play('lavahit'); }
    }

// ---------------- enemies ----------------
function updateSalas(dt) {
  const k = S.kai, kb = kaiBox();
  for (const c of S.salas) {
    if (c.dead) { c.deadT += dt; continue; }
    if (Math.abs(c.x - k.x) > 1400) continue;
    c.t += dt; c.x += c.dir * 1.5 * dt;
    if (c.x < c.x1 || !GROUND.some(([a, b]) => c.x - 34 > a && c.x - 34 < b)) { c.x = Math.max(c.x, c.x1); c.dir = 1; }
    if (c.x > c.x2 || !GROUND.some(([a, b]) => c.x + 34 > a && c.x + 34 < b)) { c.x = Math.min(c.x, c.x2); c.dir = -1; }
    const cb = salaBox(c);
    if (!overlap(kb, cb)) continue;
    if (k.vy > 0 && (k.prevY ?? k.y) <= cb.y1 + 16) { killSala(c, true); stompBounce(cb.y1); }
    else hurt(c.x);
  }
}
function killSala(c, stomped) { c.dead = true; c.deadT = 0; Audio.play('stomp'); burst(c.x, FLOOR - 20, '#ff7a3a', 12, 4); if (stomped) comboScore(PTS.salamander, c.x, FLOOR - 60); else addScore(PTS.salamander, c.x, FLOOR - 60); }
function updateBats(dt) {
  const k = S.kai, kb = kaiBox();
  for (const p of S.bats) {
    if (p.dead) { p.deadT += dt; p.vy += 0.4 * dt; p.y += p.vy * dt; continue; }
    if (Math.abs(p.x - k.x) > 1400) continue;
    p.t += dt;
    if (p.state === 'fly') {
      p.x += p.dir * 1.8 * dt;
      if (p.x < p.x1) { p.x = p.x1; p.dir = 1; } if (p.x > p.x2) { p.x = p.x2; p.dir = -1; }
      p.y += ((p.hy + Math.sin(p.t * 0.09) * 20) - p.y) * Math.min(1, 0.1 * dt);
      p.cool -= dt;
      const dx = k.x - p.x;
      if (p.cool <= 0 && Math.abs(dx) < 300 && Math.abs(dx) > 50 && playing()) { p.state = 'dive'; p.st = 0; p.sx = p.x; p.sy = p.y; p.tx = k.x; p.dir = Math.sign(dx); Audio.play('flap'); }
    } else if (p.state === 'dive') {
      p.st += dt; const u = Math.min(1, p.st / 60), ex = p.sx + (p.tx - p.sx) * 2;

    }
    const pb = batBox(p);
    if (!overlap(kb, pb)) continue;
    if (k.vy > 0 && (k.prevY ?? k.y) <= pb.y1 + 16) { killBat(p, true); stompBounce(pb.y1); }
    else hurt(p.x);
  }
}
function killBat(p, stomped) { p.dead = true; p.deadT = 0; p.vy = -3; Audio.play('stomp'); burst(p.x, p.y, '#ffb347', 12, 4); if (stomped) comboScore(PTS.bat, p.x, p.y - 30); else addScore(PTS.bat, p.x, p.y - 30); }

// ---------------- stalactites: shake, then fall when Kai rides underneath ----------------
function updateStalactites(dt) {
  const k = S.kai;
  for (const s of S.stalac) {
    if (s.state === 'hang') { if (Math.abs(k.x + k.vx * 12 - s.x) < 120 && playing()) { s.state = 'shake'; s.t = 0; Audio.play('tink'); } }
    else if (s.state === 'shake') { s.t += dt; if (Math.random() < 0.3 * dt) S.particles.push({ x: s.x + rand(-8, 8), y: -DY + 30, vx: 0, vy: rand(1, 2), r: 2, color: '#6b4a3a', life: 0.8, g: 0.2 }); if (s.t > 40) { s.state = 'fall'; s.y = -DY + 20; s.vy = 1; } }
    else if (s.state === 'fall') {
      s.vy += 0.5 * dt; s.y += s.vy * dt;
      if (Math.abs(s.x - k.x) < 24 && s.y + 40 > k.y - 108 && s.y < k.y - 4) { hurt(s.x); s.state = 'gone'; s.back = 0; burst(s.x, s.y + 30, '#8a6a5a', 14, 4); }
      else if (s.y + 40 >= (groundAt(s.x) ? FLOOR : LAVA_Y)) { s.state = 'gone'; s.back = 0; burst(s.x, FLOOR - 4, '#8a6a5a', 14, 4); Audio.play('land'); }
    } else if (s.state === 'gone') { s.back += dt; if (s.back > 600 && Math.abs(s.x - k.x) > 500) s.state = 'hang'; }
  }
}

// ---------------- lava: bubbles that spit lava balls, lava falls that switch on and off ----------------
const lavafallOn = (lf, t) => ((t + lf[1]) % 260) < 150;          // on 150 frames, off 110
const lavafallWarn = (lf, t) => { const u = (t + lf[1]) % 260; return u > 230; };
function updateLava(dt) {
  const k = S.kai;
  // a bubble forms in the lava near Kai (warning), then a lava ball jumps out in an arc
  S.bubbleT -= dt;
  if (S.bubbleT <= 0 && playing() && !S.fight) {
    S.bubbleT = rand(70, 130);
    const x = k.x + k.vx * 40 + rand(-260, 260);
    if (lavaAt(x) && !S.cools.some(c => x > c.x1 - 20 && x < c.x2 + 20)) S.bubbles.push({ x, t: 0 });
  }
  for (const b of S.bubbles) {
    b.t += dt;
    if (b.t > 50 && !b.done) { b.done = true; S.blobs.push({ x: b.x, y: LAVA_Y, vx: rand(-1.5, 1.5), vy: -rand(10, 13) }); Audio.play('pop'); }
  }
  S.bubbles = S.bubbles.filter(b => !b.done);
  for (const o of S.blobs) {
    o.vy += 0.4 * dt; o.x += o.vx * dt; o.y += o.vy * dt;
    if (Math.abs(o.x - k.x) < 26 && o.y > k.y - 108 && o.y < k.y) { hurt(o.x); o.done = true; burst(o.x, o.y, '#ff7a1a', 10, 3); }
    if (o.vy > 0 && o.y > LAVA_Y) o.done = true;
  }
  S.blobs = S.blobs.filter(o => !o.done);
  // lava falls: touching one while it pours costs a heart
  for (const lf of LAVAFALLS) if (lavafallOn(lf, S.t) && Math.abs(k.x - lf[0]) < 32) hurt(lf[0]);
}

// ---------------- water bombs ----------------
function updateBombs(dt) {
  for (const b of S.bombs) {
    b.vy += 0.35 * dt; b.x += b.vx * dt; b.y += b.vy * dt; b.rot += 0.2 * dt;
    let hit = false;
    for (const c of S.salas) if (!c.dead && overlap({ x1: b.x - 8, x2: b.x + 8, y1: b.y - 8, y2: b.y + 8 }, salaBox(c))) hit = true;
    for (const p of S.bats) if (!p.dead && overlap({ x1: b.x - 8, x2: b.x + 8, y1: b.y - 8, y2: b.y + 8 }, batBox(p))) hit = true;
    if (!hit && bombHitsFight(b)) { b.done = true; splash(b.x, b.y, false); continue; }
    const floorY = groundAt(b.x) ? FLOOR : LAVA_Y;
    if (hit || b.y >= floorY) { b.done = true; splash(b.x, Math.min(b.y, floorY), !hit && floorY === LAVA_Y); }
    if (b.x < S.cam - 100 || b.x > S.cam + W + 100) b.done = true;
  }
  S.bombs = S.bombs.filter(b => !b.done);
}
// the splash puts out every enemy close by; on lava it leaves a stone crust to ride on for a while
function splash(x, y, onLava) {
  burst(x, y, '#7fd0ff', 18, 5); burst(x, y, '#ffffff', 8, 3); Audio.play('pop');
  for (const c of S.salas) if (!c.dead && Math.abs(c.x - x) < 70 && Math.abs(FLOOR - 20 - y) < 80) killSala(c, false);
  for (const p of S.bats) if (!p.dead && Math.abs(p.x - x) < 60 && Math.abs(p.y - y) < 60) killBat(p, false);
  if (onLava) {
    S.cools.push({ x1: x - 70, x2: x + 70, t: 360 });
    for (let i = 0; i < 10; i++) S.particles.push({ x: x + rand(-60, 60), y: LAVA_Y - 4, vx: rand(-0.5, 0.5), vy: rand(-2.5, -1), r: rand(5, 10), color: 'rgba(230,230,240,0.6)', life: 1.2, g: -0.03 });
    Audio.play('air');
  }
}

// ---------------- pickups / particles ----------------
function updatePickups() {
  const k = S.kai, kb = kaiBox();
  for (const o of S.objects) {
    if (o.done || Math.abs(o.x - k.x) > 90) continue;
    if (kb.x1 - o.r < o.x && kb.x2 + o.r > o.x && kb.y1 - o.r < o.y && kb.y2 + 8 > o.y) {
      o.done = true;
      if (o.type === 'coin') { S.coins++; addScore(PTS.coin); burst(o.x, o.y, '#ffd23a', 6, 2.5); Audio.play('coin'); }
      if (o.type === 'heart') { S.hearts++; S.heartFlash = -30; burst(o.x, o.y, '#ff3b5c', 14, 3); Audio.play('chest'); flash('+1 HERZ', 50); }
    }
  }
}
function updateParticles(dt) {
  for (const p of S.particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.g ?? 0.18) * dt; p.life -= 0.03 * dt; }
  S.particles = S.particles.filter(p => p.life > 0);
}

// ---------------- the mine cart ride: asked on the way (also when Kai comes by in the air) ----------------
function updateSites() {
  const k = S.kai;
  if (k.x > 260) S.asked.up = false;
  if (!S.asked.up && k.x < PIPE_UP + 10 && k.dir < 0 && k.ground) { S.asked.up = true; askUp(); return; }
  for (const [id, x] of Object.entries(SITES)) {
    const gate = x + 120, d = Math.abs(k.x - gate);
    if (d > 300) { S.asked[id] = false; S.near[id] = false; }
    if (d < 60) S.near[id] = true;
    if (!S.asked[id] && S.near[id] && k.ground && d < 300) {
      S.asked[id] = true; S.ask = id; S.phase = 'ask'; k.vx = 0; k.dir = 0; Audio.play('chime');
    }
  }
}

// ---------------- panel buttons ----------------
const BTN = {
  start: { x: W / 2 - 110, y: 250, w: 220, h: 46 },
  yes: { x: W / 2 - 215, y: 228, w: 200, h: 44 }, no: { x: W / 2 + 15, y: 228, w: 200, h: 44 },
  goYes: { x: W / 2 - 215, y: 228, w: 210, h: 40 }, goNo: { x: W / 2 + 5, y: 228, w: 210, h: 40 },
  up: { x: W / 2 - 250, y: 236, w: 240, h: 44 }, menu: { x: W / 2 + 10, y: 236, w: 240, h: 44 },
  music: { x: W - 252, y: 10, w: 34, h: 30 }, sfx: { x: W - 212, y: 10, w: 34, h: 30 },

const inRect = (p, b) => b && p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
function toLogical(e) { const r = canvas.getBoundingClientRect(), sc = Math.min(r.width / W, r.height / VH); return { x: (e.clientX - r.left - (r.width - W * sc) / 2) / sc, y: (e.clientY - r.top - (r.height - VH * sc) / 2) / sc - DY }; }
canvas.addEventListener('pointerdown', e => {
  if (CUR !== ME || TRANS || MENU.open || CONFIRM.open) return;
  if (e.pointerType === 'mouse' && e.button === 2) return;
  const p = toLogical(e), hp = { x: p.x, y: p.y + DY };
  Audio.init();
  if (pauseClick(hp)) return;
  if (PAUSE.on) return;
  if (INV.btn && invClick(hp)) return;
  if (INV.open) return;
  if (inRect(hp, BTN.music)) { Audio.toggleMusic(); return; }
  if (inRect(hp, BTN.sfx)) { Audio.toggleSfx(); return; }
  if (S.phase === 'start') { beginWorld(); return; }
  if (S.phase === 'ask') {
    if (inRect(p, BTN.yes)) { const id = S.ask; S.ask = null; if (id === 'up') leaveUp(); else startLore(); }
    else if (inRect(p, BTN.no)) { S.ask = null; S.phase = 'play'; Audio.play('tink'); }
    return;

}

Object.assign(ME, { S, update, draw, canBack: () => false, back: () => {}, events: null, ctl: CTL, test: TEST, enter, enterFromMenu });

// ======================================================================
// LEVEL 2 – ONE PAGE: city, sky and deep sea live in the same canvas.
// Switching worlds is a continuous camera move (like Level 1):
//   'up'   city → sky      : the city slides down, the cloud world comes in from the top
//   'down' sky → city      : Kai falls through the cloud floor, the city comes up from below
//   'dive' city → deep sea : the camera dives with Kai under the water surface
//   'cut'  new game        : instant
// During a move both worlds are drawn at the same time; Kai is drawn by the controller.
// ======================================================================
let CUR = null, TRANS = null;
// LEVEL 3 – DINOLAND: the dino valley and the Felsenhöhe above it (the Lavahöhlen follow).
const FACTORY = { tal: makeTal, hoehe: makeHoehe, lava: makeLava };
const THEME = { tal: 'dino', hoehe: 'hoehe', lava: 'lava' };
const worldKey = file => (file || 'tal').replace('.html', '');
function makeWorld(file, query) { const key = worldKey(file); const w = FACTORY[key](new URLSearchParams(query || '')); w.key = key; w.fromFinal = /from=replay/.test(query || ''); return w; }
function activate(w) {
  // a fresh world always starts with normal background music (e.g. the harp paused it in the sky, turbo sped it up)
  if (!PAUSE.on) Audio.pauseBg(false); Audio.setFast(false); Audio.setBoss(false);
  CUR = w; SAVE.where = w.key; writeSave(); window.__S = w.S; window.__test = w.test; window.__events = w.events; window.__world = w.key; }

const ease = u => u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
const easeOut = u => 1 - (1 - u) * (1 - u);
const easeIn = u => u * u;
const lerp = (a, b, u) => a + (b - a) * u;

function beginTransition(file, query) {
  if (TRANS) return;
  const from = CUR, toKey = worldKey(file);
  const kind = from.key === 'tal' && toKey === 'lava' ? 'pipe'
    : (from.key === 'stadt' && toKey === 'himmel') || (from.key === 'tal' && toKey === 'hoehe') || (from.key === 'lava' && toKey === 'tal') ? 'up'
    : (from.key === 'himmel' && toKey === 'stadt') || (from.key === 'hoehe' && toKey === 'tal') ? 'down'
    : /final=1/.test(query) ? 'cut'
    : from.key === 'stadt' && toKey === 'tiefsee' ? (/pipe=1/.test(query) ? 'pipe' : 'dive')
    : from.key === 'tiefsee' && toKey === 'stadt' && /from=tiefsee/.test(query) ? 'surface' : 'cut';
  const next = makeWorld(file, query);
  if (!PAUSE.on) Audio.pauseBg(false);
  if (kind === 'cut') { activate(next); Audio.setTheme(THEME[toKey]); return; }
  const k = from.S.kai;
  // Kai's start / end point ON THE SCREEN (the dino worlds scroll, so the camera is taken off)
  const x1 = next.S.kai && next.S.cam != null ? next.S.kai.x - next.S.cam : 250;
  TRANS = { kind, splash: /splash=1/.test(query || ''), from, to: next, t: 0, T: kind === 'up' ? 140 : kind === 'down' ? 130 : kind === 'pipe' ? 170 : 150, x0: k.x - (from.S.cam || 0), x1, y0: k.y, splashed: false,
    climb: kind !== 'pipe' && ['tal', 'hoehe', 'lava'].includes(from.key), lava: toKey === 'lava' || from.key === 'lava' };
  from.S.hideKai = true; from.S.noHud = true; next.S.hideKai = true; next.S.noHud = true;
  next.S.phase = 'transit';
}

function updateTransition(dt) {
  const tr = TRANS; tr.t += dt;
  const p = Math.min(1, tr.t / tr.T);
  // the old world keeps running its own animation (scrolling, particles); the new one scrolls along
  tr.from.update(dt);
  const ns = tr.to.S; ns.t = (ns.t || 0) + dt; ns.scroll = (ns.scroll || 0) + (tr.kind === 'up' ? 2.5 : 3) * dt;
  if ((tr.kind === 'dive' && p > 0.3 || tr.kind === 'surface' && p > 0.5) && !tr.splashed) { tr.splashed = true; Audio.play('pop'); Audio.play('air'); }
  if (tr.kind === 'up' && p > 0.55 && !tr.themed) { tr.themed = true; Audio.setTheme(THEME[tr.to.key] || 'sky'); }
  if (tr.kind !== 'up' && p > 0.55 && !tr.themed) { tr.themed = true; Audio.setTheme(THEME[tr.to.key]); }
  if (p >= 1) {
    const w = tr.to; TRANS = null;
    w.S.hideKai = false; w.S.noHud = false;
    activate(w); w.enter();
  }
}

// camera offset of the OLD world (the new one sits right above / below it)
const PIPE_GAP = 260;      // underground between the street and the sea
function transOffsets(tr, p) {
  if (tr.kind === 'surface') { const c = VH * ease(clamp((p - 0.1) / 0.88, 0, 1)); return { from: c, to: c - VH, seam: c }; }
  if (tr.kind === 'pipe') { const c = -(VH + PIPE_GAP) * ease(clamp((p - 0.12) / 0.86, 0, 1)); return { from: c, to: c + VH + PIPE_GAP, seam: c + VH }; }
  if (tr.kind === 'up') { const c = VH * ease(clamp((p - 0.12) / 0.88, 0, 1)); return { from: c, to: c - VH, seam: c }; }
  const c = -VH * ease(clamp((p - 0.08) / 0.9, 0, 1)); return { from: c, to: c + VH, seam: c + VH };
}
// where Kai is on the screen during the move
function transKai(tr, p) {
  const x = lerp(tr.x0, tr.x1 ?? 250, ease(Math.min(1, p * 1.4)));
  let y, o = { wings: tr.from.S.t * 0.45, armsUp: false, tilt: 0, crouch: 3, diver: false };
  if (tr.climb) {
    // Dinoland: climbing up the liana to the Felsenhöhe / down again into the valley – no wings
    o.wings = undefined; o.armsUp = p < 0.85; o.crouch = p > 0.9 ? 6 : 4;
    if (tr.kind === 'up') y = p < 0.45 ? lerp(tr.y0, 40, ease(p / 0.45)) : lerp(40, FLOOR, ease((p - 0.45) / 0.55));
    else y = p < 0.5 ? lerp(tr.y0, 150, ease(p / 0.5)) : lerp(150, FLOOR, easeIn((p - 0.5) / 0.5));
    return { x, y, o };
  }
  if (tr.kind === 'up') {
    // hoisted up: fast rise, then he settles where the sky game starts (y 200)
    y = p < 0.35 ? lerp(tr.y0, 70, easeOut(p / 0.35)) : lerp(70, 200, ease((p - 0.35) / 0.65));
    o.armsUp = p < 0.5; o.tilt = p < 0.35 ? -0.12 : 0; o.wings = tr.t * 0.45;
  } else if (tr.kind === 'down') {
    // falls through the clouds, the camera catches up, then he lands on the street (FLOOR)
    y = p < 0.55 ? lerp(tr.y0, 150, ease(p / 0.55)) : lerp(150, FLOOR, easeIn((p - 0.55) / 0.45));
    o.armsUp = p < 0.85; o.wings = p < 0.88 ? tr.t * 0.3 : undefined; o.crouch = p > 0.92 ? 7 : 3;
  } else if (tr.kind === 'surface') {
    // swims up, breaks through the water surface and lands on the street
    y = p < 0.6 ? lerp(tr.y0, 120, ease(p / 0.6)) : lerp(120, FLOOR, easeIn((p - 0.6) / 0.4));
    o.wings = undefined; o.diver = p < 0.55; o.armsUp = p > 0.45 && p < 0.9; o.crouch = p > 0.93 ? 7 : 3;
  } else if (tr.kind === 'pipe') {
    // sinks into the tube, slides down the underground, comes out at the top of the sea
    const endY = tr.lava ? FLOOR : 210;
    y = p < 0.12 ? lerp(tr.y0, tr.y0 + 70, easeIn(p / 0.12)) : lerp(tr.y0 + 70, endY, ease((p - 0.12) / 0.88));
    o.wings = undefined; o.diver = !tr.lava && p > 0.75; o.armsUp = p > 0.08 && p < 0.8; o.crouch = 5;
    return { x: p < 0.78 ? tr.x0 : lerp(tr.x0, tr.lava ? tr.x1 : 250, ease((p - 0.78) / 0.22)), y, o };
  } else if (tr.splash) {
    // came off the harbor pier: already in the water – straight down to where the sea game starts
    y = lerp(tr.y0, 210, ease(p));
    o.wings = undefined; o.diver = p > 0.25; o.armsUp = p < 0.3; o.tilt = p < 0.4 ? 0.35 : 0;
  } else {
    // dive: hop off the pier, splash, sink to where the sea game starts (y 210)
    y = p < 0.22 ? lerp(tr.y0, tr.y0 - 70, easeOut(p / 0.22)) : lerp(tr.y0 - 70, 210, ease((p - 0.22) / 0.78));
    o.wings = undefined; o.diver = p > 0.38; o.armsUp = p < 0.38; o.tilt = p < 0.22 ? -0.1 : p < 0.5 ? 0.35 : 0;
  }
  return { x, y, o };
}
function drawSeam(tr, y) {
  ctx.save();
  if (tr.kind === 'pipe') {
    // underground: earth, stones, and the green tube going straight down
    const y2 = y + PIPE_GAP;
    const g = ctx.createLinearGradient(0, y, 0, y2); g.addColorStop(0, '#6b4a2e'); g.addColorStop(0.5, '#4a321f'); g.addColorStop(1, tr.lava ? '#3a1c14' : '#2a3f4f');
    ctx.fillStyle = g; ctx.fillRect(0, y, W, PIPE_GAP);
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    for (let i = 0; i < 40; i++) { ctx.beginPath(); ctx.ellipse((i * 137) % W, y + 20 + (i * 53) % (PIPE_GAP - 40), 10 + i % 4 * 4, 6 + i % 3 * 2, 0, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore(); return;
  }
  if (tr.lava) {
    // between the valley and the lava caves: a band of rock and earth
    const g = ctx.createLinearGradient(0, y - 60, 0, y + 60); g.addColorStop(0, '#6b4a2e'); g.addColorStop(0.5, '#3a281c'); g.addColorStop(1, '#2a1810');
    ctx.fillStyle = g; ctx.fillRect(0, y - 60, W, 120);
    ctx.restore(); return;
  }
  if (tr.kind === 'dive' || tr.kind === 'surface') {
    // water surface between the harbor and the deep sea
    const g = ctx.createLinearGradient(0, y - 30, 0, y + 30);
    g.addColorStop(0, 'rgba(90,190,230,0)'); g.addColorStop(0.45, 'rgba(120,215,245,0.95)'); g.addColorStop(1, 'rgba(10,70,120,0)');
    ctx.fillStyle = g; ctx.fillRect(0, y - 30, W, 60);
    ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 2; ctx.beginPath();
    for (let x = 0; x <= W; x += 16) ctx.lineTo(x, y + Math.sin(x * 0.05 + TRANS.t * 0.2) * 3);
    ctx.stroke();
  } else {
    // a soft band of clouds hides the seam between city sky and cloud floor
    ctx.fillStyle = '#ffffff';
    for (let i = 0; i < 18; i++) { const x = i * 78 - 20, r = 30 + (i * 37 % 17); ctx.beginPath(); ctx.arc(x, y + (i % 2 ? -6 : 6), r, 0, Math.PI * 2); ctx.fill(); }
    const g = ctx.createLinearGradient(0, y - 60, 0, y + 60);
    g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, 'rgba(255,255,255,0.85)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.fillRect(0, y - 60, W, 120);
  }
  ctx.restore();
}
// the open space above each world (the screen is taller than the world): matching sky / water colour
function drawBand(w) {
  if (DY <= 0) return;
  const S2 = w.S, cols = w.key === 'tal' ? ['#f2a65a', '#f7c47e'] : w.key === 'hoehe' ? ['#4fa8e6', '#5fb3ea'] : w.key === 'lava' ? ['#140a0a', '#1a0f10'] : w.key === 'stadt' ? ['#479fdc', '#5fb8ec'] : w.key === 'tiefsee' ? ['#47bde3', '#1a8fbf']
    : S2.phase === 'foot' ? ['#7cc9f4', '#7cc9f4'] : ['#55b3ec', '#6cc3f2'];
  const g = ctx.createLinearGradient(0, 0, 0, DY + 1); g.addColorStop(0, cols[0]); g.addColorStop(1, cols[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, DY + 1);
  if (w.key === 'himmel' && S2.phase !== 'foot') {
    // a few soft clouds drifting in the high sky
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    for (let i = 0; i < 7; i++) {
      const x = ((i * 260 - (S2.scroll || 0) * 0.12) % (W + 300) + W + 300) % (W + 300) - 150, y = 30 + ((i * 53) % Math.max(40, DY - 30));
      ctx.beginPath(); ctx.ellipse(x, y, 60, 16, 0, 0, Math.PI * 2); ctx.ellipse(x + 30, y - 10, 34, 16, 0, 0, Math.PI * 2); ctx.fill();
    }
  }
  if (w.key === 'tiefsee') {
    // light rays from the surface
    ctx.fillStyle = 'rgba(255,255,255,0.07)';
    for (let i = 0; i < 5; i++) { const x = i * 300 + 80; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + 60, 0); ctx.lineTo(x + 140, DY + 1); ctx.lineTo(x + 40, DY + 1); ctx.closePath(); ctx.fill(); }
  }
}
function drawWorldFull(w) { ctx.save(); ctx.translate(0, DY); w.draw(); ctx.restore(); }
function drawWorldAt(w, off) {
  if (off >= VH || off <= -VH) return;
  ctx.save(); ctx.beginPath(); ctx.rect(0, Math.max(0, off), W, VH - Math.abs(off)); ctx.clip();
  ctx.translate(0, off); drawWorldFull(w); ctx.restore();
}
function drawTransition() {
  const tr = TRANS, p = Math.min(1, tr.t / tr.T), off = transOffsets(tr, p);
  ctx.clearRect(0, 0, W, VH);
  drawWorldAt(tr.from, off.from); drawWorldAt(tr.to, off.to);
  drawSeam(tr, off.seam);
  const kk = transKai(tr, p);
  let tube = null;
  if (tr.kind === 'pipe') {
    // the tube from the city street down through the earth into the sea
    const top = tr.y0 + DY + off.from, bot = off.seam + PIPE_GAP + 50, x1 = tr.x0 - 40, x2 = tr.x0 + 40;
    tube = { top, bot, x1, x2 };
    const g = ctx.createLinearGradient(x1, 0, x2, 0);
    if (tr.lava) { g.addColorStop(0, '#5a4a48'); g.addColorStop(0.3, '#b8a69c'); g.addColorStop(0.55, '#8a7a74'); g.addColorStop(1, '#3a2c2a'); }
    else { g.addColorStop(0, '#1f7a34'); g.addColorStop(0.3, '#4fc45f'); g.addColorStop(0.55, '#2f9e45'); g.addColorStop(1, '#165c27'); }
    ctx.fillStyle = g; ctx.fillRect(x1, Math.max(off.seam, top + 20), x2 - x1, bot - Math.max(off.seam, top + 20));
    ctx.fillStyle = 'rgba(10,40,20,0.55)'; ctx.fillRect(x1 + 8, top + 6, x2 - x1 - 16, bot - top - 6);
    ctx.fillStyle = '#165c27'; ctx.beginPath(); ctx.roundRect(x1 - 6, bot - 14, x2 - x1 + 12, 16, 4); ctx.fill(); ctx.strokeStyle = OUT; ctx.lineWidth = 2; ctx.stroke();
  }
  drawKaiFigure(Object.assign({ x: kk.x, y: kk.y + DY, push: 0, flip: 0, wind: 0.8, outfit: SAVE.outfit, prop: tr.t * 0.3 }, kk.o));
  if (tube) {
    // the front of the tube is see-through, so Kai is visible sliding inside
    ctx.fillStyle = TRANS && TRANS.lava ? 'rgba(200,170,150,0.25)' : 'rgba(60,180,80,0.38)'; ctx.fillRect(tube.x1, tube.top + 20, tube.x2 - tube.x1, tube.bot - tube.top - 34);
    ctx.strokeStyle = OUT; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(tube.x1, tube.top + 20); ctx.lineTo(tube.x1, tube.bot - 14); ctx.moveTo(tube.x2, tube.top + 20); ctx.lineTo(tube.x2, tube.bot - 14); ctx.stroke();
  }
}

// ================= TITLE MENU · CONFIRM · NEW GAME =================
// Progress is saved automatically (browser storage on this device).
// With a saved game the page opens with WEITERSPIELEN (big) and "Komplett neu anfangen" (small, asks first).
const MENU = { open: false, btns: {} }, CONFIRM = { open: false, btns: {} };
const hasProgress = () => !!(SAVE.started || SAVE.done.tal || SAVE.done.hoehe || SAVE.done.lava || SAVE.items.magmaBoard || SAVE.seenHoehe || SAVE.seenLava);
function askNewGame() { CONFIRM.open = true; Audio.play('warn'); }
function doNewGame() {
  const keep = { char: SAVE.char, outfit: SAVE.outfit, outfitKai: SAVE.outfitKai, outfitBali: SAVE.outfitBali, owned: SAVE.owned, importedL2: true, best: SAVE.best || 0 };
  resetSave(true); Object.assign(SAVE, keep); writeSave();        // a new game keeps who rides and the clothes
  CONFIRM.open = false; MENU.open = false; PAUSE.on = false; Audio.pauseBg(false); INV.open = false;
  TRANS = null; activate(makeWorld('tal.html', ''));            // fresh valley start screen
}
function continueGame() {
  MENU.open = false; CUR.S.noHud = false;
  CUR.enterFromMenu();
}
// EXIT / game over "NEIN": back to the title menu of the game (the current world is rebuilt like after a reload)
function toMainMenu() {
  Audio.stopSong(); Audio.grindLoop(false); Audio.setBoss(false); Audio.setFast(false);
  PAUSE.on = false; INV.open = false; CONFIRM.open = false; TRANS = null;
  CTRL.shootP.clear(); CTRL.jumpP.clear(); CTRL.right = false; CTRL.pad.clear(); CTRL.lastDir = 0;
  if ((SAVE.lives ?? LIVES_MAX) <= 0) restartWorldSave();      // EXIT right from the game-over screen

    return;
  }
  if (BACK.btn && backVisible() && inB(p, BACK.btn)) { e.stopImmediatePropagation(); e.preventDefault(); Audio.init(); doBack(); return; }
  if (!CONFIRM.open && !MENU.open && !(PAUSE.on && PAUSE.resetBtn)) return;
  if (CONFIRM.open) {
    e.stopImmediatePropagation(); e.preventDefault(); Audio.init();
    if (inB(p, CONFIRM.btns.yes)) doNewGame(); else if (inB(p, CONFIRM.btns.no)) { CONFIRM.open = false; Audio.play('tink'); }
    return;
  }
  if (MENU.open) {
    e.stopImmediatePropagation(); e.preventDefault(); Audio.init();
    if (inB(p, MENU.btns.cont)) continueGame();
    else if (inB(p, MENU.btns.reset)) askNewGame();
    else if (inB(p, MENU.btns.app)) goToApp();
    else if (inB(p, MENU.btns.kai)) { setCharacter('kai'); Audio.play('flip'); }
    else if (inB(p, MENU.btns.bali)) { setCharacter('bali'); Audio.play('flip'); }
    else langPickerClick({ x: p.x, y: p.y - DY });
    return;
  }
  if (PAUSE.on && inB(p, PAUSE.resetBtn)) { e.stopImmediatePropagation(); e.preventDefault(); askNewGame(); }
}, true);

// ================= MAIN LOOP =================
const URLQ = new URLSearchParams(location.search);
if (URLQ.get('world')) activate(makeWorld(URLQ.get('world'), location.search.replace(/^\?/, '')));
else if (hasProgress()) {
  activate(makeWorld(FACTORY[SAVE.where] ? SAVE.where : 'tal', 'from=continue'));
  MENU.open = true; CUR.S.noHud = true;
} else { activate(makeWorld('tal', '')); MENU.open = true; CUR.S.noHud = true; }
Audio.setTheme(THEME[CUR.key]);
let lastT = performance.now();
function mainLoop(now) {
  const dt = Math.min((now - lastT) / 16.667, 3); lastT = now;
  if (TRANS) { updateTransition(dt); if (TRANS) drawTransition(); else drawWorldFull(CUR); READ.btn = null; }
  else {
    if (!INV.open && !PAUSE.on && !MENU.open && !CONFIRM.open) { updateControls(); CUR.update(dt); readSlowMessages(dt); }
    readBegin(); drawWorldFull(CUR); drawL4Button(); readEnd(); drawControls(); if (!CUR.S.noHud) drawPauseButton(); drawInventoryPanel(); drawBackButton(); drawPauseOverlay(); drawExitButton(); drawPauseExtras(); drawMenu(); drawConfirm(); drawReadButton(!MENU.open && !CONFIRM.open && !PAUSE.on && !INV.open);
  }   // paused while ITEMS is open or PAUSE
  requestAnimationFrame(mainLoop);
}
// arrow keys: held = ride (the worlds read the direction through updateControls)
const isL = c => c === 'ArrowLeft' || c === 'KeyA', isR = c => c === 'ArrowRight' || c === 'KeyD';
window.addEventListener('keyup', e => { if (isL(e.code)) CTRL.keyL = false; if (isR(e.code)) CTRL.keyR = false; }, true);
window.addEventListener('keydown', e => {
  if (!e.repeat && isL(e.code)) { CTRL.keyL = true; CTRL.lastPressed = -1; }
  if (!e.repeat && isR(e.code)) { CTRL.keyR = true; CTRL.lastPressed = 1; }
  if (CONFIRM.open) { if (e.code === 'Escape') CONFIRM.open = false; e.stopImmediatePropagation(); return; }
  if (MENU.open) { if (e.code === 'Space' || e.code === 'Enter') continueGame(); e.stopImmediatePropagation(); return; }
  if (e.code === 'KeyP') { if (!TRANS) setPause(!PAUSE.on); }
  else if (e.code === 'KeyI') { if (!PAUSE.on) { INV.open = !INV.open; Audio.play('tink'); } }
  else if (e.code === 'Escape') { if (INV.open) INV.open = false; else if (backVisible()) doBack(); }
}, true);
requestAnimationFrame(mainLoop);
window.__ctl = { toMainMenu, CTRL, beginTransition, get TRANS() { return TRANS; }, get CUR() { return CUR; } };
})();
</script>
