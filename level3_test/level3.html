<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>INVERT – Level 3</title>
<style>
  html, body { margin: 0; padding: 0; background: #020c18; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: Arial, Helvetica, sans-serif; }
  canvas { display: block; width: 100vw; height: auto; max-height: 100vh; object-fit: contain; touch-action: none; user-select: none; -webkit-user-select: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';
const W = 1280, H = 340;      // world space of every game scene
const FLOOR = 300;            // street / cloud floor / sand line
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const dpr = Math.min(window.devicePixelRatio || 1, 2);
// The view is as tall as the screen allows (landscape phone ≈ 2.1:1 → ~600 high).
// The world sits at the bottom; the extra height (DY) is open space above it (more sky / more water).
let VH = H, DY = 0;
function fitView() {
  const a = Math.max(1, window.innerWidth) / Math.max(1, window.innerHeight);
  VH = Math.round(Math.min(760, Math.max(H, W / a))); DY = VH - H;
  canvas.width = W * dpr; canvas.height = VH * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
fitView();
window.addEventListener('resize', fitView); window.addEventListener('orientationchange', () => setTimeout(fitView, 200));

const OUT = '#14202e';        // outline colour (matches Kai's flat style)
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));


// =====================================================================
//  LEVEL 3 (DINOLAND) – shared game state (valley / rocks / lava caves), languages, progress box
// =====================================================================
const SAVE_KEY = 'invert61-level3';
const SAVE_DEFAULT = {
  lang: 'de', hearts: 5, lives: 3, coins: 0, pearls: 0, starfish: 0,
  items: { magmaBoard: false, slingshot: false },
  weapon: {},
  outfit: { char: 'kai', tee: '#1f3c6e', cap: '#1e4fa3', beanie: false, backpack: false, shoes: '#1b1b22', halo: false },
  // two playable characters, each with her / his own clothes. SAVE.outfit is always the one being played.
  char: 'kai',
  outfitKai: null,
  outfitBali: { char: 'bali', tee: '#f6a3c4', cap: null, beanie: false, backpack: false, shoes: '#ffffff', halo: false, bottom: 'jeans' },
  owned: {},                                   // bought clothes
  done: { tal: false, hoehe: false, lava: false },
  mini: { rodeo: null, fossil: null, ptero: null, lore: null },
  checkpoint: null,                            // snapshot at the start of the current world
};
function loadSave() {
  try {
    const raw = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
    if (raw) return Object.assign({}, SAVE_DEFAULT, raw, { items: Object.assign({}, SAVE_DEFAULT.items, raw.items), outfit: Object.assign({}, SAVE_DEFAULT.outfit, raw.outfit), outfitBali: Object.assign({}, SAVE_DEFAULT.outfitBali, raw.outfitBali), done: Object.assign({}, SAVE_DEFAULT.done, raw.done), mini: Object.assign({}, SAVE_DEFAULT.mini, raw.mini) });
  } catch (e) {}
  return JSON.parse(JSON.stringify(SAVE_DEFAULT));
}
const SAVE = loadSave();
// first start of Level 3: take over who rides, the clothes and the language from Level 2
if (!SAVE.importedL2) {
  try {
    const l2 = JSON.parse(localStorage.getItem('invert61-level2') || 'null');
    if (l2) for (const k of ['char', 'outfit', 'outfitKai', 'outfitBali', 'owned', 'lang']) if (l2[k] != null) SAVE[k] = l2[k];
  } catch (e) {}
  SAVE.importedL2 = true;
}
SAVE.weapon = SAVE.weapon || {}; SAVE.owned = SAVE.owned || {}; if (SAVE.outfit.halo) SAVE.owned.halo = true;
SAVE.char = SAVE.char === 'bali' ? 'bali' : 'kai'; SAVE.outfit.char = SAVE.char;
// switch between Kai and Bali: the clothes of the one who leaves are kept, the other one's clothes come back
function setCharacter(c) {
  if (c !== 'kai' && c !== 'bali') return;
  if (SAVE.char === c) return;
  if (SAVE.char === 'bali') SAVE.outfitBali = SAVE.outfit; else SAVE.outfitKai = SAVE.outfit;
  SAVE.char = c;
  SAVE.outfit = c === 'bali' ? Object.assign({}, SAVE_DEFAULT.outfitBali, SAVE.outfitBali) : Object.assign({}, SAVE_DEFAULT.outfit, SAVE.outfitKai || {});
  SAVE.outfit.char = c;
  writeSave();
}
const forChar = it => !it.who || it.who === SAVE.char;   // items only one of the two can wear
function writeSave() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch (e) {} }
function resetSave(keepLang = true) { const lang = SAVE.lang; Object.assign(SAVE, JSON.parse(JSON.stringify(SAVE_DEFAULT))); if (keepLang) SAVE.lang = lang; writeSave(); }
// remember the state at the start of a world, so a game over only restarts that world
function setCheckpoint(world) {
  SAVE.checkpoint = { world, hearts: SAVE.hearts, coins: SAVE.coins, pearls: SAVE.pearls, starfish: SAVE.starfish, items: Object.assign({}, SAVE.items) };
  SAVE.cps = Object.assign({}, SAVE.cps, { [world]: SAVE.checkpoint }); writeSave();
}
// back in a world that was already started (e.g. the city after the sky): use that world's own checkpoint again
function useCheckpoint(world) { if (SAVE.cps && SAVE.cps[world]) { SAVE.checkpoint = SAVE.cps[world]; writeSave(); } else setCheckpoint(world); }
// world restart (all lives lost): hearts, coins, pearls and starfish go back to the world start –
// but bought things STAY, and coins spent on them stay spent (see spendCoins)
function restoreCheckpoint() { const c = SAVE.checkpoint; if (!c) return; Object.assign(SAVE, { hearts: c.hearts, coins: Math.max(0, c.coins), pearls: c.pearls, starfish: c.starfish }); writeSave(); }
// a purchase also lowers the coins the checkpoint would give back
function spendCoins(n) { for (const c of new Set([SAVE.checkpoint, ...Object.values(SAVE.cps || {})])) if (c) c.coins = Math.max(0, c.coins - n); writeSave(); }
// ---------------- lives ----------------
// 3 lives: when all hearts are gone one life is lost and Kai simply carries on right there with full hearts.
// Only when all 3 lives are gone the current world starts again (from its checkpoint).
const LIVES_MAX = 3, LIFE_HEARTS = 5;
// Level 3 only opens when all three bosses are beaten: garbage truck (city), harp finale (sky), giant squid (sea)
const allBossesDone = () => !!(SAVE.done.tal && SAVE.done.hoehe && SAVE.done.lava);
function openBosses() {
  const l = [];
  if (!SAVE.done.tal) l.push(tx('T-Rex im Dino-Tal besiegen'));
  if (!SAVE.done.hoehe) l.push(tx('Flugsaurier-Mama auf der Felsenhöhe besiegen'));
  if (!SAVE.done.lava) l.push(tx('Riesenvulkan in den Lavahöhlen besiegen'));
  return l;
}
function loseLife() { SAVE.lives = Math.max(0, (SAVE.lives ?? LIVES_MAX) - 1); writeSave(); return SAVE.lives > 0; }
function restartWorldSave() { restoreCheckpoint(); SAVE.lives = LIVES_MAX; writeSave(); }
// ======================================================================
// INVENTORY (top left): weapons + outfit Kai owns, opened as a drop-down. The game pauses while it is open.
// ======================================================================
const INV = { open: false, btn: null, panel: null, chips: [] };
const INV_WEAPONS = [];   // Level 3: the slingshot (rocks) and water bombs (lava caves) come with the next worlds
const OUTFIT_GROUPS = [
  { label: 'Kopf', opts: [
    { id: 'capBlue', who: 'kai', name: 'Blaue Kappe', sw: '#1e4fa3', owned: () => true, worn: o => !o.beanie && (o.cap || '#1e4fa3') === '#1e4fa3', apply: o => { o.cap = '#1e4fa3'; o.beanie = false; } },
    { id: 'capRed', who: 'kai', name: 'Rote Kappe', sw: '#d8352c', worn: o => !o.beanie && o.cap === '#d8352c', apply: o => { o.cap = '#d8352c'; o.beanie = false; } },
    { id: 'capGreen', who: 'kai', name: 'Grüne Kappe', sw: '#2f8a5f', worn: o => !o.beanie && o.cap === '#2f8a5f', apply: o => { o.cap = '#2f8a5f'; o.beanie = false; } },
    { id: 'hairFree', who: 'bali', name: 'Ohne Mütze', sw: '#e8cd8e', owned: () => true, worn: o => !o.beanie && !o.cap, apply: o => { o.cap = null; o.beanie = false; } },
    { id: 'capBali', who: 'bali', name: 'Schildkappe', sw: '#f48fb8', worn: o => !o.beanie && o.cap === '#f48fb8', apply: o => { o.cap = '#f48fb8'; o.beanie = false; } },
    { id: 'capGold', name: 'Goldene Kappe', sw: '#e8b923', worn: o => !o.beanie && o.cap === '#e8b923', apply: o => { o.cap = '#e8b923'; o.beanie = false; } },
    { id: 'beanie', name: 'Beanie', sw: '#7a3fb8', worn: o => !!o.beanie, apply: o => { o.beanie = true; } },
  ] },
  { label: 'T-Shirt', opts: [
    { id: 'teeBlue', who: 'kai', name: 'Blaues T-Shirt', sw: '#1f3c6e', owned: () => true, worn: o => (o.tee || '#1f3c6e') === '#1f3c6e', apply: o => { o.tee = '#1f3c6e'; } },
    { id: 'teePink', who: 'bali', name: 'Rosa T-Shirt', sw: '#f6a3c4', owned: () => true, worn: o => (o.tee || '#f6a3c4') === '#f6a3c4', apply: o => { o.tee = '#f6a3c4'; } },
    { id: 'teeRed', name: 'Rotes T-Shirt', sw: '#c8352c', worn: o => o.tee === '#c8352c', apply: o => { o.tee = '#c8352c'; } },
    { id: 'teeYellow', name: 'Gelbes T-Shirt', sw: '#e0a81e', worn: o => o.tee === '#e0a81e', apply: o => { o.tee = '#e0a81e'; } },
  ] },
  { label: 'Hose', opts: [
    { id: 'jeans', who: 'bali', name: 'Jeans', sw: '#4a78b8', owned: () => true, worn: o => (o.bottom || 'jeans') === 'jeans', apply: o => { o.bottom = 'jeans'; } },
    { id: 'shorts', who: 'bali', name: 'Kurze Hose', sw: '#4a78b8', worn: o => o.bottom === 'shorts', apply: o => { o.bottom = 'shorts'; } },
    { id: 'skirt', who: 'bali', name: 'Rock', sw: '#d94f7c', worn: o => o.bottom === 'skirt', apply: o => { o.bottom = 'skirt'; } },
  ] },
  { label: 'Schuhe', opts: [
    { id: 'shoesDark', who: 'kai', name: 'Schwarze Schuhe', sw: '#1b1b22', owned: () => true, worn: o => (o.shoes || '#1b1b22') === '#1b1b22', apply: o => { o.shoes = '#1b1b22'; } },
    { id: 'shoesWhite', who: 'bali', name: 'Weisse Schuhe', sw: '#ffffff', owned: () => true, worn: o => (o.shoes || '#ffffff') === '#ffffff', apply: o => { o.shoes = '#ffffff'; } },
    { id: 'shoesRed', name: 'Rote Schuhe', sw: '#d8352c', worn: o => o.shoes === '#d8352c', apply: o => { o.shoes = '#d8352c'; } },
  ] },
  { label: 'Extras', toggle: true, opts: [
    { id: 'backpack', name: 'Rucksack', sw: '#e0702b', worn: o => !!o.backpack, apply: o => { o.backpack = !o.backpack; } },
    { id: 'halo', name: 'Heiligenschein', sw: '#ffd23a', worn: o => !!o.halo, apply: o => { o.halo = !o.halo; } },
  ] },
];
// the two characters (first row in ITEMS)
const INV_CHARS = [
  { id: 'kai', name: 'Kai', worn: () => SAVE.char === 'kai' },
  { id: 'bali', name: 'Bali', worn: () => SAVE.char === 'bali' },
];
const optOwned = it => it.owned ? it.owned() : !!SAVE.owned[it.id];
function invCount() { return INV_WEAPONS.filter(w => w.owned() && w.id !== 'arrow').length + OUTFIT_GROUPS.reduce((n, g) => n + g.opts.filter(o => forChar(o) && !o.owned && optOwned(o)).length, 0); }
function drawInvButton(x, y) {
  const b = { x, y, w: 92, h: 26 }; INV.btn = b;
  ctx.save(); ctx.fillStyle = INV.open ? 'rgba(255,210,58,0.95)' : 'rgba(10,20,40,0.6)'; ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 10); ctx.fill();
  // little backpack icon
  ctx.translate(b.x + 15, b.y + 13); ctx.fillStyle = '#e0702b'; ctx.strokeStyle = OUT; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.roundRect(-6, -7, 12, 14, 3); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#c2551a'; ctx.fillRect(-4, 0, 8, 4);
  ctx.beginPath(); ctx.arc(0, -7, 3, Math.PI, 0); ctx.stroke();
  ctx.translate(-b.x - 15, -b.y - 13);
  ctx.fillStyle = INV.open ? OUT : '#ffffff'; ctx.font = 'bold 11px Arial'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(tx('ITEMS') + ' ' + (INV.open ? '▴' : '▾'), b.x + 27, b.y + 13);
  const n = invCount();
  if (n > 0) { ctx.fillStyle = '#ff5a4f'; ctx.beginPath(); ctx.arc(b.x + b.w - 4, b.y + 3, 8, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#fff'; ctx.font = 'bold 10px Arial'; ctx.textAlign = 'center'; ctx.fillText(String(n), b.x + b.w - 4, b.y + 3.5); }
  ctx.restore();
}
function drawInvSwatch(id, sw, cx, cy) {
  ctx.save(); ctx.translate(cx, cy); ctx.strokeStyle = OUT; ctx.lineWidth = 1.3; ctx.fillStyle = sw;
  if (id === 'arrow') { ctx.strokeStyle = '#ffd23a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-8, 0); ctx.lineTo(7, 0); ctx.stroke(); ctx.fillStyle = '#fff6b0'; ctx.beginPath(); ctx.moveTo(9, 0); ctx.lineTo(3, -4); ctx.lineTo(3, 4); ctx.closePath(); ctx.fill(); }
  else if (id === 'starSea') { ctx.strokeStyle = '#c9d3dc'; ctx.lineWidth = 2; for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; ctx.beginPath(); ctx.moveTo(Math.cos(a) * 3, Math.sin(a) * 3); ctx.lineTo(Math.cos(a) * 9, Math.sin(a) * 9); ctx.stroke(); } }
  else if (id === 'star') { ctx.fillStyle = '#ffd23a'; ctx.beginPath(); for (let i = 0; i < 10; i++) { const r = i % 2 ? 3.5 : 8, a = i * Math.PI / 5 - Math.PI / 2; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); } ctx.closePath(); ctx.fill(); ctx.stroke(); }
  else if (id === 'harpoon') { ctx.strokeStyle = '#c9d3dc'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(-9, 0); ctx.lineTo(6, 0); ctx.stroke(); ctx.fillStyle = '#c9d3dc'; ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(4, -4); ctx.lineTo(4, 4); ctx.closePath(); ctx.fill(); }
  else if (id.startsWith('cap')) { ctx.beginPath(); ctx.arc(0, 2, 7, Math.PI, 0); ctx.lineTo(11, 2); ctx.lineTo(-7, 2); ctx.closePath(); ctx.fill(); ctx.stroke(); }
  else if (id === 'beanie') { ctx.beginPath(); ctx.arc(0, 3, 7, Math.PI, 0); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.arc(0, -5, 2.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); }
  else if (id.startsWith('tee')) { ctx.beginPath(); ctx.moveTo(-8, -5); ctx.lineTo(-3, -7); ctx.lineTo(3, -7); ctx.lineTo(8, -5); ctx.lineTo(6, -1); ctx.lineTo(4, -2); ctx.lineTo(4, 7); ctx.lineTo(-4, 7); ctx.lineTo(-4, -2); ctx.lineTo(-6, -1); ctx.closePath(); ctx.fill(); ctx.stroke(); }
  else if (id.startsWith('shoes')) { ctx.beginPath(); ctx.moveTo(-8, 3); ctx.lineTo(-8, -3); ctx.lineTo(-1, -3); ctx.quadraticCurveTo(8, -1, 9, 4); ctx.lineTo(-8, 4); ctx.closePath(); ctx.fill(); ctx.stroke(); }
  else if (id === 'kai' || id === 'bali') {
    // little head: Kai with his blue cap, Bali with blond hair
    if (id === 'bali') { ctx.fillStyle = '#e8cd8e'; ctx.beginPath(); ctx.moveTo(-8, -3); ctx.quadraticCurveTo(-8, -10, 0, -10); ctx.quadraticCurveTo(8, -10, 8, -3); ctx.lineTo(8, 7); ctx.lineTo(-8, 7); ctx.closePath(); ctx.fill(); ctx.stroke(); }
    ctx.fillStyle = id === 'bali' ? '#f6d3b8' : '#f6cfa6'; ctx.beginPath(); ctx.arc(1, 1, 6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    if (id === 'kai') { ctx.fillStyle = '#f2c14e'; ctx.fillRect(-8, -1, 4, 7); ctx.fillStyle = '#1e4fa3'; ctx.beginPath(); ctx.arc(1, -2, 6.5, Math.PI, 0); ctx.lineTo(11, -2); ctx.lineTo(-6, -2); ctx.closePath(); ctx.fill(); ctx.stroke(); }
    else { ctx.fillStyle = '#e8cd8e'; ctx.beginPath(); ctx.arc(1, -2, 6.5, Math.PI, 0); ctx.quadraticCurveTo(3, -4, -5, -1); ctx.closePath(); ctx.fill(); }
    ctx.fillStyle = OUT; ctx.beginPath(); ctx.arc(4, 1, 1, 0, Math.PI * 2); ctx.fill();
  }
  else if (id === 'hairFree') { ctx.beginPath(); ctx.moveTo(-7, 6); ctx.quadraticCurveTo(-8, -8, 0, -8); ctx.quadraticCurveTo(8, -8, 7, 6); ctx.closePath(); ctx.fill(); ctx.stroke(); }
  else if (id === 'jeans') { ctx.beginPath(); ctx.moveTo(-6, -7); ctx.lineTo(6, -7); ctx.lineTo(7, 8); ctx.lineTo(2, 8); ctx.lineTo(0, -1); ctx.lineTo(-2, 8); ctx.lineTo(-7, 8); ctx.closePath(); ctx.fill(); ctx.stroke(); }
  else if (id === 'shorts') { ctx.beginPath(); ctx.moveTo(-7, -5); ctx.lineTo(7, -5); ctx.lineTo(8, 4); ctx.lineTo(1, 4); ctx.lineTo(0, 0); ctx.lineTo(-1, 4); ctx.lineTo(-8, 4); ctx.closePath(); ctx.fill(); ctx.stroke(); }
  else if (id === 'skirt') { ctx.beginPath(); ctx.moveTo(-5, -6); ctx.lineTo(5, -6); ctx.lineTo(9, 7); ctx.quadraticCurveTo(0, 9, -9, 7); ctx.closePath(); ctx.fill(); ctx.stroke(); }
  else if (id === 'halo') { ctx.strokeStyle = '#ffd23a'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.ellipse(0, 0, 8, 3, 0, 0, Math.PI * 2); ctx.stroke(); }
  else { ctx.beginPath(); ctx.roundRect(-6, -7, 12, 14, 3); ctx.fill(); ctx.stroke(); }
  ctx.restore();
}
// panel layout (screen coordinates, right under the button)
function drawInventoryPanel() {
  if (!INV.open || !INV.btn) return;
  const chipW = 150, chipH = 30, gap = 6, labelW = 74, cols = 4;
  const x = 12, y0 = INV.btn.y + INV.btn.h + 6, w = labelW + cols * (chipW + gap) + 12;
  const rows = [];
  rows.push({ head: tx('FIGUR') });
  rows.push({ label: '', items: INV_CHARS.map(it => ({ it, figure: true })) });
  const wps = INV_WEAPONS.filter(it => it.owned());
  if (wps.length) { rows.push({ head: tx('WAFFEN') }); rows.push({ label: '', items: wps.map(it => ({ it, weapon: true })) }); }
  rows.push({ head: tx('OUTFIT') });
  for (const g of OUTFIT_GROUPS) { const items = g.opts.filter(it => forChar(it) && optOwned(it)).map(it => ({ it, g })); if (items.length) rows.push({ label: tx(g.label), items }); }
  let h = 10; for (const r of rows) h += r.head ? 24 : chipH + gap; h += 6;
  INV.panel = { x, y: y0, w, h }; INV.chips = [];
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(0, 0, W, VH);
  ctx.fillStyle = 'rgba(12,24,48,0.96)'; ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.roundRect(x, y0, w, h, 14); ctx.fill(); ctx.stroke();
  let y = y0 + 10;
  ctx.textBaseline = 'middle';
  for (const r of rows) {
    if (r.head) { ctx.fillStyle = '#ffd23a'; ctx.font = 'bold 12px Arial'; ctx.textAlign = 'left'; ctx.fillText(r.head, x + 14, y + 11); ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.fillRect(x + 14 + ctx.measureText(r.head).width + 8, y + 11, w - 40 - ctx.measureText(r.head).width, 1); y += 24; continue; }
    ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.font = 'bold 11px Arial'; ctx.textAlign = 'left'; ctx.fillText(r.label, x + 14, y + chipH / 2);
    r.items.forEach((c, i) => {
      // a weapon only counts in its own world: there it is green when chosen; elsewhere it is greyed out
      const here = !c.weapon || (typeof CUR !== 'undefined' && CUR && CUR.key === c.it.world);
      const cx = x + labelW + i * (chipW + gap), on = c.weapon ? here && c.it.worn() : c.figure ? c.it.worn() : c.it.worn(SAVE.outfit);
      ctx.globalAlpha = here ? 1 : 0.4;
      const rect = { x: cx, y, w: chipW, h: chipH }; INV.chips.push(Object.assign({ rect }, c));
      ctx.fillStyle = on ? 'rgba(52,199,89,0.9)' : 'rgba(255,255,255,0.1)'; ctx.strokeStyle = on ? '#bff5cc' : 'rgba(255,255,255,0.25)';
      ctx.beginPath(); ctx.roundRect(cx, y, chipW, chipH, 9); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.beginPath(); ctx.arc(cx + 16, y + chipH / 2, 12, 0, Math.PI * 2); ctx.fill();
      drawInvSwatch(c.it.id, c.it.sw, cx + 16, y + chipH / 2);
      ctx.fillStyle = '#ffffff'; ctx.textAlign = 'left';
      let fs = 11; ctx.font = `bold ${fs}px Arial`; const nm = c.figure ? c.it.name : tx(c.it.name);   // the names Kai / Bali are never swapped
      while (ctx.measureText(nm).width > chipW - 40 && fs > 8) { fs--; ctx.font = `bold ${fs}px Arial`; }
      ctx.fillText(nm, cx + 32, y + (c.weapon ? 11 : chipH / 2));
      if (c.weapon) { ctx.font = '9px Arial'; ctx.fillStyle = on ? '#eafff0' : 'rgba(255,255,255,0.6)'; ctx.fillText(here ? tx(c.it.where) : tx(c.it.world === 'himmel' ? 'nur im Himmel' : 'nur in der Tiefsee'), cx + 32, y + 22); }
      if (on) { ctx.fillStyle = '#ffffff'; ctx.font = 'bold 13px Arial'; ctx.textAlign = 'right'; ctx.fillText('✓', cx + chipW - 8, y + chipH / 2 + 1); }
      ctx.globalAlpha = 1;
    });
    y += chipH + gap;
  }
  ctx.restore();
}
// a click in screen coordinates; returns true when the inventory used it
function invClick(hp) {
  const inR = (p, b) => b && p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
  if (inR(hp, INV.btn)) { INV.open = !INV.open; Audio.play('tink'); return true; }
  if (!INV.open) return false;
  for (const c of INV.chips) if (inR(hp, c.rect)) {
    if (c.weapon) { if (CUR.key !== c.it.world) { Audio.play('denied'); return true; } c.it.pick(); } else if (c.figure) setCharacter(c.it.id); else c.it.apply(SAVE.outfit);

}

const PAUSE = { on: false, btn: { x: W - 346, y: 10, w: 86, h: 30 } };
function setPause(on) { PAUSE.on = on; INV.open = false; Audio.pauseBg(on); Audio.play('tink'); }
function drawPauseButton() {
  const b = PAUSE.btn, label = PAUSE.on ? tx('WEITER') : tx('PAUSE');
  ctx.save(); ctx.font = 'bold 13px Arial';
  b.w = 46 + ctx.measureText(label).width; b.x = W - 262 - b.w;          // right edge stays next to the music button
  ctx.fillStyle = PAUSE.on ? '#34c759' : 'rgba(10,20,40,0.6)'; ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 9); ctx.fill();
  ctx.fillStyle = '#ffffff';
  if (PAUSE.on) { ctx.beginPath(); ctx.moveTo(b.x + 14, b.y + 8); ctx.lineTo(b.x + 27, b.y + 15); ctx.lineTo(b.x + 14, b.y + 22); ctx.closePath(); ctx.fill(); }
  else { ctx.fillRect(b.x + 13, b.y + 8, 4.5, 14); ctx.fillRect(b.x + 21, b.y + 8, 4.5, 14); }
  ctx.font = 'bold 13px Arial'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(label, b.x + 34, b.y + 16);
  ctx.restore();
}
function drawPauseOverlay() {
  if (!PAUSE.on) return;
  ctx.save(); ctx.fillStyle = 'rgba(8,16,32,0.55)'; ctx.fillRect(0, 0, W, VH);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#ffffff'; ctx.strokeStyle = OUT; ctx.lineWidth = 6;
  ctx.font = 'bold 54px Arial'; ctx.strokeText(tx('PAUSE'), W / 2, VH / 2 - 14); ctx.fillText(tx('PAUSE'), W / 2, VH / 2 - 14);
  ctx.font = 'bold 16px Arial'; ctx.fillStyle = '#bfe6ff'; ctx.fillText(tx('Tippe auf WEITER oder drücke P'), W / 2, VH / 2 + 30);
  ctx.restore();
  drawPauseButton();
}
// click in screen coordinates; returns true when used (while paused every click is used)
function pauseClick(hp) {
  const b = PAUSE.btn;
  if (hp.x >= b.x && hp.x <= b.x + b.w && hp.y >= b.y && hp.y <= b.y + b.h) { setPause(!PAUSE.on); return true; }
  return PAUSE.on;
}

function tx(key, params) {
  let s = key;
  const i = LANGS.indexOf(SAVE.lang);
  if (i > 0 && TR[key]) s = TR[key][i - 1];
  if (params) for (const k in params) s = s.split('{' + k + '}').join(params[k]);
  // whoever is riding is greeted by name: "Hallo Bali!", "Ahoi, Kapitän Bali!" …
  if (SAVE.char === 'bali') s = s.replace(/\bKai\b/g, 'Bali');
  return s;
}

  return false;
}

const Audio = (() => {

  // music sequencer state

    [48, 52, 55], // C

  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    master = ac.createGain(); master.gain.value = 0.8; master.connect(ac.destination);
    musicFilter = ac.createBiquadFilter(); musicFilter.type = 'lowpass'; musicFilter.frequency.value = theme === 'city' ? 5200 : 2200; musicFilter.Q.value = 0.6;
    musicGain = ac.createGain(); musicGain.gain.value = musicOn ? 0.55 : 0;
    musicFilter.connect(musicGain); musicGain.connect(master);

// ---------------- helpers ----------------

const kaiBox = () => { const k = S.kai; return { x1: k.x - 26, x2: k.x + 26, y1: k.y - 108, y2: k.y - 4 }; };

// ---------------- start / checkpoints ----------------

// ---------------- getting hurt ----------------

// ---------------- update ----------------
function update(dt) {
  S.t += dt;
  if (S.msgTimer > 0) S.msgTimer -= dt;
  if (S.heartFlash > 0) S.heartFlash -= dt;
  if (S.shake > 0) S.shake = Math.max(0, S.shake - 0.5 * dt);
  updateParticles(dt);
  for (const o of S.objects) o.p += 0.05 * dt;
  if (S.phase === 'rodeo' || S.phase === 'fossil') { updateGame(dt); return; }
  if (!playing()) { if (S.phase === 'won') updateBossDead(dt); return; }
  updateKai(dt);
  updateDinos(dt);
  updateVolcanoes(dt);
  updatePickups();
  updateSites();
  if (S.phase === 'boss' || (!S.boss && S.kai.x > BOSS_X + 260)) updateBoss(dt);
  for (const x of CHECKPOINTS) if (S.kai.x > x) reachCheckpoint(x);
  // camera: Kai a bit behind the middle in the direction he rides
  const k = S.kai;
  if (S.boss) S.cam += (BOSS_X - S.cam) * Math.min(1, 0.08 * dt);
  else {
    const target = clamp(k.x - W * (k.face > 0 ? 0.36 : 0.64), 0, BOSS_X);
    S.cam += (target - S.cam) * Math.min(1, 0.09 * dt);
  }
}
function updateKai(dt) {

  k.faceAnim += (k.face - k.faceAnim) * Math.min(1, 0.35 * dt);

  }
  // riding on a brachiosaurus: carried along
  if (k.platform && k.platform.dino) k.x += k.platform.dino.vx * dt;
  let nx = k.x + k.vx * dt;
  // boulders block from the side
  for (const r of ROCKS) {
    const top = FLOOR - r.h;
    if (k.y > top + 4 && nx + 20 > r.x && nx - 20 < r.x + r.w) {
      if (k.x <= r.x + r.w / 2) nx = r.x - 20; else nx = r.x + r.w + 20;
      k.vx = 0;
    }
  }

  if (nx < minX) { nx = minX; k.vx = 0; } if (nx > maxX) { nx = maxX; k.vx = 0; }
  k.x = nx;

    const pl = k.platform;
    if (k.x < pl.x1() - 18 || k.x > pl.x2() + 18) { k.ground = false; k.platform = null; k.coyote = 6; }
    else k.y = pl.top();
  } else if (k.ground) {
    if (isTarAt(k.x)) { k.ground = false; k.coyote = 4; }
  }

      }
      if (!k.ground && k.y >= FLOOR) {
        if (isTarAt(k.x)) { if (k.y > FLOOR + 40) fallInTar(); }

}
function landOn(pl, top) {

  Audio.play('land');

// everything Kai can stand on (besides the ground)
function platformsNear(x) {
  const list = [];
  for (const l of LEDGES) if (x > l.x - 60 && x < l.x + l.w + 60) list.push({ x1: () => l.x, x2: () => l.x + l.w, top: () => l.y });
  for (const r of ROCKS) if (x > r.x - 60 && x < r.x + r.w + 60) list.push({ x1: () => r.x, x2: () => r.x + r.w, top: () => FLOOR - r.h });
  for (const d of S.dinos) if (d.type === 'brachio' && Math.abs(x - d.x) < 160) list.push({ dino: d, x1: () => d.x - 80, x2: () => d.x + 80, top: () => brachioTop(d) });
  return list;
}

function updateDinos(dt) {
  const k = S.kai, kb = kaiBox();
  for (const d of S.dinos) {
    if (d.dead) { d.deadT += dt; continue; }
    if (Math.abs(d.x - k.x) > 1500) continue;     // far away: asleep
    if (d.stun > 0) {                              // dizzy after the first hit: stands still
      d.stun -= dt; d.vx = 0;
      collideDino(d, kb);
      continue;
    }
    d.t += dt;
    let sp = d.sp;
    if (d.type === 'trike') {
      // charges when Kai is in front of it on the ground
      const ahead = (k.x - d.x) * d.dir;
      if (d.state === 'walk' && ahead > 0 && ahead < 420 && k.y > FLOOR - 60 && Math.random() < 0.03 * dt) { d.state = 'charge'; Audio.play('roar'); }
      if (d.state === 'charge') sp = 4.6;
    }
    if (d.type === 'raptor') { d.hop = Math.max(0, Math.sin(d.t * 0.12) * 10); }
    d.vx = d.dir * sp;
    d.x += d.vx * dt;
    if (d.x < d.x1) { d.x = d.x1; d.dir = 1; d.state = 'walk'; }
    if (d.x > d.x2) { d.x = d.x2; d.dir = -1; d.state = 'walk'; }

  }
}
function collideDino(d, kb) {

  if (k.vy > 0 && (k.prevY ?? k.y) <= db.y1 + 18) stomp(d);   // coming down from above = jump on it
  else hurt(d.x);

// ---------------- volcanoes: fireballs come from the back in an arc ----------------
function volcScreenX(vx) { return vx - S.cam * VOLC_PAR; }
function updateVolcanoes(dt) {

  VOLCANOES.forEach((vx, i) => {
    const sx = volcScreenX(vx);
    if (sx < 60 || sx > W - 60) return;
    S.volcT[i] -= dt;
    if (S.volcT[i] <= 0 && S.phase === 'play') {
      S.volcT[i] = rand(150, 240);
      // aim at where Kai will be, a little scattered – only at solid ground
      let tx = k.x + k.vx * 70 + rand(-90, 90);
      if (isTarAt(tx)) tx += 140;

  });

      burst(f.tx, FLOOR - 6, '#ff7a1a', 22, 5); burst(f.tx, FLOOR - 6, '#ffd23a', 10, 3); S.shake = Math.max(S.shake, 5);
      Audio.play('explosion');

  const sx1 = f.tx - S.cam, sy1 = FLOOR - 8;

// ---------------- pickups ----------------
function updatePickups() {
  const k = S.kai, kb = kaiBox();
  for (const o of S.objects) {
    if (o.done) continue;
    if (Math.abs(o.x - k.x) > 90) continue;
    if (kb.x1 - o.r < o.x && kb.x2 + o.r > o.x && kb.y1 - o.r < o.y && kb.y2 + 8 > o.y) {
      o.done = true;

      if (o.type === 'heart') { S.hearts++; S.heartFlash = -30; burst(o.x, o.y, '#ff3b5c', 14, 3); Audio.play('chest'); flash('+1 HERZ', 50); }
    }

function updateParticles(dt) {
  for (const p of S.particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.g ?? 0.18) * dt; p.life -= 0.03 * dt; }
  S.particles = S.particles.filter(p => p.life > 0);
  for (const w of S.waves) { w.x += w.vx * dt; w.life -= dt; }
  S.waves = S.waves.filter(w => w.life > 0 && w.x > BOSS_X - 40 && w.x < MAP_END + 40);

// ---------------- mini-game places: ask on the way ----------------
function updateSites() {
  const k = S.kai;
  for (const [id, x] of Object.entries(SITES)) {
    const gate = x + 120;
    if (Math.abs(k.x - gate) > 400) S.asked[id] = false;            // re-arm when Kai has left
    if (!S.asked[id] && Math.abs(k.x - gate) < 30 && k.ground) {

// ---------------- panel buttons (start, ask, game over, won) ----------------
const BTN = {
  start: { x: W / 2 - 110, y: 236, w: 220, h: 46 },
  yes: { x: W / 2 - 215, y: 228, w: 200, h: 44 }, no: { x: W / 2 + 15, y: 228, w: 200, h: 44 },
  goYes: { x: W / 2 - 215, y: 228, w: 210, h: 40 }, goNo: { x: W / 2 + 5, y: 228, w: 210, h: 40 },
  menu: { x: W / 2 - 120, y: 236, w: 240, h: 44 },
  music: { x: W - 252, y: 10, w: 34, h: 30 }, sfx: { x: W - 212, y: 10, w: 34, h: 30 },

const inRect = (p, b) => b && p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
function toLogical(e) { const r = canvas.getBoundingClientRect(), sc = Math.min(r.width / W, r.height / VH); return { x: (e.clientX - r.left - (r.width - W * sc) / 2) / sc, y: (e.clientY - r.top - (r.height - VH * sc) / 2) / sc - DY }; }
canvas.addEventListener('pointerdown', e => {

  if (S.phase === 'gameover') { if (inRect(p, BTN.goYes)) resetGame(); else if (inRect(p, BTN.goNo)) { resetGame(); toMainMenu(); } return; }

//  END BOSS: T-REX

// =====================================================================

  S.phase = 'boss'; S.fireballs = [];

}
const rexHead = b => b.head > 0.5
  ? { x: b.x + b.face * 150, y: FLOOR - 64, w: 100, h: 58 }     // lowered (dizzy)

function rexBodyBox(b) { return { x1: b.x - 112, x2: b.x + 112, y1: FLOOR - 176, y2: FLOOR - 4 }; }

// =====================================================================
//  MINI GAMES IN THE DINO VALLEY
//  DINO-RODEO: ride a bucking triceratops for 15 seconds – lean left / right to stay on.
//  FOSSILIEN AUSGRABEN: dig in the sand and find all 6 bones of a dino skeleton.
//    Every empty hole shows how many bones lie right next to it (like a metal detector).
// =====================================================================
const RODEO_T = 900;                 // 15 seconds
const FOS = { cols: 6, rows: 4, bones: 6, digs: 15, cw: 82, ch: 50 };
FOS.x = W / 2 - FOS.cols * FOS.cw / 2; FOS.y = 84;

function startGame(id) {
  const k = S.kai; k.vx = 0; k.dir = 0;
  if (id === 'rodeo') {
    S.game = { id, t: 0, bal: 0, bv: 0, hold: 0, result: null, buck: 0 };
    flash(CTRL.touch ? 'Links / rechts antippen und halten = lehnen!' : 'Pfeil links / rechts = lehnen!', 140);
  } else {
    const cells = [];
    for (let r = 0; r < FOS.rows; r++) for (let c = 0; c < FOS.cols; c++) cells.push({ c, r, bone: false, dug: false, n: 0 });
    const idx = cells.map((_, i) => i).sort(() => Math.random() - 0.5).slice(0, FOS.bones);
    for (const i of idx) cells[i].bone = true;
    for (const cl of cells) cl.n = cells.filter(o => o.bone && Math.abs(o.c - cl.c) <= 1 && Math.abs(o.r - cl.r) <= 1 && o !== cl).length;
    S.game = { id, cells, digs: FOS.digs, found: 0, result: null, t: 0 };
  }
  S.phase = id; Audio.play('chime');
}
function gameKey(e) {
  const g = S.game; if (!g) return;
  if (g.result) { if (e.code === 'Space' || e.code === 'Enter') endGame(); return; }
  if (g.id === 'rodeo') { if (e.code === 'ArrowLeft' || e.code === 'KeyA') g.hold = -1; if (e.code === 'ArrowRight' || e.code === 'KeyD') g.hold = 1; }
}
window.addEventListener('keyup', e => { if (CUR === ME && S.game && S.game.id === 'rodeo' && /Arrow(Left|Right)|Key[AD]/.test(e.code)) S.game.hold = 0; });

const GBTN = { next: { x: W / 2 - 110, y: 250, w: 220, h: 44 } };
function gamePointer(p) {
  const g = S.game; if (!g) return;

  if (g.id === 'rodeo') { g.hold = p.x < W / 2 ? -1 : 1; return; }
  // fossil: dig the tapped square
  const c = Math.floor((p.x - FOS.x) / FOS.cw), r = Math.floor((p.y - FOS.y) / FOS.ch);
  if (c < 0 || r < 0 || c >= FOS.cols || r >= FOS.rows) return;

  cl.dug = true; g.digs--;
  const cx = FOS.x + c * FOS.cw + FOS.cw / 2, cy = FOS.y + r * FOS.ch + FOS.ch / 2;

  g.buck -= dt;
  if (g.buck <= 0) { g.buck = rand(28, 60); g.bv += (Math.random() < 0.5 ? -1 : 1) * rand(0.012, 0.02 + g.t / RODEO_T * 0.02); Audio.play(Math.random() < 0.3 ? 'roar' : 'stomp'); }

// ======================================================================
// LEVEL 2 – ONE PAGE: city, sky and deep sea live in the same canvas.
// Switching worlds is a continuous camera move (like Level 1):
//   'up'   city → sky      : the city slides down, the cloud world comes in from the top
//   'down' sky → city      : Kai falls through the cloud floor, the city comes up from below
//   'dive' city → deep sea : the camera dives with Kai under the water surface
//   'cut'  new game        : instant
// During a move both worlds are drawn at the same time; Kai is drawn by the controller.
// ======================================================================
let CUR = null, TRANS = null;
// LEVEL 3 – DINOLAND. For now: the dino valley (Felsenhöhe and Lavahöhlen follow).
const FACTORY = { tal: makeTal };
const THEME = { tal: 'dino' };
const worldKey = file => (file || 'tal').replace('.html', '');
function makeWorld(file, query) { const key = worldKey(file); const w = FACTORY[key](new URLSearchParams(query || '')); w.key = key; w.fromFinal = /from=replay/.test(query || ''); return w; }
function activate(w) {
  // a fresh world always starts with normal background music (e.g. the harp paused it in the sky, turbo sped it up)
  if (!PAUSE.on) Audio.pauseBg(false); Audio.setFast(false); Audio.setBoss(false);
  CUR = w; SAVE.where = w.key; writeSave(); window.__S = w.S; window.__test = w.test; window.__events = w.events; window.__world = w.key; }

const ease = u => u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
const easeOut = u => 1 - (1 - u) * (1 - u);
const easeIn = u => u * u;
const lerp = (a, b, u) => a + (b - a) * u;

function beginTransition(file, query) {
  if (TRANS) return;
  const from = CUR, toKey = worldKey(file);
  const kind = from.key === 'stadt' && toKey === 'himmel' ? 'up'
    : from.key === 'himmel' && toKey === 'stadt' ? 'down'
    : /final=1/.test(query) ? 'cut'
    : from.key === 'stadt' && toKey === 'tiefsee' ? (/pipe=1/.test(query) ? 'pipe' : 'dive')
    : from.key === 'tiefsee' && toKey === 'stadt' && /from=tiefsee/.test(query) ? 'surface' : 'cut';
  const next = makeWorld(file, query);
  if (!PAUSE.on) Audio.pauseBg(false);
  if (kind === 'cut') { activate(next); Audio.setTheme(THEME[toKey]); return; }
  const k = from.S.kai;
  TRANS = { kind, splash: /splash=1/.test(query || ''), from, to: next, t: 0, T: kind === 'up' ? 140 : kind === 'down' ? 130 : kind === 'pipe' ? 170 : 150, x0: k.x, y0: k.y, splashed: false };
  from.S.hideKai = true; from.S.noHud = true; next.S.hideKai = true; next.S.noHud = true;
  next.S.phase = 'transit';
}

function updateTransition(dt) {
  const tr = TRANS; tr.t += dt;
  const p = Math.min(1, tr.t / tr.T);
  // the old world keeps running its own animation (scrolling, particles); the new one scrolls along
  tr.from.update(dt);
  const ns = tr.to.S; ns.t = (ns.t || 0) + dt; ns.scroll = (ns.scroll || 0) + (tr.kind === 'up' ? 2.5 : 3) * dt;
  if ((tr.kind === 'dive' && p > 0.3 || tr.kind === 'surface' && p > 0.5) && !tr.splashed) { tr.splashed = true; Audio.play('pop'); Audio.play('air'); }
  if (tr.kind === 'up' && p > 0.55 && !tr.themed) { tr.themed = true; Audio.setTheme('sky'); }
  if (tr.kind !== 'up' && p > 0.55 && !tr.themed) { tr.themed = true; Audio.setTheme(THEME[tr.to.key]); }
  if (p >= 1) {
    const w = tr.to; TRANS = null;
    w.S.hideKai = false; w.S.noHud = false;
    activate(w); w.enter();
  }
}

// camera offset of the OLD world (the new one sits right above / below it)
const PIPE_GAP = 260;      // underground between the street and the sea
function transOffsets(tr, p) {
  if (tr.kind === 'surface') { const c = VH * ease(clamp((p - 0.1) / 0.88, 0, 1)); return { from: c, to: c - VH, seam: c }; }
  if (tr.kind === 'pipe') { const c = -(VH + PIPE_GAP) * ease(clamp((p - 0.12) / 0.86, 0, 1)); return { from: c, to: c + VH + PIPE_GAP, seam: c + VH }; }
  if (tr.kind === 'up') { const c = VH * ease(clamp((p - 0.12) / 0.88, 0, 1)); return { from: c, to: c - VH, seam: c }; }
  const c = -VH * ease(clamp((p - 0.08) / 0.9, 0, 1)); return { from: c, to: c + VH, seam: c + VH };
}
// where Kai is on the screen during the move
function transKai(tr, p) {
  const x = lerp(tr.x0, 250, ease(Math.min(1, p * 1.4)));
  let y, o = { wings: tr.from.S.t * 0.45, armsUp: false, tilt: 0, crouch: 3, diver: false };
  if (tr.kind === 'up') {
    // hoisted up: fast rise, then he settles where the sky game starts (y 200)
    y = p < 0.35 ? lerp(tr.y0, 70, easeOut(p / 0.35)) : lerp(70, 200, ease((p - 0.35) / 0.65));
    o.armsUp = p < 0.5; o.tilt = p < 0.35 ? -0.12 : 0; o.wings = tr.t * 0.45;
  } else if (tr.kind === 'down') {
    // falls through the clouds, the camera catches up, then he lands on the street (FLOOR)

const SWIPE = new Map();

function ctlButton(c, pressed, label, icon) {
  const R = CTRL.R;
  ctx.save();

  const g = ctx.createRadialGradient(c.x - R * 0.3, c.y - R * 0.3, 4, c.x, c.y, R);
  if (icon === 'jump') { g.addColorStop(0, pressed ? '#9ff0ff' : '#e9fbff'); g.addColorStop(1, pressed ? '#1aa0d8' : '#5bbfe6'); }
  else { g.addColorStop(0, pressed ? '#ffd2c8' : '#fff1ec'); g.addColorStop(1, pressed ? '#d8392c' : '#f06a55'); }
  ctx.fillStyle = g; ctx.strokeStyle = OUT; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(c.x, c.y, pressed ? R - 3 : R, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.globalAlpha = 1; ctx.fillStyle = OUT; ctx.strokeStyle = OUT; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const x = c.x, y = c.y - 8;

  } else if (icon === 'stick') {

    ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x + 14, y - 16, 9, -0.2, 1.4); ctx.stroke();

    ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(x - 22, y); ctx.lineTo(x + 10, y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + 22, y); ctx.lineTo(x + 6, y - 11); ctx.lineTo(x + 6, y + 11); ctx.closePath(); ctx.fill();
    if (icon === 'arrow') { ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x - 22, y); ctx.lineTo(x - 29, y - 8); ctx.moveTo(x - 22, y); ctx.lineTo(x - 29, y + 8); ctx.stroke(); }

  const s = SWIPE.get(e.pointerId); if (!s || s.done || !steerOn()) return;
  const p = screenP(e), dx = p.x - s.x, dy = p.y - s.y;
  if (Math.abs(dx) >= SWIPE_MIN && Math.abs(dx) > Math.abs(dy) * 1.1) { s.done = true; CUR.ctl.dir(dx > 0 ? 1 : -1); }
  else if (dy >= SWIPE_MIN && dy > Math.abs(dx) * 1.1) { s.done = true; CUR.ctl.brake(); }
  else if (-dy >= SWIPE_MIN && -dy > Math.abs(dx) * 1.1) { s.done = true; s.jumped = true; CUR.ctl.jump(true); }
});
const ctlRelease = e => {
  const s = SWIPE.get(e.pointerId); if (s) SWIPE.delete(e.pointerId);   // a swipe up is always a full jump
  if (CTRL.jumpP.has(e.pointerId) && CUR && CUR.ctl && CUR.ctl.jump) CUR.ctl.jump(false);
  CTRL.jumpP.delete(e.pointerId); CTRL.shootP.delete(e.pointerId); if (e.pointerType === 'mouse') CTRL.right = (e.buttons & 2) !== 0; };
window.addEventListener('pointerup', ctlRelease); window.addEventListener('pointercancel', ctlRelease);
window.addEventListener('blur', () => { CTRL.jumpP.clear(); CTRL.shootP.clear(); CTRL.right = false; SWIPE.clear(); });

// EXIT (next to PAUSE, in every world): back to the title menu of the game
const EXIT = { btn: null };
const exitVisible = () => !TRANS && CUR && !CUR.S.noHud && !MENU.open && !CONFIRM.open;
function drawExitButton() {
  if (!exitVisible()) { EXIT.btn = null; return; }
  const w = 62, b = EXIT.btn = { x: PAUSE.btn.x + PAUSE.btn.w - w, y: PAUSE.btn.y + PAUSE.btn.h + 6, w, h: PAUSE.btn.h };
  ctx.save();
  ctx.fillStyle = 'rgba(120,20,20,0.7)'; ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 9); ctx.fill();
  // little door with an arrow out
  ctx.strokeStyle = '#ffffff'; ctx.fillStyle = '#ffffff'; ctx.lineWidth = 2; ctx.lineJoin = 'round';
  ctx.strokeRect(b.x + 8, b.y + 8, 9, 14);
  ctx.beginPath(); ctx.moveTo(b.x + 13, b.y + 15); ctx.lineTo(b.x + 22, b.y + 15); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(b.x + 25, b.y + 15); ctx.lineTo(b.x + 20, b.y + 11); ctx.lineTo(b.x + 20, b.y + 19); ctx.closePath(); ctx.fill();
  ctx.font = 'bold 12px Arial'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText('EXIT', b.x + 29, b.y + 16);
  ctx.restore();
}

canvas.addEventListener('pointerdown', e => {
  const p = screenP(e);
  if (e.pointerType === 'touch') CTRL.touch = true; else if (e.pointerType === 'mouse') CTRL.touch = false;
  // right mouse button never jumps – it shoots
  if (e.pointerType === 'mouse' && e.button === 2) { e.stopImmediatePropagation(); e.preventDefault(); Audio.init(); mouseButtons(e); return; }
  if (EXIT.btn && exitVisible() && inB(p, EXIT.btn)) { e.stopImmediatePropagation(); e.preventDefault(); Audio.init(); toMainMenu(); return; }
  if (shootVisible() && inShootZone(p)) { e.stopImmediatePropagation(); e.preventDefault(); CTRL.shootP.add(e.pointerId); ctlShoot(); return; }
  if (jumpVisible() && inJumpZone(p)) {
    CTRL.jumpP.add(e.pointerId);
    if (steerOn()) { e.stopImmediatePropagation(); e.preventDefault(); Audio.init(); CUR.ctl.jump(true); return; }
  }
  // Level 3: a finger anywhere else steers by swiping; the mouse jumps with a click
  if (steerOn() && p.y > 92 && !(EXIT.btn && inB(p, EXIT.btn))) {
    e.stopImmediatePropagation(); e.preventDefault(); Audio.init();
    if (e.pointerType === 'mouse') { CTRL.jumpP.add(e.pointerId); CUR.ctl.jump(true); return; }
    SWIPE.set(e.pointerId, { x: p.x, y: p.y, done: false, jumped: false });
    return;
  }
  if (BACK.btn && backVisible() && inB(p, BACK.btn)) { e.stopImmediatePropagation(); e.preventDefault(); Audio.init(); doBack(); return; }
  if (!CONFIRM.open && !MENU.open && !(PAUSE.on && PAUSE.resetBtn)) return;
  if (CONFIRM.open) {
    e.stopImmediatePropagation(); e.preventDefault(); Audio.init();
    if (inB(p, CONFIRM.btns.yes)) doNewGame(); else if (inB(p, CONFIRM.btns.no)) { CONFIRM.open = false; Audio.play('tink'); }
    return;
  }
  if (MENU.open) {
    e.stopImmediatePropagation(); e.preventDefault(); Audio.init();
    if (inB(p, MENU.btns.cont)) continueGame();
    else if (inB(p, MENU.btns.reset)) askNewGame();
    else if (inB(p, MENU.btns.app)) goToApp();
    else if (inB(p, MENU.btns.kai)) { setCharacter('kai'); Audio.play('flip'); }
    else if (inB(p, MENU.btns.bali)) { setCharacter('bali'); Audio.play('flip'); }
    else langPickerClick({ x: p.x, y: p.y - DY });
    return;
  }
  if (PAUSE.on && inB(p, PAUSE.resetBtn)) { e.stopImmediatePropagation(); e.preventDefault(); askNewGame(); }
}, true);

// ================= MAIN LOOP =================
const URLQ = new URLSearchParams(location.search);
if (URLQ.get('world')) activate(makeWorld(URLQ.get('world'), location.search.replace(/^\?/, '')));
else if (hasProgress()) {
  activate(makeWorld(FACTORY[SAVE.where] ? SAVE.where : 'tal', 'from=continue'));
  MENU.open = true; CUR.S.noHud = true;
} else { activate(makeWorld('tal', '')); MENU.open = true; CUR.S.noHud = true; }
Audio.setTheme(THEME[CUR.key]);
let lastT = performance.now();
function mainLoop(now) {
  const dt = Math.min((now - lastT) / 16.667, 3); lastT = now;
  if (TRANS) { updateTransition(dt); if (TRANS) drawTransition(); else drawWorldFull(CUR); }
  else {
    if (!INV.open && !PAUSE.on && !MENU.open && !CONFIRM.open) { updateControls(); CUR.update(dt); }
    drawWorldFull(CUR); drawControls(); if (!CUR.S.noHud) drawPauseButton(); drawInventoryPanel(); drawBackButton(); drawPauseOverlay(); drawExitButton(); drawPauseExtras(); drawMenu(); drawConfirm();
  }   // paused while ITEMS is open or PAUSE
  requestAnimationFrame(mainLoop);
}
window.addEventListener('keydown', e => {
  if (CONFIRM.open) { if (e.code === 'Escape') CONFIRM.open = false; e.stopImmediatePropagation(); return; }
  if (MENU.open) { if (e.code === 'Space' || e.code === 'Enter') continueGame(); e.stopImmediatePropagation(); return; }
  if (e.code === 'KeyP') { if (!TRANS) setPause(!PAUSE.on); }
  else if (e.code === 'KeyI') { if (!PAUSE.on) { INV.open = !INV.open; Audio.play('tink'); } }
  else if (e.code === 'Escape') { if (INV.open) INV.open = false; else if (backVisible()) doBack(); }
}, true);
requestAnimationFrame(mainLoop);
window.__ctl = { toMainMenu, CTRL, beginTransition, get TRANS() { return TRANS; }, get CUR() { return CUR; } };
})();
</script>
