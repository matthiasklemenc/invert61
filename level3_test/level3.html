<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>INVERT – Level 3</title>
<style>
  html, body { margin: 0; padding: 0; background: #020c18; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: Arial, Helvetica, sans-serif; }
  canvas { display: block; width: 100vw; height: auto; max-height: 100vh; object-fit: contain; touch-action: none; user-select: none; -webkit-user-select: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';
const W = 1280, H = 340;      // world space of every game scene
const FLOOR = 300;            // street / cloud floor / sand line
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const dpr = Math.min(window.devicePixelRatio || 1, 2);
// The view is as tall as the screen allows (landscape phone ≈ 2.1:1 → ~600 high).
// The world sits at the bottom; the extra height (DY) is open space above it (more sky / more water).
let VH = H, DY = 0;
function fitView() {
  const a = Math.max(1, window.innerWidth) / Math.max(1, window.innerHeight);
  VH = Math.round(Math.min(760, Math.max(H, W / a))); DY = VH - H;
  canvas.width = W * dpr; canvas.height = VH * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
fitView();
window.addEventListener('resize', fitView); window.addEventListener('orientationchange', () => setTimeout(fitView, 200));

const OUT = '#14202e';        // outline colour (matches Kai's flat style)
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));


// =====================================================================
//  LEVEL 3 (DINOLAND) – shared game state (valley / rocks / lava caves), languages, progress box
// =====================================================================
const SAVE_KEY = 'invert61-level3';
const SAVE_DEFAULT = {
  lang: 'de', hearts: 5, lives: 3, coins: 0, pearls: 0, starfish: 0,
  items: { magmaBoard: false, slingshot: false, sling2: false, bombs: false },
  weapon: {},
  outfit: { char: 'kai', tee: '#1f3c6e', cap: '#1e4fa3', beanie: false, backpack: false, shoes: '#1b1b22', halo: false },
  // two playable characters, each with her / his own clothes. SAVE.outfit is always the one being played.
  char: 'kai',
  outfitKai: null,
  outfitBali: { char: 'bali', tee: '#f6a3c4', cap: null, beanie: false, backpack: false, shoes: '#ffffff', halo: false, bottom: 'jeans' },
  owned: {},                                   // bought clothes
  done: { tal: false, hoehe: false, lava: false },
  mini: { rodeo: null, fossil: null, ptero: null, lore: null },
  checkpoint: null,                            // snapshot at the start of the current world
  score: 0, best: 0,                           // points of this game / personal record on this device
  pts: {},                                     // what already gave its one-time points (mini games, bosses)
  wtime: { tal: 0, hoehe: 0, lava: 0 },        // frames played in each world (for the time bonus)
};
function loadSave() {
  try {
    const raw = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
    if (raw) return Object.assign({}, SAVE_DEFAULT, raw, { pts: Object.assign({}, raw.pts), wtime: Object.assign({}, SAVE_DEFAULT.wtime, raw.wtime), items: Object.assign({}, SAVE_DEFAULT.items, raw.items), outfit: Object.assign({}, SAVE_DEFAULT.outfit, raw.outfit), outfitBali: Object.assign({}, SAVE_DEFAULT.outfitBali, raw.outfitBali), done: Object.assign({}, SAVE_DEFAULT.done, raw.done), mini: Object.assign({}, SAVE_DEFAULT.mini, raw.mini) });
  } catch (e) {}
  return JSON.parse(JSON.stringify(SAVE_DEFAULT));
}
const SAVE = loadSave();
// first start of Level 3: take over who rides, the clothes and the language from Level 2
if (!SAVE.importedL2) {
  try {
    const l2 = JSON.parse(localStorage.getItem('invert61-level2') || 'null');
    if (l2) for (const k of ['char', 'outfit', 'outfitKai', 'outfitBali', 'owned', 'lang']) if (l2[k] != null) SAVE[k] = l2[k];
  } catch (e) {}
  SAVE.importedL2 = true;
}
SAVE.weapon = SAVE.weapon || {}; SAVE.owned = SAVE.owned || {}; if (SAVE.outfit.halo) SAVE.owned.halo = true;
SAVE.char = SAVE.char === 'bali' ? 'bali' : 'kai'; SAVE.outfit.char = SAVE.char;
// switch between Kai and Bali: the clothes of the one who leaves are kept, the other one's clothes come back
function setCharacter(c) {
  if (c !== 'kai' && c !== 'bali') return;
  if (SAVE.char === c) return;
  if (SAVE.char === 'bali') SAVE.outfitBali = SAVE.outfit; else SAVE.outfitKai = SAVE.outfit;
  SAVE.char = c;
  SAVE.outfit = c === 'bali' ? Object.assign({}, SAVE_DEFAULT.outfitBali, SAVE.outfitBali) : Object.assign({}, SAVE_DEFAULT.outfit, SAVE.outfitKai || {});
  SAVE.outfit.char = c;
  writeSave();
}
const forChar = it => !it.who || it.who === SAVE.char;   // items only one of the two can wear
function writeSave() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch (e) {} }
function resetSave(keepLang = true) { const lang = SAVE.lang; Object.assign(SAVE, JSON.parse(JSON.stringify(SAVE_DEFAULT))); if (keepLang) SAVE.lang = lang; writeSave(); }
// remember the state at the start of a world, so a game over only restarts that world
function setCheckpoint(world) {
  SAVE.checkpoint = { world, hearts: SAVE.hearts, coins: SAVE.coins, score: SAVE.score || 0, pearls: SAVE.pearls, starfish: SAVE.starfish, items: Object.assign({}, SAVE.items) };
  SAVE.cps = Object.assign({}, SAVE.cps, { [world]: SAVE.checkpoint }); writeSave();
}
// back in a world that was already started (e.g. the city after the sky): use that world's own checkpoint again
function useCheckpoint(world) { if (SAVE.cps && SAVE.cps[world]) { SAVE.checkpoint = SAVE.cps[world]; writeSave(); } else setCheckpoint(world); }
// world restart (all lives lost): hearts, coins, pearls and starfish go back to the world start –
// but bought things STAY, and coins spent on them stay spent (see spendCoins)
function restoreCheckpoint() { const c = SAVE.checkpoint; if (!c) return; Object.assign(SAVE, { hearts: c.hearts, coins: Math.max(0, c.coins), score: c.score ?? SAVE.score, pearls: c.pearls, starfish: c.starfish }); writeSave(); }
// a purchase also lowers the coins the checkpoint would give back
function spendCoins(n) { for (const c of new Set([SAVE.checkpoint, ...Object.values(SAVE.cps || {})])) if (c) c.coins = Math.max(0, c.coins - n); writeSave(); }
// ---------------- points ----------------
// Points are for comparing (coins are money for the OXXO). Defeated dinos stay gone, mini games and bosses
// give their big points only once per game – so nobody can farm millions. A boss can be fought again and again.
const PTS = { coin: 10, raptor: 100, compy: 100, salamander: 100, baby: 50, bat: 150, ptero: 200, trike: 300, stego: 300, mini: 1000, miniboss: 2000, boss: 5000 };
// time bonus: starts at 10'000 and shrinks by 25 per second played in that world – never below 0 (no countdown!)
const TIME_BONUS_MAX = 10000, TIME_BONUS_PER_S = 25;
const timeBonus = sec => Math.max(0, Math.round((TIME_BONUS_MAX - sec * TIME_BONUS_PER_S) / 10) * 10);
const fmtNum = n => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, "'");
const fmtTime = sec => Math.floor(sec / 60) + ':' + String(Math.floor(sec % 60)).padStart(2, '0');
function bumpBest() { if ((SAVE.score || 0) > (SAVE.best || 0)) { SAVE.best = SAVE.score; return true; } return false; }
// the score box in the HUD (below the coins)
function drawScoreBox(score) {
  ctx.save(); ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(20,30,50,0.6)'; ctx.beginPath(); ctx.roundRect(W - 168, 46, 156, 26, 10); ctx.fill();
  ctx.fillStyle = '#ffd23a'; ctx.font = 'bold 11px Arial'; ctx.textAlign = 'left'; ctx.fillText(tx('PUNKTE'), W - 158, 59);
  ctx.fillStyle = '#ffffff'; ctx.font = 'bold 15px Arial'; ctx.textAlign = 'right'; ctx.fillText(fmtNum(score), W - 20, 60);
  ctx.restore();
}
// "+100" floating up where it happened (world coordinates)
function drawPops(pops) {
  ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  for (const p of pops) {
    const u = p.t / 60; ctx.globalAlpha = Math.max(0, 1 - u * u);
    ctx.font = `bold ${p.big ? 22 : 16}px Arial`; ctx.strokeStyle = OUT; ctx.lineWidth = 4; ctx.fillStyle = p.col || '#ffe14d';
    ctx.strokeText(p.text, p.x, p.y - u * 40); ctx.fillText(p.text, p.x, p.y - u * 40);
  }
  ctx.restore();
}
// the boss energy bar: green → yellow → red
function drawBossBar(name, frac) {
  const bw = 300, bx = W / 2 - bw / 2 + 40, f = clamp(frac, 0, 1);
  ctx.save(); ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(30,20,30,0.78)'; ctx.beginPath(); ctx.roundRect(W / 2 - 230, 6, 460, 32, 12); ctx.fill();
  ctx.fillStyle = '#ffe0f0'; ctx.font = 'bold 13px Arial'; ctx.textAlign = 'right'; ctx.fillText(name, bx - 10, 23);
  ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.beginPath(); ctx.roundRect(bx, 14, bw, 16, 8); ctx.fill();
  const col = f > 0.6 ? '#34c759' : f > 0.3 ? '#ffcc2e' : '#ff3b30';
  if (f > 0) { ctx.fillStyle = col; ctx.beginPath(); ctx.roundRect(bx, 14, Math.max(8, bw * f), 16, 8); ctx.fill(); }
  ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.roundRect(bx, 14, bw, 16, 8); ctx.stroke();
  ctx.restore();
}
// little symbols in the way bar at the top: where the lianas, pipes, mini games, shop and middle boss are
function drawBarIcon(type, x, y) {
  ctx.save(); ctx.translate(x, y); ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  const col = { liana: '#4caf50', pipe: '#ff7a2a', rodeo: '#ffb02e', fossil: '#e3c88f', oxxo: '#d8231f', ride: '#ff9ad0', lore: '#9aa0a8', anky: '#e2541c' }[type] || '#fff';
  ctx.fillStyle = col; ctx.strokeStyle = OUT; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = OUT; ctx.fillStyle = OUT; ctx.lineWidth = 1.8;
  if (type === 'liana') { ctx.beginPath(); ctx.moveTo(0, 5); ctx.lineTo(0, -5); ctx.moveTo(-4, -1); ctx.lineTo(0, -5); ctx.lineTo(4, -1); ctx.stroke(); }
  else if (type === 'pipe') { ctx.beginPath(); ctx.moveTo(0, -5); ctx.lineTo(0, 5); ctx.moveTo(-4, 1); ctx.lineTo(0, 5); ctx.lineTo(4, 1); ctx.stroke(); }
  else if (type === 'rodeo') { ctx.beginPath(); ctx.arc(0, 0, 4.5, Math.PI * 0.15, Math.PI * 0.85, true); ctx.stroke(); }
  else if (type === 'fossil') { ctx.beginPath(); ctx.moveTo(-4, 3); ctx.lineTo(4, -3); ctx.stroke(); for (const [bx, by] of [[-4, 3], [4, -3]]) { ctx.beginPath(); ctx.arc(bx, by, 1.8, 0, Math.PI * 2); ctx.fill(); } }
  else if (type === 'oxxo') { ctx.fillStyle = '#ffd23a'; ctx.fillRect(-6, -2, 12, 4); }
  else if (type === 'ride') { ctx.beginPath(); ctx.moveTo(-6, -2); ctx.quadraticCurveTo(-3, 2, 0, -1); ctx.quadraticCurveTo(3, 2, 6, -2); ctx.stroke(); }
  else if (type === 'lore') { ctx.fillRect(-5, -4, 10, 5); ctx.beginPath(); ctx.arc(-3, 3, 1.8, 0, Math.PI * 2); ctx.arc(3, 3, 1.8, 0, Math.PI * 2); ctx.fill(); }
  else if (type === 'anky') { ctx.font = 'bold 12px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('!', 0, 1); }
  ctx.restore();
}
// the way bar (top middle): progress to the boss, checkpoints, and the symbols of the places on the way
function drawWayBar(kx, bossX, cps, cpX, icons, label, labelCol) {
  ctx.save(); ctx.textBaseline = 'middle';
  const bx = W / 2 - 170, bw = 340, u = clamp(kx / bossX, 0, 1);
  ctx.fillStyle = 'rgba(20,30,50,0.55)'; ctx.beginPath(); ctx.roundRect(bx - 14, 4, bw + 90, 34, 12); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.beginPath(); ctx.roundRect(bx, 17, bw, 8, 4); ctx.fill();
  ctx.fillStyle = '#7dd35a'; ctx.beginPath(); ctx.roundRect(bx, 17, bw * u, 8, 4); ctx.fill();
  for (const c of cps) { ctx.fillStyle = cpX >= c ? '#34c759' : '#d8352c'; ctx.fillRect(bx + bw * c / bossX - 1, 13, 3, 16); }
  for (const [type, x] of icons) drawBarIcon(type, bx + bw * clamp(x / bossX, 0, 1), 21);
  ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(bx + bw * u, 21, 5, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = OUT; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.font = 'bold 12px Arial'; ctx.fillStyle = labelCol; ctx.textAlign = 'left'; ctx.fillText(label, bx + bw + 10, 21);
  ctx.restore();
}
// the end-of-world summary lines (boss beaten)
function summaryLines(sm) {
  if (!sm) return [];
  if (sm.repeat) return [tx('Schon einmal besiegt – diesmal gibt es keine Punkte, nur den Spaß.'), tx('Punkte: {p}   ·   Rekord: {r}', { p: fmtNum(SAVE.score), r: fmtNum(SAVE.best || 0) })];
  return [tx('Boss besiegt: +{b}   ·   Zeitbonus ({t}): +{z}', { b: fmtNum(sm.boss), t: fmtTime(sm.sec), z: fmtNum(sm.time) }),
    (sm.record ? tx('NEUER REKORD!') + '  ' : '') + tx('Punkte: {p}   ·   Rekord: {r}', { p: fmtNum(SAVE.score), r: fmtNum(SAVE.best || 0) })];
}
// ---------------- lives ----------------
// 3 lives: when all hearts are gone one life is lost and Kai simply carries on right there with full hearts.
// Only when all 3 lives are gone the current world starts again (from its checkpoint).
const LIVES_MAX = 3, LIFE_HEARTS = 5;
// Level 3 only opens when all three bosses are beaten: garbage truck (city), harp finale (sky), giant squid (sea)
const allBossesDone = () => !!(SAVE.done.tal && SAVE.done.hoehe && SAVE.done.lava);
function openBosses() {
  const l = [];
  if (!SAVE.done.tal) l.push(tx('T-Rex im Dino-Tal besiegen'));
  if (!SAVE.done.hoehe) l.push(tx('Flugsaurier-Mama auf der Felsenhöhe besiegen'));
  if (!SAVE.done.lava) l.push(tx('Riesenvulkan in den Lavahöhlen besiegen'));
  return l;
}
function loseLife() { SAVE.lives = Math.max(0, (SAVE.lives ?? LIVES_MAX) - 1); writeSave(); return SAVE.lives > 0; }
function restartWorldSave() { restoreCheckpoint(); SAVE.lives = LIVES_MAX; writeSave(); }
// ======================================================================
// INVENTORY (top left): weapons + outfit Kai owns, opened as a drop-down. The game pauses while it is open.
// ======================================================================
const INV = { open: false, btn: null, panel: null, chips: [] };
// Level 3 weapons: the slingshot on the Felsenhöhe (water bombs for the lava caves come later)
const INV_WEAPONS = [
  { id: 'sling', name: 'Steinschleuder', where: 'Felsenhöhe', world: 'hoehe', owned: () => !!SAVE.items.slingshot, worn: () => !(SAVE.items.sling2 && SAVE.weapon.hoehe !== 'sling'), pick: () => { SAVE.weapon.hoehe = 'sling'; } },
  { id: 'sling2', name: 'Super-Schleuder', where: 'Felsenhöhe', world: 'hoehe', owned: () => !!SAVE.items.sling2, worn: () => !!SAVE.items.sling2 && SAVE.weapon.hoehe !== 'sling', pick: () => { SAVE.weapon.hoehe = 'sling2'; } },
  { id: 'magma', name: 'Magma-Board', where: 'Lavahöhlen', world: 'lava', owned: () => !!SAVE.items.magmaBoard, worn: () => true, pick: () => {} },
  { id: 'bombs', name: 'Wasserbomben', where: 'Lavahöhlen', world: 'lava', owned: () => !!SAVE.items.bombs, worn: () => true, pick: () => {} },
];
const OUTFIT_GROUPS = [
  { label: 'Kopf', opts: [
    { id: 'capBlue', who: 'kai', name: 'Blaue Kappe', sw: '#1e4fa3', owned: () => true, worn: o => !o.beanie && (o.cap || '#1e4fa3') === '#1e4fa3', apply: o => { o.cap = '#1e4fa3'; o.beanie = false; } },
    { id: 'capRed', who: 'kai', name: 'Rote Kappe', sw: '#d8352c', worn: o => !o.beanie && o.cap === '#d8352c', apply: o => { o.cap = '#d8352c'; o.beanie = false; } },
    { id: 'capGreen', who: 'kai', name: 'Grüne Kappe', sw: '#2f8a5f', worn: o => !o.beanie && o.cap === '#2f8a5f', apply: o => { o.cap = '#2f8a5f'; o.beanie = false; } },
    { id: 'hairFree', who: 'bali', name: 'Ohne Mütze', sw: '#e8cd8e', owned: () => true, worn: o => !o.beanie && !o.cap, apply: o => { o.cap = null; o.beanie = false; } },
    { id: 'capBali', who: 'bali', name: 'Schildkappe', sw: '#f48fb8', worn: o => !o.beanie && o.cap === '#f48fb8', apply: o => { o.cap = '#f48fb8'; o.beanie = false; } },
    { id: 'capGold', name: 'Goldene Kappe', sw: '#e8b923', worn: o => !o.beanie && o.cap === '#e8b923', apply: o => { o.cap = '#e8b923'; o.beanie = false; } },
    { id: 'beanie', name: 'Beanie', sw: '#7a3fb8', worn: o => !!o.beanie, apply: o => { o.beanie = true; } },
  ] },
  { label: 'T-Shirt', opts: [
    { id: 'teeBlue', who: 'kai', name: 'Blaues T-Shirt', sw: '#1f3c6e', owned: () => true, worn: o => (o.tee || '#1f3c6e') === '#1f3c6e', apply: o => { o.tee = '#1f3c6e'; } },
    { id: 'teePink', who: 'bali', name: 'Rosa T-Shirt', sw: '#f6a3c4', owned: () => true, worn: o => (o.tee || '#f6a3c4') === '#f6a3c4', apply: o => { o.tee = '#f6a3c4'; } },
    { id: 'teeRed', name: 'Rotes T-Shirt', sw: '#c8352c', worn: o => o.tee === '#c8352c', apply: o => { o.tee = '#c8352c'; } },
    { id: 'teeYellow', name: 'Gelbes T-Shirt', sw: '#e0a81e', worn: o => o.tee === '#e0a81e', apply: o => { o.tee = '#e0a81e'; } },
  ] },
  { label: 'Hose', opts: [
    { id: 'jeans', who: 'bali', name: 'Jeans', sw: '#4a78b8', owned: () => true, worn: o => (o.bottom || 'jeans') === 'jeans', apply: o => { o.bottom = 'jeans'; } },
    { id: 'shorts', who: 'bali', name: 'Kurze Hose', sw: '#4a78b8', worn: o => o.bottom === 'shorts', apply: o => { o.bottom = 'shorts'; } },
    { id: 'skirt', who: 'bali', name: 'Rock', sw: '#d94f7c', worn: o => o.bottom === 'skirt', apply: o => { o.bottom = 'skirt'; } },
  ] },
  { label: 'Schuhe', opts: [
    { id: 'shoesDark', who: 'kai', name: 'Schwarze Schuhe', sw: '#1b1b22', owned: () => true, worn: o => (o.shoes || '#1b1b22') === '#1b1b22', apply: o => { o.shoes = '#1b1b22'; } },
    { id: 'shoesWhite', who: 'bali', name: 'Weisse Schuhe', sw: '#ffffff', owned: () => true, worn: o => (o.shoes || '#ffffff') === '#ffffff', apply: o => { o.shoes = '#ffffff'; } },
    { id: 'shoesRed', name: 'Rote Schuhe', sw: '#d8352c', worn: o => o.shoes === '#d8352c', apply: o => { o.shoes = '#d8352c'; } },
  ] },
  { label: 'Extras', toggle: true, opts: [
    { id: 'backpack', name: 'Rucksack', sw: '#e0702b', worn: o => !!o.backpack, apply: o => { o.backpack = !o.backpack; } },
    { id: 'halo', name: 'Heiligenschein', sw: '#ffd23a', worn: o => !!o.halo, apply: o => { o.halo = !o.halo; } },
  ] },
];
// the two characters (first row in ITEMS)
const INV_CHARS = [
  { id: 'kai', name: 'Kai', worn: () => SAVE.char === 'kai' },
  { id: 'bali', name: 'Bali', worn: () => SAVE.char === 'bali' },
];
const optOwned = it => it.owned ? it.owned() : !!SAVE.owned[it.id];
function invCount() { return INV_WEAPONS.filter(w => w.owned() && w.id !== 'sling').length + OUTFIT_GROUPS.reduce((n, g) => n + g.opts.filter(o => forChar(o) && !o.owned && optOwned(o)).length, 0); }
function drawInvButton(x, y) {
  const b = { x, y, w: 92, h: 26 }; INV.btn = b;
  ctx.save(); ctx.fillStyle = INV.open ? 'rgba(255,210,58,0.95)' : 'rgba(10,20,40,0.6)'; ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 10); ctx.fill();
  // little backpack icon
  ctx.translate(b.x + 15, b.y + 13); ctx.fillStyle = '#e0702b'; ctx.strokeStyle = OUT; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.roundRect(-6, -7, 12, 14, 3); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#c2551a'; ctx.fillRect(-4, 0, 8, 4);
  ctx.beginPath(); ctx.arc(0, -7, 3, Math.PI, 0); ctx.stroke();

  const n = invCount();

  ctx.restore();
}
function drawInvSwatch(id, sw, cx, cy) {
  ctx.save(); ctx.translate(cx, cy); ctx.strokeStyle = OUT; ctx.lineWidth = 1.3; ctx.fillStyle = sw;

// panel layout (screen coordinates, right under the button)
function drawInventoryPanel() {
  if (!INV.open || !INV.btn) return;
  const chipW = 150, chipH = 30, gap = 6, labelW = 74, cols = 4;
  const x = 12, y0 = INV.btn.y + INV.btn.h + 6, w = labelW + cols * (chipW + gap) + 12;
  const rows = [];

  rows.push({ label: '', items: INV_CHARS.map(it => ({ it, figure: true })) });
  const wps = INV_WEAPONS.filter(it => it.owned());
  if (wps.length) { rows.push({ head: tx('WAFFEN') }); rows.push({ label: '', items: wps.map(it => ({ it, weapon: true })) }); }
  rows.push({ head: tx('OUTFIT') });
  for (const g of OUTFIT_GROUPS) { const items = g.opts.filter(it => forChar(it) && optOwned(it)).map(it => ({ it, g })); if (items.length) rows.push({ label: tx(g.label), items }); }
  let h = 10; for (const r of rows) h += r.head ? 24 : chipH + gap; h += 6;
  INV.panel = { x, y: y0, w, h }; INV.chips = [];
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(0, 0, W, VH);
  ctx.fillStyle = 'rgba(12,24,48,0.96)'; ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.roundRect(x, y0, w, h, 14); ctx.fill(); ctx.stroke();
  let y = y0 + 10;
  ctx.textBaseline = 'middle';
  for (const r of rows) {
    if (r.head) { ctx.fillStyle = '#ffd23a'; ctx.font = 'bold 12px Arial'; ctx.textAlign = 'left'; ctx.fillText(r.head, x + 14, y + 11); ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.fillRect(x + 14 + ctx.measureText(r.head).width + 8, y + 11, w - 40 - ctx.measureText(r.head).width, 1); y += 24; continue; }
    ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.font = 'bold 11px Arial'; ctx.textAlign = 'left'; ctx.fillText(r.label, x + 14, y + chipH / 2);

      // a weapon only counts in its own world: there it is green when chosen; elsewhere it is greyed out
      const here = !c.weapon || (typeof CUR !== 'undefined' && CUR && CUR.key === c.it.world);
      const cx = x + labelW + i * (chipW + gap), on = c.weapon ? here && c.it.worn() : c.figure ? c.it.worn() : c.it.worn(SAVE.outfit);
      ctx.globalAlpha = here ? 1 : 0.4;

      ctx.fillStyle = on ? 'rgba(52,199,89,0.9)' : 'rgba(255,255,255,0.1)'; ctx.strokeStyle = on ? '#bff5cc' : 'rgba(255,255,255,0.25)';
      ctx.beginPath(); ctx.roundRect(cx, y, chipW, chipH, 9); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.beginPath(); ctx.arc(cx + 16, y + chipH / 2, 12, 0, Math.PI * 2); ctx.fill();
      drawInvSwatch(c.it.id, c.it.sw, cx + 16, y + chipH / 2);
      ctx.fillStyle = '#ffffff'; ctx.textAlign = 'left';
      let fs = 11; ctx.font = `bold ${fs}px Arial`; const nm = c.figure ? c.it.name : tx(c.it.name);   // the names Kai / Bali are never swapped
      while (ctx.measureText(nm).width > chipW - 40 && fs > 8) { fs--; ctx.font = `bold ${fs}px Arial`; }
      ctx.fillText(nm, cx + 32, y + (c.weapon ? 11 : chipH / 2));
      if (c.weapon) { ctx.font = '9px Arial'; ctx.fillStyle = on ? '#eafff0' : 'rgba(255,255,255,0.6)'; ctx.fillText(here ? tx(c.it.where) : tx(c.it.world === 'hoehe' ? 'nur auf der Felsenhöhe' : 'nur in den Lavahöhlen'), cx + 32, y + 22); }

// a click in screen coordinates; returns true when the inventory used it
function invClick(hp) {
  const inR = (p, b) => b && p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
  if (inR(hp, INV.btn)) { INV.open = !INV.open; Audio.play('tink'); return true; }
  if (!INV.open) return false;
  for (const c of INV.chips) if (inR(hp, c.rect)) {
    if (c.weapon) { if (CUR.key !== c.it.world) { Audio.play('denied'); return true; } c.it.pick(); } else if (c.figure) setCharacter(c.it.id); else c.it.apply(SAVE.outfit);
    writeSave(); Audio.play('flip'); return true;
  }
  if (!inR(hp, INV.panel)) INV.open = false;
  return true;
}

function tx(key, params) {
  let s = key;
  const i = LANGS.indexOf(SAVE.lang);
  if (i > 0 && TR[key]) s = TR[key][i - 1];
  if (params) for (const k in params) s = s.split('{' + k + '}').join(params[k]);
  // whoever is riding is greeted by name: "Hallo Bali!", "Ahoi, Kapitän Bali!" …
  if (SAVE.char === 'bali') s = s.replace(/\bKai\b/g, 'Bali');
  // the name typed in the game menu ("Choose your own name") replaces the rider's name: "Ahoi, Kapitän Max!"
  let myName = ''; try { myName = (localStorage.getItem('invert-skate-username') || '').trim(); } catch (e) {}
  if (myName) s = s.replace(SAVE.char === 'bali' ? /\bBali\b/g : /\bKai\b/g, myName);
  return s;
}

// ---------------- language picker (start screens) ----------------
const LANG_BTNS = LANGS.map((l, i) => ({ l, x: W - 150 + i * 46, y: H - 40, w: 40, h: 28 }));
function drawLangPicker() {
  ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.font = 'bold 11px Arial'; ctx.fillText(tx('Sprache'), W - 82, H - 50);
  for (const b of LANG_BTNS) {
    const on = SAVE.lang === b.l;

    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.11);
    o.connect(g); g.connect(sfxGain); o.start(t); o.stop(t + 0.13);

  // ---- skateboard grind: metal trucks scraping a rail ----
  // 1) lock-in "clank" (inharmonic metal partials)  2) gritty scrape: crackly noise through
  // ringing metal resonances + a lower body  3) short release when Kai leaves the rail
  let grindSrc = null, grindGain = null, gritBuf = null;
  function makeGritBuffer() {
    const len = ac.sampleRate * 2, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    let env = 0, next = 0, lp = 0;
    for (let i = 0; i < len; i++) {
      if (i >= next) { env = 0.45 + Math.random() * 0.55; next = i + Math.floor(ac.sampleRate * (0.004 + Math.random() * 0.02)); }
      env *= 0.9965;                                   // each grain of grit decays quickly
      const n = Math.random() * 2 - 1;
      lp += (n - lp) * 0.35;                           // slightly darker noise
      d[i] = (n * 0.55 + lp * 0.45) * (0.18 + env);
    }
    return buf;
  }
  function clank() {
    const t = ac.currentTime;
    for (const [f, v, dcy] of [[620, 0.16, 0.18], [1130, 0.12, 0.22], [1870, 0.09, 0.3], [2760, 0.06, 0.25], [3990, 0.04, 0.2]]) tone(f, t, dcy, 'sine', v, sfxGain, 0.002);
    noise(t, 0.05, 0.5, 2200, 'bandpass', sfxGain, 0.8);
    tone(140, t, 0.08, 'triangle', 0.25, sfxGain, 0.002);
  }
  function grindLoop(on) {
    if (!ac || !sfxOn) { if (!on && grindSrc) stopGrind(); return; }
    if (on && !grindSrc) {
      if (!gritBuf) gritBuf = makeGritBuffer();
      clank();
      const t = ac.currentTime;
      grindSrc = ac.createBufferSource(); grindSrc.buffer = gritBuf; grindSrc.loop = true;
      grindSrc.playbackRate.value = 0.95 + Math.random() * 0.1;
      grindGain = ac.createGain();
      grindGain.gain.setValueAtTime(0.0001, t); grindGain.gain.exponentialRampToValueAtTime(0.55, t + 0.05);
      // ringing metal resonances
      for (const [f, q, v] of [[980, 9, 0.9], [1650, 11, 0.7], [2480, 12, 0.55], [3600, 10, 0.35]]) {
        const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f * (0.97 + Math.random() * 0.06); bp.Q.value = q;
        const g = ac.createGain(); g.gain.value = v;
        grindSrc.connect(bp); bp.connect(g); g.connect(grindGain);
      }
      // rough lower body of the scrape
      const body = ac.createBiquadFilter(); body.type = 'bandpass'; body.frequency.value = 520; body.Q.value = 0.8;
      const bg = ac.createGain(); bg.gain.value = 0.5;
      grindSrc.connect(body); body.connect(bg); bg.connect(grindGain);
      grindGain.connect(sfxGain);
      grindSrc.start();
    } else if (!on && grindSrc) stopGrind();
  }
  function stopGrind() {
    const src = grindSrc, g = grindGain; grindSrc = null; grindGain = null;
    g.gain.setTargetAtTime(0.0001, ac.currentTime, 0.025);
    setTimeout(() => { try { src.stop(); } catch (e) {} }, 200);
  }

  // ---- "Dale, dale, dale" – traditional piñata song (melody written in its style) ----
  // each line: [syllables (shown as karaoke), midi notes, note lengths in beats, chord root]
  // Melody reconstructed from the published analysis of the traditional song (C major,
  // rising C-E-G-C' arpeggio, C'-A, G-E-C falling, D-G-D, D-F#, E-A, B-G, G-C', 4/4 → 2/4 → 4/4).
  const SONG = [
    ['Dale, dale, dale,',            [60, 64, 67, 72, 69, 69],         [1, 1, 1.5, .5, 1, 1],              48],
    ['no pierdas el tino,',          [67, 67, 67, 64, 64, 60],         [.75, .25, 1, 1, 1, 2],             48],
    ['porque si lo pierdes,',        [62, 67, 62, 66, 67, 67],         [1, 1, 1.5, .5, 1, 1],              43],
    ['pierdes el camino.',           [64, 69, 69, 71, 67, 72],         [.75, .25, 1, 1, 1, 2],             48],
    ['Ya le diste una,',             [67, 67, 67, 67, 69, 67],         [.5, .5, .5, .5, 1, 1],             48],
    ['ya le diste dos,',             [69, 69, 69, 69, 71],             [.5, .5, .5, .5, 2],                41],
    ['ya le diste tres',             [71, 71, 71, 71, 72],             [.5, .5, .5, .5, 2],                43],
    ['y tu tiempo se acabó.',        [72, 72, 71, 69, 67, 64, 62, 60], [.5, .5, .5, .5, .5, .5, 1, 3],     48],
  ];
  const SONG_BPM = 160;
  let songNodes = [], songGain = null;
  function songPlan(repeats) {
    const beat = 60 / SONG_BPM, lines = [];
    let t = 0;
    for (let r = 0; r < repeats; r++) for (let li = 0; li < SONG.length; li++) {
      const [text, notes, lens, root] = SONG[li];
      const dur = lens.reduce((a, b) => a + b, 0) * beat;
      lines.push({ text, start: t, dur, rep: r, notes, lens, root });
      t += dur;
    }
    return { lines, total: t };
  }
  // The piñata song comes from Matt's own MP3 (2 passes, ~34 s). Line timings were measured
  // from the recording (melody onsets); each musical phrase carries two lines of the lyrics.

function saveProgress() { SAVE.hearts = S.hearts; SAVE.coins = S.coins; SAVE.score = S.score; SAVE.wtime.tal = S.wtime; bumpBest(); writeSave(); }
// points: n points, shown as a little "+n" at (x, y) when given

// ---------------- getting hurt ----------------
function hurt(srcX) {

}

  resetDinos(); buildObjects(); S.fireballs = []; S.waves = []; S.boss = null; Audio.setBoss(false);
  const k = S.kai; k.x = SAVE.cpX || 160; k.y = FLOOR; k.vx = 0; k.vy = 0; k.dir = 0; k.face = 1; k.inv = 60; k.ground = true; k.platform = null; k.safeX = k.x;

// ---------------- update ----------------
function update(dt) {
  S.t += dt;
  if (S.msgTimer > 0) S.msgTimer -= dt;
  if (S.heartFlash > 0) S.heartFlash -= dt;
  if (S.shake > 0) S.shake = Math.max(0, S.shake - 0.5 * dt);
  if (playing()) S.wtime += dt;                       // time played in this world (frames)
  S.saveT = (S.saveT || 0) + dt; if (S.saveT > 120 && playing()) { S.saveT = 0; saveProgress(); }   // keep the points safe every 2 s
  for (const p of S.pops) p.t += dt; S.pops = S.pops.filter(p => p.t < 60);
  updateParticles(dt);
  for (const o of S.objects) o.p += 0.05 * dt;
  if (S.phase === 'rodeo' || S.phase === 'fossil') { updateGame(dt); return; }
  if (S.phase === 'climb') {
    // climbing up the liana: Kai pulls himself up and out of the picture, then the camera follows him up
    S.climbT += dt; S.kai.y -= 2.6 * dt;
    if (S.climbT > 46 && !S.leaving) { S.leaving = true; saveProgress(); goToWorld('hoehe.html', 'from=tal'); }
    return;
  }
  if (!playing()) { if (S.phase === 'won') updateBossDead(dt); return; }
  updateKai(dt);
  updateLianas(dt);
  updatePipes();
  updateDinos(dt);
  updateVolcanoes(dt);
  updatePickups();
  updateSites();
  if (S.phase === 'boss' || (!S.boss && S.kai.x > BOSS_X + 260)) updateBoss(dt);
  for (const x of CHECKPOINTS) if (S.kai.x > x) reachCheckpoint(x);
  // camera: Kai a bit behind the middle in the direction he rides
  const k = S.kai;
  if (S.boss) S.cam += (BOSS_X - S.cam) * Math.min(1, 0.08 * dt);
  else {
    // like Super Mario: Kai moves freely inside a middle zone of the screen, the camera only follows
    // when he pushes against its edge – turning around never makes the whole screen slide
    const L = W * 0.32, R = W * 0.5, sx = k.x - S.cam;
    let target = S.cam;
    if (sx > R) target = k.x - R; else if (sx < L) target = k.x - L;
    target = clamp(target, 0, BOSS_X);
    if (Math.abs(target - S.cam) > 40) S.cam += (target - S.cam) * Math.min(1, 0.12 * dt);   // after a jump back (tar, checkpoint)
    else S.cam = target;
  }
}
function updateKai(dt) {

  // speed: rolls towards the chosen direction, brakes when stopped
  const target = k.dir * SPEED * (S.phase === 'boss' ? 1.05 : 1);

    if (k.dir === 0) { const s = Math.sign(k.vx); k.vx -= s * Math.min(Math.abs(k.vx), BRAKE * dt); }
    else k.vx += clamp(target - k.vx, -ACC * dt * (k.ground ? 1 : 0.7), ACC * dt * (k.ground ? 1 : 0.7));
  }

  let nx = k.x + k.vx * dt;
  // boulders block from the side
  for (const r of SOLIDS) {
    const top = FLOOR - r.h;
    if (k.y > top + 4 && nx + 20 > r.x && nx - 20 < r.x + r.w) {
      if (k.x <= r.x + r.w / 2) nx = r.x - 20; else nx = r.x + r.w + 20;
      k.vx = 0;
    }
  }
  // map edges and the boss arena walls
  const minX = S.boss ? BOSS_X + 40 : 40, maxX = S.boss ? MAP_END - 40 : MAP_END - 40;
  if (nx < minX) { nx = minX; k.vx = 0; } if (nx > maxX) { nx = maxX; k.vx = 0; }
  k.x = nx;

    const pl = k.platform;
    if (k.x < pl.x1() - 18 || k.x > pl.x2() + 18) { k.ground = false; k.platform = null; k.coyote = 6; }
    else k.y = pl.top();

        if (prevY <= top + 2 && k.y >= top && k.x > pl.x1() - 14 && k.x < pl.x2() + 14) { landOn(pl, top); break; }
      }
      if (!k.ground && k.y >= FLOOR) {

function platformsNear(x) {

  for (const r of SOLIDS) if (x > r.x - 60 && x < r.x + r.w + 60) list.push({ x1: () => r.x, x2: () => r.x + r.w, top: () => FLOOR - r.h, pipe: r.pipe ? r : null });
  for (const d of S.dinos) if (d.type === 'brachio' && Math.abs(x - d.x) < 160) list.push({ dino: d, x1: () => d.x - 80, x2: () => d.x + 80, top: () => brachioTop(d) });
  return list;
}

function updateDinos(dt) {
  const k = S.kai, kb = kaiBox();
  for (const d of S.dinos) {
    if (d.dead) { d.deadT += dt; continue; }
    if (Math.abs(d.x - k.x) > 1500) continue;     // far away: asleep
    if (d.stun > 0) {                              // dizzy after the first hit: stands still
      d.stun -= dt; d.vx = 0;
      collideDino(d, kb);
      continue;
    }
    d.t += dt;
    let sp = d.sp;
    if (d.type === 'trike') {
      // charges when Kai is in front of it on the ground
      const ahead = (k.x - d.x) * d.dir;
      if (d.state === 'walk' && ahead > 0 && ahead < 420 && k.y > FLOOR - 60 && Math.random() < 0.03 * dt) { d.state = 'charge'; Audio.play('roar'); }
      if (d.state === 'charge') sp = 4.6;
    }
    if (d.type === 'raptor') { d.hop = Math.max(0, Math.sin(d.t * 0.12) * 10); }
    d.vx = d.dir * sp;
    d.x += d.vx * dt;
    if (d.x < d.x1) { d.x = d.x1; d.dir = 1; d.state = 'walk'; }
    if (d.x > d.x2) { d.x = d.x2; d.dir = -1; d.state = 'walk'; }
    rockBlock(d);
    collideDino(d, kb);
  }
}
function collideDino(d, kb) {
  if (d.type === 'brachio') return;                // the brachiosaurus is friendly
  const db = dinoBox(d), k = S.kai;
  if (!overlap(kb, db)) return;
  if (k.vy > 0 && (k.prevY ?? k.y) <= db.y1 + 18) stomp(d);   // coming down from above = jump on it
  else hurt(d.x);

// ---------------- volcanoes: fireballs come from the back in an arc ----------------
function volcScreenX(vx) { return vx - S.cam * VOLC_PAR; }

  VOLCANOES.forEach((vx, i) => {
    const sx = volcScreenX(vx);
    if (sx < 60 || sx > W - 60) return;
    S.volcT[i] -= dt;
    if (S.volcT[i] <= 0 && S.phase === 'play') {
      S.volcT[i] = rand(150, 240);
      // aim at where Kai will be, a little scattered – only at solid ground
      let tx = k.x + k.vx * 70 + rand(-90, 90);
      if (isTarAt(tx)) tx += 140;
      S.fireballs.push({ vi: i, tx, t: 0, T: 118, done: false });
      Audio.play('swish');
    }
  });
  for (const f of S.fireballs) {
    f.t += dt;

      f.done = true;
      burst(f.tx, FLOOR - 6, '#ff7a1a', 22, 5); burst(f.tx, FLOOR - 6, '#ffd23a', 10, 3); S.shake = Math.max(S.shake, 5);
      Audio.play('lavahit');

    }

}
// where a fireball is on the SCREEN (it comes from the volcano in the back towards the path)
function fireballPos(f) {
  const u = clamp(f.t / f.T, 0, 1), sx0 = volcScreenX(VOLCANOES[f.vi]), sy0 = FLOOR - 176;
  const sx1 = f.tx - S.cam, sy1 = FLOOR - 8;
  const x = sx0 + (sx1 - sx0) * u, y = sy0 + (sy1 - sy0) * u - Math.sin(u * Math.PI) * 220;

// ---------------- pickups ----------------
function updatePickups() {
  const k = S.kai, kb = kaiBox();
  for (const o of S.objects) {
    if (o.done) continue;
    if (Math.abs(o.x - k.x) > 90) continue;
    if (kb.x1 - o.r < o.x && kb.x2 + o.r > o.x && kb.y1 - o.r < o.y && kb.y2 + 8 > o.y) {
      o.done = true;
      if (o.type === 'coin') { S.coins++; addScore(PTS.coin); burst(o.x, o.y, '#ffd23a', 6, 2.5); Audio.play('coin'); }
      if (o.type === 'heart') { S.hearts++; S.heartFlash = -30; burst(o.x, o.y, '#ff3b5c', 14, 3); Audio.play('chest'); flash('+1 HERZ', 50); }
    }
  }
}

function updateParticles(dt) {
  for (const p of S.particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.g ?? 0.18) * dt; p.life -= 0.03 * dt; }
  S.particles = S.particles.filter(p => p.life > 0);
  for (const w of S.waves) { w.x += w.vx * dt; w.life -= dt; }
  S.waves = S.waves.filter(w => w.life > 0 && w.x > BOSS_X - 40 && w.x < MAP_END + 40);
}

// ---------------- lianas up to the Felsenhöhe ----------------
function updateLianas(dt) {

  if (S.phase !== 'play' || k.ground) return;
  for (const lx of LIANAS) {

    if (Math.abs(k.x - lx) < 32 && k.y - 112 < LIANA_BOTTOM) {
      k.x = lx; k.y = LIANA_BOTTOM + 112; k.vx = 0; k.vy = 0; k.dir = 0;

}
// standing on top of a pipe: down into the lava caves (only with the Magma-Board)
function updatePipes() {
  const k = S.kai, on = k.ground && k.platform && k.platform.pipe;
  if (!on) { S.onPipe = false; return; }
  if (S.onPipe || S.phase !== 'play') return;
  S.onPipe = true;

// ---------------- mini-game places: ask on the way ----------------
function updateSites() {
  const k = S.kai;
  for (const [id, x] of Object.entries(SITES)) {
    // the question comes when Kai passes the entrance – also in the air or on a log above it: then as soon as he lands
    const gate = x + 120, d = Math.abs(k.x - gate);

// ---------------- panel buttons (start, ask, game over, won) ----------------
const BTN = {
  start: { x: W / 2 - 110, y: 236, w: 220, h: 46 },
  yes: { x: W / 2 - 215, y: 228, w: 200, h: 44 }, no: { x: W / 2 + 15, y: 228, w: 200, h: 44 },
  goYes: { x: W / 2 - 215, y: 228, w: 210, h: 40 }, goNo: { x: W / 2 + 5, y: 228, w: 210, h: 40 },
  menu: { x: W / 2 - 120, y: 236, w: 240, h: 44 }, up: { x: W / 2 - 250, y: 236, w: 240, h: 44 }, menu2: { x: W / 2 + 10, y: 236, w: 240, h: 44 },
  music: { x: W - 252, y: 10, w: 34, h: 30 }, sfx: { x: W - 212, y: 10, w: 34, h: 30 },
};
const inRect = (p, b) => b && p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
function toLogical(e) { const r = canvas.getBoundingClientRect(), sc = Math.min(r.width / W, r.height / VH); return { x: (e.clientX - r.left - (r.width - W * sc) / 2) / sc, y: (e.clientY - r.top - (r.height - VH * sc) / 2) / sc - DY }; }
canvas.addEventListener('pointerdown', e => {
  if (CUR !== ME || TRANS || MENU.open || CONFIRM.open) return;
  const p = toLogical(e), hp = { x: p.x, y: p.y + DY };
  Audio.init();
  if (pauseClick(hp)) return;
  if (PAUSE.on) return;
  if (INV.btn && invClick(hp)) return;
  if (INV.open) return;
  if (inRect(hp, BTN.music)) { Audio.toggleMusic(); return; }
  if (inRect(hp, BTN.sfx)) { Audio.toggleSfx(); return; }
  if (S.phase === 'start') { beginWorld(); return; }
  if (S.phase === 'ask') {
    if (inRect(p, BTN.yes)) { const id = S.ask; S.ask = null; if (id === 'liana') climbUp(); else if (id === 'pipe') enterPipe(); else startGame(id); }
    else if (inRect(p, BTN.no)) { const id = S.ask; S.ask = null; if (id === 'liana') letGo(); else { S.phase = 'play'; Audio.play('tink'); } }
    return;
  }
  if (S.phase === 'rodeo' || S.phase === 'fossil') { gamePointer(p); return; }
  if (S.phase === 'gameover') { if (inRect(p, BTN.goYes)) resetGame(); else if (inRect(p, BTN.goNo)) { resetGame(); toMainMenu(); } return; }
  if (S.phase === 'won') { if (inRect(p, BTN.up)) { saveProgress(); goToWorld('hoehe.html', 'from=tal'); } else if (inRect(p, BTN.menu2)) toMainMenu(); return; }
});

function enter() { beginWorld(); }
function enterFromMenu() { S.noHud = S.phase === 'start'; }   // the start panel with the controls stays until tapped
const TEST = {
  setX(x) { const k = S.kai; k.x = x; k.safeX = x; S.cam = clamp(x - W * 0.36, 0, BOSS_X); },
  startBoss() { TEST.setX(BOSS_X + 300); },
  pipe(i = 0) { const k = S.kai, pp = PIPES[i]; TEST.setX(pp.x + pp.w / 2); k.y = FLOOR - pp.h - 60; k.ground = false; k.vy = 1; },
  liana(i = 0) { const k = S.kai; TEST.setX(LIANAS[i]); k.ground = false; k.y = LIANA_BOTTOM + 100; k.vy = -1; },

// =====================================================================
//  END BOSS: T-REX
//  He walks at Kai, roars, stomps three times (shock waves run along the ground → jump!),
//  then he is dizzy and lowers his head: jump ON his head. 3 hits → he falls over.
//  When not dizzy he sometimes charges through the arena.
// =====================================================================
function startBoss() {
  S.boss = { x: MAP_END + 220, face: -1, hp: 3, state: 'enter', t: 0, speed: 1.7, head: 0, flash: 0, stomps: 0, rot: 0, step: 0 };
  S.phase = 'boss'; S.fireballs = [];
  Audio.setBoss(true); Audio.play('roar'); S.shake = 10;
  flash('DER T-REX! Spring ihm auf den Kopf, wenn er benommen ist!', 200);
}
const rexHead = b => b.head > 0.5
  ? { x: b.x + b.face * 150, y: FLOOR - 64, w: 100, h: 58 }     // lowered (dizzy)
  : { x: b.x + b.face * 128, y: FLOOR - 176, w: 92, h: 62 };
function rexBodyBox(b) { return { x1: b.x - 112, x2: b.x + 112, y1: FLOOR - 176, y2: FLOOR - 4 }; }
function updateBoss(dt) {
  if (!S.boss) { startBoss(); return; }
  const b = S.boss, k = S.kai;

  b.bar = (b.bar ?? 1) + (b.hp / 3 - (b.bar ?? 1)) * Math.min(1, 0.08 * dt);   // the energy bar slides down smoothly
  const toward = Math.sign(k.x - b.x) || -1;
  const lo = BOSS_X + 170, hi = MAP_END - 170;
  b.head += ((b.state === 'dizzy' ? 1 : 0) - b.head) * Math.min(1, 0.12 * dt);
  const walk = v => { b.x = clamp(b.x + v * dt, lo, hi); b.step += Math.abs(v) * dt; };
  switch (b.state) {
    case 'enter':

      break;
    case 'walk':
      b.face = toward; walk(b.face * b.speed);
      if (Math.abs(k.x - b.x) < 300 || b.t > 150) { b.state = 'roar'; b.t = 0; Audio.play('roar'); S.shake = 9; }
      break;
    case 'roar':
      b.face = toward;

      break;

//  MINI GAMES IN THE DINO VALLEY
//  DINO-RODEO: ride a bucking triceratops for 15 seconds – lean left / right to stay on.

//    Every empty hole shows how many bones lie right next to it (like a metal detector).

const RODEO_T = 900;                 // 15 seconds
const FOS = { cols: 6, rows: 4, bones: 6, digs: 15, cw: 82, ch: 50 };
FOS.x = W / 2 - FOS.cols * FOS.cw / 2; FOS.y = 84;

function startGame(id) {

    S.game = { id, t: 0, bal: 0, bv: 0, hold: 0, result: null, buck: 0 };
    flash(CTRL.touch ? 'Links / rechts antippen und halten = lehnen!' : 'Pfeil links / rechts = lehnen!', 140);
  } else {
    const cells = [];
    for (let r = 0; r < FOS.rows; r++) for (let c = 0; c < FOS.cols; c++) cells.push({ c, r, bone: false, dug: false, n: 0 });
    const idx = cells.map((_, i) => i).sort(() => Math.random() - 0.5).slice(0, FOS.bones);
    for (const i of idx) cells[i].bone = true;
    for (const cl of cells) cl.n = cells.filter(o => o.bone && Math.abs(o.c - cl.c) <= 1 && Math.abs(o.r - cl.r) <= 1 && o !== cl).length;

function gameKey(e) {

function gamePointer(p) {

  const gr = ctx.createLinearGradient(bx, 0, bx + 400, 0); gr.addColorStop(0, '#d8352c'); gr.addColorStop(0.3, '#ffd23a'); gr.addColorStop(0.5, '#34c759'); gr.addColorStop(0.7, '#ffd23a'); gr.addColorStop(1, '#d8352c');
  ctx.fillStyle = gr; ctx.beginPath(); ctx.roundRect(bx, by, 400, 16, 8); ctx.fill();
  const nx = bx + 200 + clamp(g.bal, -1, 1) * 200;
  ctx.fillStyle = '#fff'; ctx.strokeStyle = OUT; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(nx, by - 6); ctx.lineTo(nx - 8, by - 14); ctx.lineTo(nx + 8, by - 14); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.fillRect(nx - 2, by - 6, 4, 26);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = 'bold 16px Arial'; ctx.fillStyle = '#fff';

  if (!g.result && CTRL.touch) { ctx.font = 'bold 40px Arial'; ctx.globalAlpha = 0.35; ctx.fillText('◀', 70, FLOOR - 80); ctx.fillText('▶', W - 70, FLOOR - 80); }
  ctx.restore();

}
function drawFossil() {
  const g = S.game; if (!g) return;
  panel(tx('FOSSILIEN AUSGRABEN'), [], '#ffd23a', 22);
  ctx.save(); ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
  ctx.fillStyle = '#fff6e8'; ctx.font = 'bold 15px Arial';
  ctx.fillText(tx('Knochen: {f} / 6   ·   Grabungen übrig: {d}', { f: g.found, d: g.digs }), W / 2, FOS.y - 26);
  for (const cl of g.cells) {
    const x = FOS.x + cl.c * FOS.cw, y = FOS.y + cl.r * FOS.ch;
    ctx.fillStyle = cl.dug ? (cl.bone ? '#f3e2b5' : '#b58a55') : '#e3c88f';
    ctx.strokeStyle = OUT; ctx.lineWidth = 2; ctx.beginPath(); ctx.roundRect(x + 3, y + 3, FOS.cw - 6, FOS.ch - 6, 8); ctx.fill(); ctx.stroke();
    if (!cl.dug) { ctx.fillStyle = 'rgba(150,110,60,0.35)'; ctx.beginPath(); ctx.arc(x + 20, y + 18, 3, 0, Math.PI * 2); ctx.arc(x + 54, y + 30, 2.5, 0, Math.PI * 2); ctx.fill(); }
    else if (cl.bone) {
      ctx.save(); ctx.translate(x + FOS.cw / 2, y + FOS.ch / 2); ctx.rotate(-0.3); ctx.fillStyle = '#fffdf4'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.roundRect(-18, -4, 36, 8, 4); ctx.fill(); ctx.stroke();
      for (const [bx, by] of [[-18, -4], [-18, 4], [18, -4], [18, 4]]) { ctx.beginPath(); ctx.arc(bx, by, 5, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); }
      ctx.restore();
    } else {
      // the number = how many bones lie in the 8 fields right around it; the colour shows "how warm" it is
      ctx.fillStyle = ['rgba(255,255,255,0.55)', '#ffe066', '#ffa63a', '#ff5a3a', '#ff2a6a'][Math.min(cl.n, 4)];
      ctx.strokeStyle = OUT; ctx.lineWidth = 3; ctx.font = 'bold 22px Arial';

    ctx.fillStyle = '#fff6e8'; ctx.font = 'bold 13px Arial';

  }

  if (g.result) { ctx.save(); ctx.fillStyle = 'rgba(30,18,10,0.7)'; ctx.fillRect(0, -VH, W, 3 * VH); ctx.restore(); }
  if (g.result === 'win') drawSkeleton(W / 2, 150);   // the skeleton, assembled
  if (g.result) resultPanel(g.result === 'win' ? tx('Ein ganzes Dino-Skelett! Super gegraben!') : tx('Keine Grabungen mehr. Versuch es nochmal!'), g.result === 'win');
}
function drawSkeleton(x, y) {

// ==================== WORLD: makeHoehe ====================
function makeHoehe(QUERY) {
const ME = {};
// =====================================================================
//  LEVEL 3 · WORLD 2 – DIE FELSENHÖHE (the upper world above the dino valley)
//  Reached by climbing a liana in the valley. Super-Mario-style rocks over deep gorges:
//  fixed ledges, moving rocks, crumbling rocks that fall away, small ground dinos (Kompsos),
//  flying pterosaurs and falling stones from the cliffs above.
//  Weapon: the STEINSCHLEUDER (shoot button on the right / X / right mouse button).
//  In the middle: the OXXO in a tree house (Magma-Board for the lava caves!) and the
//  Flugsaurier-Ritt mini game. End boss: the giant Flugsaurier-Mama.
// =====================================================================
const SPEED = 5.4, ACC = 0.24, BRAKE = 0.8, GRAV = 0.62, JUMP_V = -12.6, JUMP_CUT = -5.2;
const BOSS_X = 9400, MAP_END = BOSS_X + W;      // the boss arena is exactly one screen wide

// ---------------- the map ----------------

  { x: 600, y: 210, w: 160, kind: 'rock' }, { x: 830, y: 150, w: 130, kind: 'rock' },

  { x: 2480, y: 212, w: 150, kind: 'rock' }, { x: 2690, y: 150, w: 130, kind: 'rock' },
  { x: 2975, y: 250, w: 120, kind: 'move', ax: 250, ay: 0, sp: 0.016 },
  { x: 3620, y: 210, w: 190, kind: 'rock' }, { x: 3860, y: 150, w: 120, kind: 'move', ax: 0, ay: 50, sp: 0.03 },
  { x: 4880, y: 205, w: 170, kind: 'rock' },
  { x: 5375, y: 255, w: 100, kind: 'move', ax: 0, ay: 70, sp: 0.024 },
  { x: 5680, y: 212, w: 150, kind: 'rock' }, { x: 5880, y: 150, w: 120, kind: 'rock' },
  { x: 6190, y: 248, w: 95, kind: 'crumble' }, { x: 6335, y: 228, w: 95, kind: 'crumble' },
  { x: 6680, y: 205, w: 170, kind: 'rock' },
  { x: 7030, y: 248, w: 115, kind: 'move', ax: 330, ay: 0, sp: 0.012 },
  { x: 8000, y: 212, w: 150, kind: 'rock' }, { x: 8170, y: 150, w: 120, kind: 'rock' },
  { x: 8335, y: 250, w: 90, kind: 'crumble' }, { x: 8460, y: 230, w: 90, kind: 'crumble' },

// small ground dinos (Kompsos): run back and forth, turn at gorges – jump on them or shoot them
const COMPY_PLAN = [[650, 1050], [1300, 1850], [2350, 2900], [3400, 4150], [4600, 5250], [5600, 6100], [6500, 6950], [7900, 8280], [8650, 9300]];
// pterosaurs: hover in the air and swoop down at Kai – jump on them or shoot them
const PTERO_PLAN = [[1300, 1850, 110], [2350, 2950, 90], [3400, 4050, 100], [4650, 5250, 105], [5600, 6150, 90], [6450, 7000, 100], [7050, 7500, 80], [7900, 8550, 110], [8700, 9300, 95]];
// overhanging cliffs: stones fall down while Kai rides underneath (a shadow shows where)
const STONE_ZONES = [[2350, 2900], [3700, 4150], [5600, 6100], [8650, 9250]];
const CHECKPOINTS = [3450, 6500];
const SITES = { oxxo: 4300, ptero: 7600 };      // tree house shop / pterosaur ride (gate = x + 120)
const LIANA_DOWN = 70;                           // the liana back down into the valley (left edge)

const S = {
  phase: 'start', t: 0, cam: 0, hearts: SAVE.hearts || LIFE_HEARTS, coins: SAVE.coins || 0, score: SAVE.score || 0, pops: [], wtime: SAVE.wtime.hoehe || 0, combo: 0,
  kai: { x: 200, y: FLOOR, vx: 0, vy: 0, dir: 0, face: 1, faceAnim: 1, ground: true, platform: null, inv: 0, pushT: 0, landT: 0, safeX: 200, jumpHeld: false, hurtT: 0, shootT: 0, climb: 0 },
  plats: [], objects: [], compys: [], pteros: [], stones: [], shots: [], particles: [], eggs: [],
  stoneT: 60, reload: 0,
  cpX: 200, msg: '', msgTimer: 0, heartFlash: 0, shake: 0,
  ask: null, asked: {}, boss: null, noHud: false, hideKai: false, game: null, shopMsg: '', shopMsgT: 0,
};
window.__S = S; window.__T = () => TEST; window.__V = () => [VH, DY, SAVE];

function buildWorld() {
  S.plats = PLATS.map(p => Object.assign({ x0: p.x, y0: p.y, ph: 0, state: 'idle', st: 0, vy: 0, dx: 0, dy: 0 }, p));
  S.compys = COMPY_PLAN.map(([a, b], i) => ({ x: (a + b) / 2, x1: a, x2: b, dir: i % 2 ? 1 : -1, t: rand(0, 100), dead: false, deadT: 0 }));
  S.pteros = PTERO_PLAN.map(([a, b, y], i) => ({ x: (a + b) / 2, x1: a, x2: b, hy: y, y, dir: i % 2 ? 1 : -1, t: rand(0, 200), state: 'fly', st: 0, dead: false, deadT: 0, vy: 0, cool: rand(60, 160) }));
  const o = [];
  const coin = (x, y) => o.push({ type: 'coin', x, y, r: 11, p: rand(0, 6) });
  const arc = (x, y, n, gap = 34, lift = 30) => { for (let i = 0; i < n; i++) coin(x + i * gap, y - Math.sin(i / Math.max(1, n - 1) * Math.PI) * lift); };
  for (const [a, b] of GROUND) for (let x = a + 140; x < Math.min(b, BOSS_X) - 160; x += 560) arc(x, FLOOR - 40, 5);
  for (let i = 0; i < GROUND.length - 1; i++) { const a = GROUND[i][1], b = GROUND[i + 1][0]; arc(a - 20, FLOOR - 120, 6, (b - a + 40) / 5, 50); }
  for (const p of PLATS) if (p.kind === 'rock') arc(p.x + 20, p.y - 34, Math.max(3, Math.floor(p.w / 45)), 38, 0);
  for (const [x, y] of [[895, 108], [3920, 60], [5940, 108], [8230, 108]]) o.push({ type: 'heart', x, y, r: 14, p: 0 });
  S.objects = o;
}
buildWorld();
// coming up the liana from the valley: Kai arrives at the start, on top of the cliff
if (QUERY.get('from') === 'tal') { S.kai.x = 200; S.cam = 0; }

// ---------------- helpers ----------------
const groundAt = x => GROUND.some(([a, b]) => x > a + 4 && x < b - 4);
function burst(x, y, color, n, speed = 4) { for (let i = 0; i < n; i++) { const a = rand(0, Math.PI * 2), v = rand(1, speed); S.particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1, r: rand(2, 4.5), color, life: 1, g: 0.18 }); } }
function flash(text, f = 80) { S.msg = tx(text); S.msgTimer = f; }
const kaiBox = () => { const k = S.kai; return { x1: k.x - 26, x2: k.x + 26, y1: k.y - 108, y2: k.y - 4 }; };
const overlap = (a, b) => a.x1 < b.x2 && a.x2 > b.x1 && a.y1 < b.y2 && a.y2 > b.y1;
const compyBox = c => ({ x1: c.x - 28, x2: c.x + 28, y1: FLOOR - 50, y2: FLOOR });
const pteroBox = p => { const s = p.baby ? 0.6 : 1; return { x1: p.x - 40 * s, x2: p.x + 40 * s, y1: p.y - 18 * s, y2: p.y + 20 * s }; };
const playing = () => S.phase === 'play' || S.phase === 'boss';
const isTouchDev = () => CTRL.touch;

// ---------------- control (called by the controller) ----------------
function steerDir(d) {
  const k = S.kai; if (!playing()) return;
  k.dir = d;
  if (k.hurtT <= 0 && Math.sign(k.vx) === -d) k.vx = 0;      // turn at once, no sliding
  if (d !== k.face) { k.face = d; Audio.play('flip'); }
}
function steerBrake() {
  const k = S.kai; if (!playing()) return;
  k.dir = 0; Audio.play('swish');
  // at the liana on the left edge: ↓ = climb back down into the valley
  if (S.phase === 'play' && k.ground && Math.abs(k.x - LIANA_DOWN) < 50) climbDown();
}
// arrow let go: Kai stops (a short roll-out of a few pixels, no sliding like on ice)
function steerStop() { const k = S.kai; if (!playing()) return; k.dir = 0; }
function steerJump(down) {
  const k = S.kai;
  if (!playing()) return;
  if (down) {
    k.jumpHeld = true;
    if (k.ground || k.coyote > 0) { k.vy = JUMP_V; k.ground = false; k.platform = null; k.coyote = 0; Audio.play('jump'); }
  } else {
    k.jumpHeld = false;
    if (k.vy < JUMP_CUT) k.vy = JUMP_CUT;
  }
}
// the slingshot: a stone flies in an arc in the direction Kai looks. The Super-Schleuder shoots two at once, faster.
const superSling = () => !!SAVE.items.sling2 && SAVE.weapon.hoehe !== 'sling';
function shoot() {
  const k = S.kai;
  if (!playing() || !SAVE.items.slingshot || S.reload > 0) return;
  S.reload = superSling() ? 13 : 24; k.shootT = 14;
  // a flat shot at hip height: it hits the small Kompsos on the ground as well as a landed Mama
  const x = k.x + k.face * 30, y = k.y - 48, vx = k.face * 11 + k.vx * 0.5;
  S.shots.push({ x, y, vx, vy: -0.8, life: 90 });
  if (superSling()) S.shots.push({ x, y: y - 6, vx: vx * 0.95, vy: -3.6, life: 90 });
  Audio.play('throwit');
}
const CTL = {
  steer: true,
  active: playing,
  showJump: playing,
  canShoot: () => playing() && !!SAVE.items.slingshot, shoot, auto: true, icon: 'sling',
  dir: steerDir, brake: steerBrake, jump: steerJump, stop: steerStop,
};

// keyboard: ← → ride, ↓ brake (at the liana: climb down), Space / ↑ jump, X shoot
window.addEventListener('keydown', e => {
  if (CUR !== ME || TRANS || PAUSE.on || INV.open || MENU.open) return;
  if (S.phase === 'start' && (e.code === 'Space' || e.code === 'Enter')) { beginWorld(); return; }
  if (!playing()) { gameKey(e); return; }
  if (e.code === 'KeyX') { shoot(); return; }
  if (e.repeat) return;
  if (e.code === 'ArrowDown' || e.code === 'KeyS') steerBrake();
  else if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); steerJump(true); }
});
window.addEventListener('keyup', e => {
  if (CUR !== ME) return;
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') { steerJump(false); gameKeyUp(e); }
});

// ---------------- start / checkpoints ----------------
function beginWorld() {
  const cont = QUERY.get('from') === 'continue' && SAVE.cpH;
  S.phase = 'play'; S.noHud = false; SAVE.started = true; SAVE.seenHoehe = true;
  S.hearts = SAVE.hearts || LIFE_HEARTS; S.coins = SAVE.coins || 0; S.score = SAVE.score || 0;
  const k = S.kai;
  if (QUERY.get('from') !== 'tal' || S.begun) { k.x = cont ? SAVE.cpH : 200; }
  k.y = FLOOR; k.vy = 0; k.vx = 0; k.dir = 0; k.face = 1; k.ground = true; k.platform = null; k.safeX = k.x;
  S.cpX = k.x; S.cam = clamp(k.x - W * 0.32, 0, BOSS_X); S.begun = true;
  if (QUERY.get('from') === 'tal' || !(SAVE.cps && SAVE.cps.hoehe)) setCheckpoint('hoehe'); else useCheckpoint('hoehe');
  writeSave(); Audio.init(); Audio.setTheme('hoehe');
  if (!SAVE.items.slingshot) {
    SAVE.items.slingshot = true; writeSave();
    flash(isTouchDev() ? 'Du hast eine STEINSCHLEUDER! Schuss-Taste rechts unten.' : 'Du hast eine STEINSCHLEUDER! Schießen: X oder rechte Maustaste.', 220);
    Audio.play('chest');
  } else flash('DIE FELSENHÖHE', 110);
}
function saveProgress() { SAVE.hearts = S.hearts; SAVE.coins = S.coins; SAVE.score = S.score; SAVE.wtime.hoehe = S.wtime; bumpBest(); writeSave(); }
// points: n points, shown as a little "+n" at (x, y) when given
function addScore(n, x, y, big) { S.score += n; if (x != null) S.pops.push({ x, y, text: '+' + fmtNum(n), t: 0, big }); }
// jumping from one enemy onto the next without touching the ground: ×2, ×4, ×8 (like Super Mario)
function comboScore(base, x, y) { S.combo++; const m = Math.min(8, 2 ** (S.combo - 1)); addScore(base * m, x, y, m > 1); if (m > 1) S.pops.push({ x, y: y - 24, text: '×' + m, t: 0, col: '#ff9ad0' }); }
// end of the world: the boss gives its 5000 points and the time bonus only the first time
function bossSummary(id) {
  if (SAVE.pts['boss_' + id]) { S.summary = { repeat: true }; return; }
  SAVE.pts['boss_' + id] = true;
  const sec = S.wtime / 60, tb = timeBonus(sec);
  S.score += PTS.boss + tb;
  SAVE.score = S.score; const rec = bumpBest();
  S.summary = { boss: PTS.boss, time: tb, sec, record: rec };
}
function reachCheckpoint(x) {
  if (x <= S.cpX) return;
  S.cpX = x; SAVE.cpH = x; saveProgress(); setCheckpoint('hoehe');
  flash('CHECKPOINT!', 70); Audio.play('chime');
}

// ---------------- getting hurt ----------------
function loseHeart() {
  S.hearts--; S.heartFlash = 30;
  if (S.hearts <= 0) {
    if (loseLife()) { S.hearts = LIFE_HEARTS; flash('Ein Leben weniger! Weiter geht\'s.', 120); Audio.play('warn'); }
    else { S.hearts = 0; S.phase = 'gameover'; Audio.play('gameover'); Audio.setBoss(false); saveProgress(); return false; }
  }
  return true;
}
function hurt(srcX) {
  const k = S.kai;
  if (k.inv > 0 || !playing()) return false;
  k.inv = 100; k.hurtT = 24; S.shake = 8;
  k.vy = -6; k.vx = (k.x < srcX ? -1 : 1) * 5; k.ground = false; k.platform = null;
  Audio.play('crash');
  loseHeart();
  saveProgress();
  return true;
}
function fallInGorge() {
  const k = S.kai;
  Audio.play('crash'); S.shake = 6;
  if (!loseHeart()) return;
  flash('Abgestürzt!', 70);
  k.x = k.safeX; k.y = FLOOR; k.vy = 0; k.vx = 0; k.dir = 0; k.ground = true; k.platform = null; k.inv = 80;
  saveProgress();
}
function resetGame() {
  restartWorldSave();
  S.hearts = SAVE.hearts || LIFE_HEARTS; S.coins = SAVE.coins || 0; S.score = SAVE.score || 0;
  buildWorld(); S.stones = []; S.shots = []; S.eggs = []; S.boss = null; Audio.setBoss(false);
  const k = S.kai; k.x = SAVE.cpH || 200; k.y = FLOOR; k.vx = 0; k.vy = 0; k.dir = 0; k.face = 1; k.inv = 60; k.ground = true; k.platform = null; k.safeX = k.x;
  S.cpX = k.x; S.cam = clamp(k.x - W * 0.32, 0, BOSS_X);
  S.phase = 'play';
}
// the liana back down into the valley
function climbDown() {
  const k = S.kai;
  k.x = LIANA_DOWN; k.vx = 0; k.dir = 0; S.phase = 'climb'; S.climbT = 0; Audio.play('swish');
}

// ---------------- update ----------------
function update(dt) {
  S.t += dt;
  if (S.msgTimer > 0) S.msgTimer -= dt;
  if (S.heartFlash > 0) S.heartFlash -= dt;
  if (S.shopMsgT > 0) S.shopMsgT -= dt;
  if (S.shake > 0) S.shake = Math.max(0, S.shake - 0.5 * dt);
  if (playing()) S.wtime += dt;                       // time played in this world (frames)
  S.saveT = (S.saveT || 0) + dt; if (S.saveT > 120 && playing()) { S.saveT = 0; saveProgress(); }   // keep the points safe every 2 s
  for (const p of S.pops) p.t += dt; S.pops = S.pops.filter(p => p.t < 60);
  updateParticles(dt);
  for (const o of S.objects) o.p += 0.05 * dt;
  if (S.phase === 'ride') { updateRide(dt); return; }
  if (S.phase === 'shop' || S.phase === 'ask') return;
  if (S.phase === 'climb') {
    // climbing down the liana: Kai sinks over the edge, then the camera follows him down into the valley
    S.climbT += dt; S.kai.y += 2.2 * dt;
    if (S.climbT > 40 && !S.leaving) { S.leaving = true; saveProgress(); goToWorld('tal.html', 'from=hoehe'); }
    return;
  }
  if (!playing()) { if (S.phase === 'won') updateBossDead(dt); return; }
  if (S.reload > 0) S.reload -= dt;
  updatePlats(dt);
  updateKai(dt);
  updateCompys(dt);
  updatePteros(dt);
  updateStones(dt);
  updateShots(dt);
  updatePickups();
  updateSites();
  if (S.phase === 'boss' || (!S.boss && S.kai.x > BOSS_X + 240)) updateBoss(dt);
  for (const x of CHECKPOINTS) if (S.kai.x > x) reachCheckpoint(x);
  const k = S.kai;
  if (S.boss) S.cam += (BOSS_X - S.cam) * Math.min(1, 0.08 * dt);
  else {
    // like Super Mario: Kai rides freely in the middle, the camera only follows at the edges of that zone
    const L = W * 0.32, R = W * 0.5, sx = k.x - S.cam;
    let target = S.cam;
    if (sx > R) target = k.x - R; else if (sx < L) target = k.x - L;
    target = clamp(target, 0, BOSS_X);
    if (Math.abs(target - S.cam) > 40) S.cam += (target - S.cam) * Math.min(1, 0.12 * dt);
    else S.cam = target;
  }
}

// rocks: moving ones swing back and forth, crumbling ones shake and then fall
function updatePlats(dt) {
  for (const p of S.plats) {
    const ox = p.x, oy = p.y;
    if (p.kind === 'move') {
      p.ph += p.sp * dt;
      p.x = p.x0 + (1 - Math.cos(p.ph)) / 2 * p.ax;
      p.y = p.y0 - (1 - Math.cos(p.ph)) / 2 * p.ay;
    } else if (p.kind === 'crumble') {
      if (p.state === 'shake') { p.st += dt; if (p.st > 34) { p.state = 'fall'; p.vy = 1; Audio.play('clank'); burst(p.x + p.w / 2, p.y, '#9c8466', 8, 3); } }
      else if (p.state === 'fall') { p.vy += 0.5 * dt; p.y += p.vy * dt; if (p.y > FLOOR + 400) { p.state = 'gone'; p.st = 0; } }
      else if (p.state === 'gone') { p.st += dt; if (p.st > 220 && Math.abs(S.kai.x - (p.x0 + p.w / 2)) > 160) { p.state = 'idle'; p.y = p.y0; p.st = 0; } }
    }
    p.dx = p.x - ox; p.dy = p.y - oy;
  }
}
const platSolid = p => p.state !== 'gone' && p.state !== 'fall';

function updateKai(dt) {
  const k = S.kai, prevY = k.y; k.prevY = prevY;
  if (k.inv > 0) k.inv -= dt;
  if (k.hurtT > 0) k.hurtT -= dt;
  if (k.landT > 0) k.landT -= dt;
  if (k.shootT > 0) k.shootT -= dt;
  k.faceAnim += (k.face - k.faceAnim) * Math.min(1, 0.7 * dt);
  const target = k.dir * SPEED * (S.phase === 'boss' ? 1.05 : 1);
  if (k.hurtT <= 0) {
    if (k.dir === 0) { const s = Math.sign(k.vx); k.vx -= s * Math.min(Math.abs(k.vx), BRAKE * dt); }
    else k.vx += clamp(target - k.vx, -ACC * dt * (k.ground ? 1 : 0.7), ACC * dt * (k.ground ? 1 : 0.7));
  }
  // standing on a moving rock: carried along
  if (k.platform) k.x += k.platform.dx;
  let nx = k.x + k.vx * dt;
  const minX = S.boss ? BOSS_X + 40 : 30, maxX = MAP_END - 40;
  if (nx < minX) { nx = minX; k.vx = 0; } if (nx > maxX) { nx = maxX; k.vx = 0; }
  if (k.y > FLOOR + 6 && groundAt(nx) && !groundAt(k.x)) { nx = k.x; k.vx = 0; }   // fallen into a gorge: the cliff walls are solid
  k.x = nx;
  if (k.ground && Math.abs(k.vx) < Math.abs(target) - 0.3) k.pushT = (k.pushT + dt) % 40; else if (k.pushT > 0 && k.pushT < 34) k.pushT += dt; else k.pushT = 0;
  if (k.ground && k.platform) {
    const pl = k.platform;
    if (!platSolid(pl) || k.x < pl.x - 18 || k.x > pl.x + pl.w + 18) { k.ground = false; k.platform = null; k.coyote = 6; }
    else {
      k.y = pl.y;
      if (pl.kind === 'crumble' && pl.state === 'idle') { pl.state = 'shake'; pl.st = 0; Audio.play('tink'); }
    }
  } else if (k.ground) {
    if (!groundAt(k.x)) { k.ground = false; k.coyote = 6; }
  }
  if (!k.ground) {
    if (k.coyote > 0) k.coyote -= dt;
    if (k.vy >= 0) k.jumpHeld = false;
    k.vy += GRAV * dt * (k.vy < 0 && !k.jumpHeld ? 1.6 : 1); k.y += k.vy * dt;
    if (k.vy > 0) {
      for (const pl of S.plats) {
        if (!platSolid(pl) || k.x < pl.x - 14 || k.x > pl.x + pl.w + 14) continue;
        const top = pl.y;
        if (prevY <= top + 3 + Math.max(0, -pl.dy) && k.y >= top) { landOn(pl, top); break; }
      }
      if (!k.ground && k.y >= FLOOR && prevY <= FLOOR + 2 && groundAt(k.x)) landOn(null, FLOOR);
      if (!k.ground && k.y > FLOOR + 260) fallInGorge();
    }
  }
  // a safe spot to come back to after a fall: firm ground, not right at a gorge
  if (k.ground && !k.platform && groundAt(k.x - 80) && groundAt(k.x + 80)) k.safeX = k.x;
}
function landOn(pl, top) {
  const k = S.kai;
  k.y = top; k.vy = 0; k.ground = true; k.platform = pl; k.landT = 8; S.combo = 0;
  Audio.play('land');
}

// ---------------- enemies ----------------
function stompBounce(top) {
  const k = S.kai;
  k.y = top; k.vy = k.jumpHeld ? JUMP_V * 0.95 : -9; k.ground = false; k.platform = null; k.coyote = 0;
  S.shake = Math.max(S.shake, 3);
}
function updateCompys(dt) {
  const k = S.kai, kb = kaiBox();
  for (const c of S.compys) {
    if (c.dead) { c.deadT += dt; continue; }
    if (Math.abs(c.x - k.x) > 1400) continue;
    c.t += dt;
    c.x += c.dir * 1.9 * dt;
    // turn at the bounds and before a gorge (they never fall in)
    if (c.x < c.x1 || !groundAt(c.x - 30)) { c.x = Math.max(c.x, c.x1); c.dir = 1; }
    if (c.x > c.x2 || !groundAt(c.x + 30)) { c.x = Math.min(c.x, c.x2); c.dir = -1; }
    const cb = compyBox(c);
    if (!overlap(kb, cb)) continue;
    if (k.vy > 0 && (k.prevY ?? k.y) <= cb.y1 + 16) { killCompy(c, true); stompBounce(cb.y1); }
    else hurt(c.x);
  }
}
function killCompy(c, stomped) { c.dead = true; c.deadT = 0; Audio.play('stomp'); burst(c.x, FLOOR - 24, '#f0c64a', 12, 4); if (stomped) comboScore(PTS.compy, c.x, FLOOR - 70); else addScore(PTS.compy, c.x, FLOOR - 70); }
function updatePteros(dt) {
  const k = S.kai, kb = kaiBox();

function killPtero(p, stomped) { p.dead = true; p.deadT = 0; p.vy = -3; Audio.play('stomp'); burst(p.x, p.y, '#e9a0c8', 12, 4); const n = p.baby ? PTS.baby : PTS.ptero; if (stomped) comboScore(n, p.x, p.y - 30); else addScore(n, p.x, p.y - 30); }

// ---------------- falling stones from the cliffs above ----------------
function updateStones(dt) {
  const k = S.kai;
  const zone = STONE_ZONES.find(([a, b]) => k.x > a - 100 && k.x < b + 100);
  if (zone && S.phase === 'play') {
    S.stoneT -= dt;
    if (S.stoneT <= 0) {
      S.stoneT = rand(70, 120);
      const x = clamp(k.x + k.vx * 34 + rand(-90, 90), zone[0], zone[1]);
      S.stones.push({ x, y: -DY - 40, vy: 1.5, r: rand(14, 20), rot: 0, done: false });
      Audio.play('swish');
    }
  } else S.stoneT = Math.max(S.stoneT, 40);
  for (const s of S.stones) {
    s.vy += 0.32 * dt; s.y += s.vy * dt; s.rot += 0.12 * dt;
    // hits Kai?
    if (!s.done && Math.abs(s.x - k.x) < 26 + s.r * 0.6 && s.y + s.r > k.y - 108 && s.y - s.r < k.y - 4) { s.done = true; burst(s.x, s.y, '#8a7a66', 12, 4); hurt(s.x); }
    // lands on the ground / a rock and breaks
    if (!s.done && s.y + s.r >= FLOOR && groundAt(s.x)) { s.done = true; burst(s.x, FLOOR - 6, '#9c8466', 14, 4); Audio.play('land'); S.shake = Math.max(S.shake, 3); }
    if (s.y > FLOOR + 500) s.done = true;
  }
  S.stones = S.stones.filter(s => !s.done);
}

// ---------------- slingshot stones ----------------
function updateShots(dt) {
  for (const s of S.shots) {
    s.vy += 0.09 * dt; s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    if (s.y > FLOOR && groundAt(s.x)) { s.life = 0; burst(s.x, FLOOR - 3, '#9c8466', 4, 2); continue; }
    for (const c of S.compys) if (!c.dead && overlap({ x1: s.x - 6, x2: s.x + 6, y1: s.y - 6, y2: s.y + 6 }, compyBox(c))) { killCompy(c); s.life = 0; break; }
    if (s.life <= 0) continue;
    for (const p of S.pteros) if (!p.dead && overlap({ x1: s.x - 6, x2: s.x + 6, y1: s.y - 6, y2: s.y + 6 }, pteroBox(p))) { killPtero(p); s.life = 0; break; }
    if (s.life > 0 && S.boss) shotHitsBoss(s);

// ---------------- pickups ----------------
function updatePickups() {
  const k = S.kai, kb = kaiBox();
  for (const o of S.objects) {
    if (o.done) continue;
    if (Math.abs(o.x - k.x) > 90) continue;
    if (kb.x1 - o.r < o.x && kb.x2 + o.r > o.x && kb.y1 - o.r < o.y && kb.y2 + 8 > o.y) {
      o.done = true;
      if (o.type === 'coin') { S.coins++; addScore(PTS.coin); burst(o.x, o.y, '#ffd23a', 6, 2.5); Audio.play('coin'); }
      if (o.type === 'heart') { S.hearts++; S.heartFlash = -30; burst(o.x, o.y, '#ff3b5c', 14, 3); Audio.play('chest'); flash('+1 HERZ', 50); }
    }
  }
}
function updateParticles(dt) {
  for (const p of S.particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.g ?? 0.18) * dt; p.life -= 0.03 * dt; }
  S.particles = S.particles.filter(p => p.life > 0);
}

// ---------------- the OXXO and the pterosaur ride: ask on the way ----------------
function updateSites() {
  const k = S.kai;
  // riding left against the liana at the cliff edge: ask whether Kai wants to climb down
  if (k.x > 260) S.asked.down = false;
  if (!S.asked.down && k.x < LIANA_DOWN + 10 && k.dir < 0 && k.ground && !k.platform) {
    S.asked.down = true; S.ask = 'down'; S.phase = 'ask'; k.vx = 0; k.dir = 0; Audio.play('chime'); return;
  }
  for (const [id, x] of Object.entries(SITES)) {
    // the question comes when Kai passes the entrance – also in the air or on a log above it: then as soon as he lands
    const gate = x + 120, d = Math.abs(k.x - gate);
    S.near = S.near || {};
    if (d > 300) { S.asked[id] = false; S.near[id] = false; }
    if (d < 60) S.near[id] = true;
    if (!S.asked[id] && S.near[id] && k.ground && d < 300) {
      S.asked[id] = true; S.ask = id; S.phase = 'ask';
      k.vx = 0; k.dir = 0; Audio.play('chime');
    }
  }
}

// =====================================================================
//  END BOSS: DIE RIESEN-FLUGSAURIER-MAMA
//  She circles above the arena. Whenever she flies over Kai she drops something from her claws:
//  a stone, or eggs – baby pterosaurs hatch from them and attack. The weaker she gets, the more eggs.
//  She swoops down low across the arena (jump over her or get away), and after two swoops she lands, tired.
//  EVERY slingshot hit takes energy off her (energy bar green → yellow → red); while she sits on the
//  ground a hit counts double. Energy 0 → she falls out of the sky / tips over.
// =====================================================================
const MAMA_HP = 100, HIT_AIR = 8, HIT_LANDED = 16;
function startBoss() {
  S.boss = { x: MAP_END + 200, y: 60, face: -1, hp: MAMA_HP, bar: 1, state: 'enter', t: 0, flap: 0, flash: 0, swoops: 0, drop: 60, rot: 0, sx: 0, sy: 0, tx: 0 };
  S.phase = 'boss'; S.stones = []; S.eggs = [];
  Audio.setBoss(true); Audio.play('bark'); S.shake = 8;
  flash('Die FLUGSAURIER-MAMA! Triff sie mit der Schleuder!', 200);
}
const mamaBox = b => b.state === 'landed' || b.state === 'dead'
  ? { x1: b.x - 70, x2: b.x + 70, y1: FLOOR - 120, y2: FLOOR - 4 }
  : { x1: b.x - 80, x2: b.x + 80, y1: b.y - 26, y2: b.y + 34 };
const weak = b => 1 - b.hp / MAMA_HP;          // 0 = full energy … 1 = almost beaten
function updateBoss(dt) {
  if (!S.boss) { startBoss(); return; }
  const b = S.boss, k = S.kai, lo = BOSS_X + 140, hi = MAP_END - 140, fast = weak(b);
  b.t += dt; b.flap += dt; if (b.flash > 0) b.flash -= dt;
  b.bar += (b.hp / MAMA_HP - b.bar) * Math.min(1, 0.1 * dt);
  updateEggs(dt);
  switch (b.state) {
    case 'enter':
      b.x -= 4 * dt; b.y += (80 - b.y) * 0.05 * dt;
      if (b.x <= hi) backToCircle(b);
      break;
    case 'circle': {
      // high up: a wide figure of eight over the arena
      b.ph += (0.018 + fast * 0.012) * dt; const u = b.ph, cx = BOSS_X + W / 2;
      const nx = cx + Math.sin(u) * (W / 2 - 170), ny = 78 + Math.sin(u * 2) * 26;
      b.face = Math.sign(nx - b.x) || b.face; b.x = nx; b.y += (ny - b.y) * Math.min(1, 0.1 * dt);
      // right above Kai: she lets something fall from her claws
      b.drop -= dt;
      if (b.drop <= 0 && Math.abs(b.x - k.x) < 70) {
        b.drop = 44 - fast * 14;
        if (Math.random() < 0.35 + fast * 0.35) dropEggs(b);
        else { S.stones.push({ x: b.x, y: b.y + 30, vy: 0.5, r: 16, rot: 0, done: false, fromMama: true }); Audio.play('swish'); }
      }
      if (b.t > 260 - fast * 60) { b.state = 'swoop'; b.t = 0; b.sx = b.x; b.sy = b.y; b.tx = k.x; Audio.play('bark'); }
      break;
    }
    case 'swoop': {
      // down to the ground through where Kai stood, and up again on the other side
      const T = 86 - fast * 20, u = Math.min(1, b.t / T), dirX = Math.sign(b.tx - b.sx) || -1;
      const ex = clamp(b.tx + dirX * 420, BOSS_X + 120, MAP_END - 120);
      b.x = b.sx + (ex - b.sx) * u; b.y = b.sy + (FLOOR - 52 - b.sy) * Math.sin(u * Math.PI);
      b.face = dirX;
      if (u >= 1) {
        b.swoops++; b.t = 0;
        if (b.swoops >= 2) { b.state = 'land'; b.swoops = 0; b.sx = b.x; b.sy = b.y; b.tx = k.x < BOSS_X + W / 2 ? hi - 60 : lo + 60; }
        else backToCircle(b);
      }
      break;
    }
    case 'land': {
      // glides down far away from Kai and lands
      const u = Math.min(1, b.t / 70);
      b.x = b.sx + (b.tx - b.sx) * u; b.y = b.sy + (FLOOR - 60 - b.sy) * (u * u);
      b.face = Math.sign(b.tx - b.sx) || b.face;
      if (u >= 1) { b.state = 'landed'; b.t = 0; b.face = Math.sign(k.x - b.x) || -1; Audio.play('land'); S.shake = 6; burst(b.x, FLOOR - 4, '#a9744a', 16, 4); flash('Sie ist gelandet – jetzt zählt jeder Treffer doppelt!', 100); }
      break;
    }
    case 'landed':
      b.face = Math.sign(k.x - b.x) || b.face;
      if (b.t > 230 - fast * 60) takeOff(b);
      break;
    case 'takeoff':
      b.y -= 3.4 * dt;
      if (b.y < 90) backToCircle(b);
      break;
    case 'falling':
      // beaten in the air: she tumbles down
      b.y += 5 * dt; b.x += b.face * 1.5 * dt;
      if (b.y >= FLOOR - 60) { b.y = FLOOR - 60; b.state = 'dead'; b.t = 0; S.shake = 10; burst(b.x, FLOOR - 4, '#a9744a', 20, 5); Audio.play('land'); }
      break;
    case 'dead':
      b.rot = Math.min(1.5, b.rot + 0.03 * dt);
      if (b.t > 110) winHeights();
      return;
  }
  // touching her hurts (also when she sits – she snaps)
  if (b.state !== 'dead' && b.state !== 'falling' && overlap(kaiBox(), mamaBox(b))) hurt(b.x);
}
// back up to circling: continue the figure of eight from where she is now (no jump)
function backToCircle(b) {
  b.state = 'circle'; b.t = 0;
  const s = clamp((b.x - (BOSS_X + W / 2)) / (W / 2 - 170), -1, 1); b.ph = b.face < 0 ? Math.PI - Math.asin(s) : Math.asin(s);
}
function takeOff(b) { b.state = 'takeoff'; b.t = 0; b.y = FLOOR - 60; Audio.play('flap'); Audio.play('bark'); }
// eggs from her claws: 1 at full energy, 2 when she is weaker, 3 at the end
function dropEggs(b) {
  const n = b.hp > MAMA_HP * 0.66 ? 1 : b.hp > MAMA_HP * 0.33 ? 2 : 3;
  for (let i = 0; i < n; i++) S.eggs.push({ x: b.x, y: b.y + 30, vx: (i - (n - 1) / 2) * 1.6, vy: 0.5, rot: 0, landed: false, t: 0 });
  Audio.play('pop');
}
function updateEggs(dt) {
  const k = S.kai;
  for (const e of S.eggs) {
    if (!e.landed) {
      e.vy += 0.3 * dt; e.y += e.vy * dt; e.x += e.vx * dt; e.rot += 0.08 * dt;
      // lands on Kai's head: ouch – and it breaks open
      if (Math.abs(e.x - k.x) < 30 && e.y > k.y - 112 && e.y - 22 < k.y - 4) { hurt(e.x); hatch(e); continue; }
      if (e.y >= FLOOR) { e.y = FLOOR; e.landed = true; e.t = 0; Audio.play('land'); }
    } else {
      e.t += dt;
      if (e.t > 50) hatch(e);
    }
  }
  S.eggs = S.eggs.filter(e => !e.done);
}
// a baby pterosaur flies out of the egg and attacks Kai
function hatch(e) {
  e.done = true; burst(e.x, e.y - 10, '#f6efd8', 10, 3); Audio.play('pop');
  S.pteros.push({ x: e.x, y: e.y - 20, x1: BOSS_X + 60, x2: MAP_END - 60, hy: rand(110, 160), dir: Math.sign(S.kai.x - e.x) || 1, t: 0, state: 'fly', st: 0, dead: false, deadT: 0, vy: 0, cool: rand(30, 90), baby: true });
}
// a slingshot stone reaches her: every hit counts, double while she sits on the ground
function shotHitsBoss(s) {
  const b = S.boss; if (!b || b.state === 'dead' || b.state === 'falling' || b.state === 'enter') return;
  if (!overlap({ x1: s.x - 6, x2: s.x + 6, y1: s.y - 6, y2: s.y + 6 }, mamaBox(b))) return;
  s.life = 0;
  const dmg = b.state === 'landed' ? HIT_LANDED : HIT_AIR;
  b.hp = Math.max(0, b.hp - dmg); b.flash = 14; S.shake = Math.max(S.shake, 4);
  burst(s.x, s.y, '#ffd23a', 12, 4); Audio.play('bossHit');
  if (b.hp <= 0) {
    // beaten: the babies fly away, she falls down (or tips over where she sits)
    for (const p of S.pteros) if (p.baby && !p.dead) { p.dead = true; p.deadT = 0; p.vy = -4; }
    S.eggs = [];
    flash('FLUGSAURIER-MAMA BESIEGT!', 100); Audio.play('bossDie');
    if (b.state === 'landed') { b.state = 'dead'; b.t = 0; } else { b.state = 'falling'; b.t = 0; }
  }
}
function winHeights() {
  if (S.phase === 'won') return;
  S.phase = 'won'; Audio.setBoss(false); Audio.play('win'); Audio.play('cheer');
  S.coins += 30; SAVE.done.hoehe = true; bossSummary('hoehe'); saveProgress();
  burst(S.kai.x, S.kai.y - 60, '#ffd23a', 40, 6);
}
