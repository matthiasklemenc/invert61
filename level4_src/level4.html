<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>INVERT – Level 4</title>
<style>
  html, body { margin: 0; padding: 0; background: #020c18; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: Arial, Helvetica, sans-serif; }
  canvas { display: block; width: 100vw; height: auto; max-height: 100vh; object-fit: contain; touch-action: none; user-select: none; -webkit-user-select: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';
const W = 1280, H = 340;      // world space of every game scene
const FLOOR = 300;            // street / cloud floor / sand line
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const dpr = Math.min(window.devicePixelRatio || 1, 2);
// The view is as tall as the screen allows (landscape phone ≈ 2.1:1 → ~600 high).
// The world sits at the bottom; the extra height (DY) is open space above it (more sky / more water).
let VH = H, DY = 0;
function fitView() {
  const a = Math.max(1, window.innerWidth) / Math.max(1, window.innerHeight);
  VH = Math.round(Math.min(760, Math.max(H, W / a))); DY = VH - H;
  canvas.width = W * dpr; canvas.height = VH * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
fitView();
window.addEventListener('resize', fitView); window.addEventListener('orientationchange', () => setTimeout(fitView, 200));

const OUT = '#14202e';        // outline colour (matches Kai's flat style)
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));


// =====================================================================
//  LEVEL 4 (WELTRAUM) – shared game state (moon base / Aurora 61 / underworld), languages, progress box
// =====================================================================
const SAVE_KEY = 'invert61-level4';
const SAVE_DEFAULT = {
  lang: 'de', hearts: 5, lives: 3, coins: 0, pearls: 0, starfish: 0,
  items: { laser: false, laser2: false, paint: false, paint2: false, sun: false, cake: false, fedBig: false },
  fruits: 0, flappy: false,
  weapon: {},
  outfit: { char: 'kai', tee: '#1f3c6e', cap: '#1e4fa3', beanie: false, backpack: false, shoes: '#1b1b22', halo: false },
  // two playable characters, each with her / his own clothes. SAVE.outfit is always the one being played.
  char: 'kai',
  outfitKai: null,
  outfitBali: { char: 'bali', tee: '#f6a3c4', cap: null, beanie: false, backpack: false, shoes: '#ffffff', halo: false, bottom: 'jeans' },
  owned: {},                                   // bought clothes
  done: { mond: false, aurora: false, unter: false },
  mid: { wurm: false },
  mini: { alien: null, foto: null },
  checkpoint: null,                            // snapshot at the start of the current world
  score: 0, best: 0,                           // points of this game / personal record on this device
  pts: {},                                     // what already gave its one-time points (mini games, bosses)
  wtime: { mond: 0, aurora: 0, unter: 0 },        // frames played in each world (for the time bonus)
};
function loadSave() {
  try {
    const raw = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
    if (raw) return Object.assign({}, SAVE_DEFAULT, raw, { pts: Object.assign({}, raw.pts), wtime: Object.assign({}, SAVE_DEFAULT.wtime, raw.wtime), items: Object.assign({}, SAVE_DEFAULT.items, raw.items), outfit: Object.assign({}, SAVE_DEFAULT.outfit, raw.outfit), outfitBali: Object.assign({}, SAVE_DEFAULT.outfitBali, raw.outfitBali), done: Object.assign({}, SAVE_DEFAULT.done, raw.done), mid: Object.assign({}, SAVE_DEFAULT.mid, raw.mid), mini: Object.assign({}, SAVE_DEFAULT.mini, raw.mini) });
  } catch (e) {}
  return JSON.parse(JSON.stringify(SAVE_DEFAULT));
}
const SAVE = loadSave();
// first start of Level 4: take over who rides, the clothes and the language from Level 3 (or Level 2)
if (!SAVE.importedL3) {
  try {
    const l3 = JSON.parse(localStorage.getItem('invert61-level3') || 'null') || JSON.parse(localStorage.getItem('invert61-level2') || 'null');
    if (l3) for (const k of ['char', 'outfit', 'outfitKai', 'outfitBali', 'owned', 'lang']) if (l3[k] != null) SAVE[k] = l3[k];
  } catch (e) {}
  SAVE.importedL3 = true;
}
SAVE.weapon = SAVE.weapon || {}; SAVE.owned = SAVE.owned || {}; if (SAVE.outfit.halo) SAVE.owned.halo = true;
SAVE.char = SAVE.char === 'bali' ? 'bali' : 'kai'; SAVE.outfit.char = SAVE.char;
// switch between Kai and Bali: the clothes of the one who leaves are kept, the other one's clothes come back
function setCharacter(c) {
  if (c !== 'kai' && c !== 'bali') return;
  if (SAVE.char === c) return;
  if (SAVE.char === 'bali') SAVE.outfitBali = SAVE.outfit; else SAVE.outfitKai = SAVE.outfit;
  SAVE.char = c;
  SAVE.outfit = c === 'bali' ? Object.assign({}, SAVE_DEFAULT.outfitBali, SAVE.outfitBali) : Object.assign({}, SAVE_DEFAULT.outfit, SAVE.outfitKai || {});
  SAVE.outfit.char = c;
  writeSave();
}
const forChar = it => !it.who || it.who === SAVE.char;   // items only one of the two can wear
function writeSave() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch (e) {} }
function resetSave(keepLang = true) { const lang = SAVE.lang; Object.assign(SAVE, JSON.parse(JSON.stringify(SAVE_DEFAULT))); if (keepLang) SAVE.lang = lang; writeSave(); }
// remember the state at the start of a world, so a game over only restarts that world
function setCheckpoint(world) {
  SAVE.checkpoint = { world, hearts: SAVE.hearts, coins: SAVE.coins, score: SAVE.score || 0, pearls: SAVE.pearls, starfish: SAVE.starfish, fruits: SAVE.fruits || 0, items: Object.assign({}, SAVE.items) };
  SAVE.cps = Object.assign({}, SAVE.cps, { [world]: SAVE.checkpoint }); writeSave();
}
// back in a world that was already started (e.g. the city after the sky): use that world's own checkpoint again
function useCheckpoint(world) { if (SAVE.cps && SAVE.cps[world]) { SAVE.checkpoint = SAVE.cps[world]; writeSave(); } else setCheckpoint(world); }
// world restart (all lives lost): hearts, coins, pearls and starfish go back to the world start –
// but bought things STAY, and coins spent on them stay spent (see spendCoins)
function restoreCheckpoint() { const c = SAVE.checkpoint; if (!c) return; Object.assign(SAVE, { hearts: c.hearts, coins: Math.max(0, c.coins), score: c.score ?? SAVE.score, pearls: c.pearls, starfish: c.starfish, fruits: c.fruits ?? SAVE.fruits }); writeSave(); }
// a purchase also lowers the coins the checkpoint would give back
function spendCoins(n) { for (const c of new Set([SAVE.checkpoint, ...Object.values(SAVE.cps || {})])) if (c) c.coins = Math.max(0, c.coins - n); writeSave(); }
// ---------------- points ----------------
// Points are for comparing (coins are money for the OXXO). Defeated dinos stay gone, mini games and bosses
// give their big points only once per game – so nobody can farm millions. A boss can be fought again and again.
const PTS = { coin: 10, walker: 100, flyer: 150, roller: 100, baby: 50, mini: 1000, miniboss: 2000, boss: 5000 };
// time bonus: starts at 10'000 and shrinks by 25 per second played in that world – never below 0 (no countdown!)
const TIME_BONUS_MAX = 10000, TIME_BONUS_PER_S = 25;
const timeBonus = sec => Math.max(0, Math.round((TIME_BONUS_MAX - sec * TIME_BONUS_PER_S) / 10) * 10);
const fmtNum = n => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, "'");
const fmtTime = sec => Math.floor(sec / 60) + ':' + String(Math.floor(sec % 60)).padStart(2, '0');
function bumpBest() { if ((SAVE.score || 0) > (SAVE.best || 0)) { SAVE.best = SAVE.score; return true; } return false; }
// the score box in the HUD (below the coins)
function drawScoreBox(score) {
  ctx.save(); ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(20,30,50,0.6)'; ctx.beginPath(); ctx.roundRect(W - 168, 46, 156, 26, 10); ctx.fill();
  ctx.fillStyle = '#ffd23a'; ctx.font = 'bold 11px Arial'; ctx.textAlign = 'left'; ctx.fillText(tx('PUNKTE'), W - 158, 59);
  ctx.fillStyle = '#ffffff'; ctx.font = 'bold 15px Arial'; ctx.textAlign = 'right'; ctx.fillText(fmtNum(score), W - 20, 60);
  ctx.restore();
}
// "+100" floating up where it happened (world coordinates)
function drawPops(pops) {
  ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  for (const p of pops) {
    const u = p.t / 60; ctx.globalAlpha = Math.max(0, 1 - u * u);
    ctx.font = `bold ${p.big ? 22 : 16}px Arial`; ctx.strokeStyle = OUT; ctx.lineWidth = 4; ctx.fillStyle = p.col || '#ffe14d';
    ctx.strokeText(p.text, p.x, p.y - u * 40); ctx.fillText(p.text, p.x, p.y - u * 40);
  }
  ctx.restore();
}
// the boss energy bar: green → yellow → red
function drawBossBar(name, frac) {
  const bw = 300, bx = W / 2 - bw / 2 + 40, f = clamp(frac, 0, 1);
  ctx.save(); ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(30,20,30,0.78)'; ctx.beginPath(); ctx.roundRect(W / 2 - 230, 6, 460, 32, 12); ctx.fill();
  ctx.fillStyle = '#ffe0f0'; ctx.font = 'bold 13px Arial'; ctx.textAlign = 'right'; ctx.fillText(name, bx - 10, 23);
  ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.beginPath(); ctx.roundRect(bx, 14, bw, 16, 8); ctx.fill();
  const col = f > 0.6 ? '#34c759' : f > 0.3 ? '#ffcc2e' : '#ff3b30';
  if (f > 0) { ctx.fillStyle = col; ctx.beginPath(); ctx.roundRect(bx, 14, Math.max(8, bw * f), 16, 8); ctx.fill(); }
  ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.roundRect(bx, 14, bw, 16, 8); ctx.stroke();
  ctx.restore();
}
// little symbols in the way bar at the top: where the lianas, pipes, mini games, shop and middle boss are
function drawBarIcon(type, x, y) {
  ctx.save(); ctx.translate(x, y); ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  const col = { liana: '#4caf50', pipe: '#ff7a2a', rodeo: '#ffb02e', fossil: '#e3c88f', oxxo: '#d8231f', ride: '#ff9ad0', lore: '#9aa0a8', anky: '#e2541c', arcade: '#7a5cff', rocket: '#e8463c', elefant: '#9fb6d6', foto: '#ffb02e', wurm: '#c9a66b', flip: '#36c6f4' }[type] || '#fff';
  ctx.fillStyle = col; ctx.strokeStyle = OUT; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = OUT; ctx.fillStyle = OUT; ctx.lineWidth = 1.8;
  if (type === 'liana') { ctx.beginPath(); ctx.moveTo(0, 5); ctx.lineTo(0, -5); ctx.moveTo(-4, -1); ctx.lineTo(0, -5); ctx.lineTo(4, -1); ctx.stroke(); }
  else if (type === 'pipe') { ctx.beginPath(); ctx.moveTo(0, -5); ctx.lineTo(0, 5); ctx.moveTo(-4, 1); ctx.lineTo(0, 5); ctx.lineTo(4, 1); ctx.stroke(); }
  else if (type === 'rodeo') { ctx.beginPath(); ctx.arc(0, 0, 4.5, Math.PI * 0.15, Math.PI * 0.85, true); ctx.stroke(); }
  else if (type === 'fossil') { ctx.beginPath(); ctx.moveTo(-4, 3); ctx.lineTo(4, -3); ctx.stroke(); for (const [bx, by] of [[-4, 3], [4, -3]]) { ctx.beginPath(); ctx.arc(bx, by, 1.8, 0, Math.PI * 2); ctx.fill(); } }
  else if (type === 'oxxo') { ctx.fillStyle = '#ffd23a'; ctx.fillRect(-6, -2, 12, 4); }
  else if (type === 'ride') { ctx.beginPath(); ctx.moveTo(-6, -2); ctx.quadraticCurveTo(-3, 2, 0, -1); ctx.quadraticCurveTo(3, 2, 6, -2); ctx.stroke(); }
  else if (type === 'lore') { ctx.fillRect(-5, -4, 10, 5); ctx.beginPath(); ctx.arc(-3, 3, 1.8, 0, Math.PI * 2); ctx.arc(3, 3, 1.8, 0, Math.PI * 2); ctx.fill(); }
  else if (type === 'arcade') { ctx.fillRect(-4, -5, 8, 6); ctx.fillRect(-1, 2, 2, 3); }
  else if (type === 'rocket') { ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(3, 2); ctx.lineTo(-3, 2); ctx.closePath(); ctx.fill(); ctx.fillRect(-1, 2, 2, 3); }
  else if (type === 'elefant') { ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.fill(); ctx.fillRect(3, 0, 2, 5); }
  else if (type === 'foto') { ctx.fillRect(-5, -3, 10, 7); ctx.fillStyle = '#ffb02e'; ctx.beginPath(); ctx.arc(0, 0.5, 2, 0, Math.PI * 2); ctx.fill(); }
  else if (type === 'wurm') { ctx.beginPath(); ctx.moveTo(-6, 3); ctx.quadraticCurveTo(-3, -5, 0, 2); ctx.quadraticCurveTo(3, 7, 6, -2); ctx.stroke(); }
  else if (type === 'flip') { ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(0, 6); ctx.moveTo(-3, -3); ctx.lineTo(0, -6); ctx.lineTo(3, -3); ctx.moveTo(-3, 3); ctx.lineTo(0, 6); ctx.lineTo(3, 3); ctx.stroke(); }
  else if (type === 'anky') { ctx.font = 'bold 12px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('!', 0, 1); }
  ctx.restore();
}
// the way bar (top middle): progress to the boss, checkpoints, and the symbols of the places on the way
function drawWayBar(kx, bossX, cps, cpX, icons, label, labelCol) {
  ctx.save(); ctx.textBaseline = 'middle';
  const bx = W / 2 - 170, bw = 340, u = clamp(kx / bossX, 0, 1);
  ctx.fillStyle = 'rgba(20,30,50,0.55)'; ctx.beginPath(); ctx.roundRect(bx - 14, 4, bw + 90, 34, 12); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.beginPath(); ctx.roundRect(bx, 17, bw, 8, 4); ctx.fill();
  ctx.fillStyle = '#7dd35a'; ctx.beginPath(); ctx.roundRect(bx, 17, bw * u, 8, 4); ctx.fill();
  for (const c of cps) { ctx.fillStyle = cpX >= c ? '#34c759' : '#d8352c'; ctx.fillRect(bx + bw * c / bossX - 1, 13, 3, 16); }
  for (const [type, x] of icons) drawBarIcon(type, bx + bw * clamp(x / bossX, 0, 1), 21);
  ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(bx + bw * u, 21, 5, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = OUT; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.font = 'bold 12px Arial'; ctx.fillStyle = labelCol; ctx.textAlign = 'left'; ctx.fillText(label, bx + bw + 10, 21);
  ctx.restore();
}
// the end-of-world summary lines (boss beaten)
function summaryLines(sm) {
  if (!sm) return [];
  if (sm.repeat) return [tx('Schon einmal besiegt – diesmal gibt es keine Punkte, nur den Spaß.'), tx('Punkte: {p}   ·   Rekord: {r}', { p: fmtNum(SAVE.score), r: fmtNum(SAVE.best || 0) })];
  return [tx('Boss besiegt: +{b}   ·   Zeitbonus ({t}): +{z}', { b: fmtNum(sm.boss), t: fmtTime(sm.sec), z: fmtNum(sm.time) }),
    (sm.record ? tx('NEUER REKORD!') + '  ' : '') + tx('Punkte: {p}   ·   Rekord: {r}', { p: fmtNum(SAVE.score), r: fmtNum(SAVE.best || 0) })];
}
// ---------------- lives ----------------
// 3 lives: when all hearts are gone one life is lost and Kai simply carries on right there with full hearts.
// Only when all 3 lives are gone the current world starts again (from its checkpoint).
const LIVES_MAX = 3, LIFE_HEARTS = 5;
// Level 4 is done when all three end bosses are beaten: Sternenfresser (moon), Grisella (Aurora 61), Grummel (underworld)
const allBossesDone = () => !!(SAVE.done.mond && SAVE.done.aurora && SAVE.done.unter);
function openBosses() {
  const l = [];
  if (!SAVE.done.mond) l.push(tx('Sternenfresser auf dem Mond besiegen'));
  if (!SAVE.done.aurora) l.push(tx('Farbhexe Grisella auf Aurora 61 besiegen'));
  if (!SAVE.done.unter) l.push(tx('Grummel in der Unterwelt besiegen'));
  return l;
}
function loseLife() { SAVE.lives = Math.max(0, (SAVE.lives ?? LIVES_MAX) - 1); writeSave(); return SAVE.lives > 0; }
function restartWorldSave() { restoreCheckpoint(); SAVE.lives = LIVES_MAX; writeSave(); }
// ======================================================================
// INVENTORY (top left): weapons + outfit Kai owns, opened as a drop-down. The game pauses while it is open.
// ======================================================================
const INV = { open: false, btn: null, panel: null, chips: [] };
// Level 4 weapons: a laser on the moon, paint balls on Aurora 61, sun balls in the underworld
const INV_WEAPONS = [
  { id: 'laser', name: 'Laser-Blaster', where: 'Mondbasis', only: 'nur auf dem Mond', world: 'mond', owned: () => !!SAVE.items.laser, worn: () => true, pick: () => {} },
  { id: 'paint', name: 'Farbkugeln', where: 'Aurora 61', only: 'nur auf Aurora 61', world: 'aurora', owned: () => !!SAVE.items.paint, worn: () => !(SAVE.items.paint2 && SAVE.weapon.aurora !== 'paint'), pick: () => { SAVE.weapon.aurora = 'paint'; } },
  { id: 'paint2', name: 'Super-Farbkugeln', where: 'Aurora 61', only: 'nur auf Aurora 61', world: 'aurora', owned: () => !!SAVE.items.paint2, worn: () => !!SAVE.items.paint2 && SAVE.weapon.aurora !== 'paint', pick: () => { SAVE.weapon.aurora = 'paint2'; } },
  { id: 'sun', name: 'Sonnenkugeln', where: 'Unterwelt', only: 'nur in der Unterwelt', world: 'unter', owned: () => !!SAVE.items.sun, worn: () => true, pick: () => {} },
  { id: 'cake', name: 'Mega-Mango-Kuchen', where: 'Aurora 61', only: 'nur auf Aurora 61', world: 'aurora', owned: () => !!SAVE.items.cake && !SAVE.items.fedBig, worn: () => true, pick: () => {} },
];
const OUTFIT_GROUPS = [
  { label: 'Kopf', opts: [
    { id: 'capBlue', who: 'kai', name: 'Blaue Kappe', sw: '#1e4fa3', owned: () => true, worn: o => !o.beanie && (o.cap || '#1e4fa3') === '#1e4fa3', apply: o => { o.cap = '#1e4fa3'; o.beanie = false; } },
    { id: 'capRed', who: 'kai', name: 'Rote Kappe', sw: '#d8352c', worn: o => !o.beanie && o.cap === '#d8352c', apply: o => { o.cap = '#d8352c'; o.beanie = false; } },
    { id: 'capGreen', who: 'kai', name: 'Grüne Kappe', sw: '#2f8a5f', worn: o => !o.beanie && o.cap === '#2f8a5f', apply: o => { o.cap = '#2f8a5f'; o.beanie = false; } },
    { id: 'hairFree', who: 'bali', name: 'Ohne Mütze', sw: '#e8cd8e', owned: () => true, worn: o => !o.beanie && !o.cap, apply: o => { o.cap = null; o.beanie = false; } },
    { id: 'capBali', who: 'bali', name: 'Schildkappe', sw: '#f48fb8', worn: o => !o.beanie && o.cap === '#f48fb8', apply: o => { o.cap = '#f48fb8'; o.beanie = false; } },
    { id: 'capGold', name: 'Goldene Kappe', sw: '#e8b923', worn: o => !o.beanie && o.cap === '#e8b923', apply: o => { o.cap = '#e8b923'; o.beanie = false; } },
    { id: 'beanie', name: 'Beanie', sw: '#7a3fb8', worn: o => !!o.beanie, apply: o => { o.beanie = true; } },
  ] },
  { label: 'T-Shirt', opts: [
    { id: 'teeBlue', who: 'kai', name: 'Blaues T-Shirt', sw: '#1f3c6e', owned: () => true, worn: o => (o.tee || '#1f3c6e') === '#1f3c6e', apply: o => { o.tee = '#1f3c6e'; } },
    { id: 'teePink', who: 'bali', name: 'Rosa T-Shirt', sw: '#f6a3c4', owned: () => true, worn: o => (o.tee || '#f6a3c4') === '#f6a3c4', apply: o => { o.tee = '#f6a3c4'; } },
    { id: 'teeRed', name: 'Rotes T-Shirt', sw: '#c8352c', worn: o => o.tee === '#c8352c', apply: o => { o.tee = '#c8352c'; } },
    { id: 'teeYellow', name: 'Gelbes T-Shirt', sw: '#e0a81e', worn: o => o.tee === '#e0a81e', apply: o => { o.tee = '#e0a81e'; } },
  ] },
  { label: 'Hose', opts: [
    { id: 'jeans', who: 'bali', name: 'Jeans', sw: '#4a78b8', owned: () => true, worn: o => (o.bottom || 'jeans') === 'jeans', apply: o => { o.bottom = 'jeans'; } },
    { id: 'shorts', who: 'bali', name: 'Kurze Hose', sw: '#4a78b8', worn: o => o.bottom === 'shorts', apply: o => { o.bottom = 'shorts'; } },
    { id: 'skirt', who: 'bali', name: 'Rock', sw: '#d94f7c', worn: o => o.bottom === 'skirt', apply: o => { o.bottom = 'skirt'; } },
  ] },
  { label: 'Schuhe', opts: [
    { id: 'shoesDark', who: 'kai', name: 'Schwarze Schuhe', sw: '#1b1b22', owned: () => true, worn: o => (o.shoes || '#1b1b22') === '#1b1b22', apply: o => { o.shoes = '#1b1b22'; } },
    { id: 'shoesWhite', who: 'bali', name: 'Weisse Schuhe', sw: '#ffffff', owned: () => true, worn: o => (o.shoes || '#ffffff') === '#ffffff', apply: o => { o.shoes = '#ffffff'; } },
    { id: 'shoesRed', name: 'Rote Schuhe', sw: '#d8352c', worn: o => o.shoes === '#d8352c', apply: o => { o.shoes = '#d8352c'; } },
  ] },
  { label: 'Extras', toggle: true, opts: [
    { id: 'backpack', name: 'Rucksack', sw: '#e0702b', worn: o => !!o.backpack, apply: o => { o.backpack = !o.backpack; } },
    { id: 'halo', name: 'Heiligenschein', sw: '#ffd23a', worn: o => !!o.halo, apply: o => { o.halo = !o.halo; } },
  ] },
];
// the two characters (first row in ITEMS)
const INV_CHARS = [
  { id: 'kai', name: 'Kai', worn: () => SAVE.char === 'kai' },
  { id: 'bali', name: 'Bali', worn: () => SAVE.char === 'bali' },
];
const optOwned = it => it.owned ? it.owned() : !!SAVE.owned[it.id];
function invCount() { return INV_WEAPONS.filter(w => w.owned() && w.id !== 'laser' && w.id !== 'paint' && w.id !== 'sun').length + OUTFIT_GROUPS.reduce((n, g) => n + g.opts.filter(o => forChar(o) && !o.owned && optOwned(o)).length, 0); }
function drawInvButton(x, y) {
  const b = { x, y, w: 92, h: 26 }; INV.btn = b;
  ctx.save(); ctx.fillStyle = INV.open ? 'rgba(255,210,58,0.95)' : 'rgba(10,20,40,0.6)'; ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 10); ctx.fill();
  // little backpack icon

function tx(key, params) {
  let s = key;
  const i = LANGS.indexOf(SAVE.lang);
  if (i > 0 && TR[key]) s = TR[key][i - 1];
  if (params) for (const k in params) s = s.split('{' + k + '}').join(params[k]);
  // whoever is riding is greeted by name: "Hallo Bali!", "Ahoi, Kapitän Bali!" …
  if (SAVE.char === 'bali') s = s.replace(/\bKai\b/g, 'Bali');
  // the name typed in the game menu ("Choose your own name") replaces the rider's name: "Ahoi, Kapitän Max!"
  let myName = ''; try { myName = (localStorage.getItem('invert-skate-username') || '').trim(); } catch (e) {}
  if (myName) s = s.replace(SAVE.char === 'bali' ? /\bBali\b/g : /\bKai\b/g, myName);
  return s;
}

const LANG_BTNS = LANGS.map((l, i) => ({ l, x: W - 150 + i * 46, y: H - 40, w: 40, h: 28 }));
function drawLangPicker() {
  ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.font = 'bold 11px Arial'; ctx.fillText(tx('Sprache'), W - 82, H - 50);
  for (const b of LANG_BTNS) {
    const on = SAVE.lang === b.l;
    ctx.fillStyle = on ? '#ffd23a' : 'rgba(255,255,255,0.15)'; ctx.strokeStyle = on ? '#ffffff' : 'rgba(255,255,255,0.4)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 8); ctx.fill(); ctx.stroke();
    ctx.fillStyle = on ? OUT : '#ffffff'; ctx.font = 'bold 13px Arial'; ctx.fillText(b.l.toUpperCase(), b.x + b.w / 2, b.y + b.h / 2 + 1);

}
function langPickerClick(p) {
  for (const b of LANG_BTNS) if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) { SAVE.lang = b.l; writeSave(); return true; }
  return false;
}

  if (type === 'harpoon') { ctx.strokeStyle = '#a0703a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-6, 6); ctx.lineTo(4, -4); ctx.stroke(); ctx.fillStyle = '#d8dee6'; ctx.strokeStyle = OUT; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(7, -7); ctx.lineTo(1, -5); ctx.lineTo(5, -1); ctx.closePath(); ctx.fill(); ctx.stroke(); }
  if (type === 'tal') { ctx.fillStyle = '#6fbf4a'; ctx.beginPath(); ctx.ellipse(0, 2, 6, 4, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.moveTo(4, 0); ctx.quadraticCurveTo(7, -7, 3, -7); ctx.stroke(); ctx.fillStyle = '#6fbf4a'; ctx.beginPath(); ctx.arc(3, -7, 2.2, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); }

  if (type === 'aurora') { ctx.fillStyle = '#4fd1a5'; ctx.beginPath(); ctx.arc(0, 0, 6.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#2f8a5f'; ctx.beginPath(); ctx.ellipse(-2, 1, 3, 2, 0.4, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1; ctx.beginPath(); ctx.ellipse(0, 0, 9, 2.5, -0.3, 0, Math.PI * 2); ctx.stroke(); }

function drawLifeIcon(cx, cy, on) {
  ctx.save(); ctx.translate(cx, cy); ctx.globalAlpha = on ? 1 : 0.3; ctx.strokeStyle = OUT; ctx.lineWidth = 1.2;

  ctx.restore();
}
function drawProgressBox(x, y) {
  ctx.save();
  // lives (3 little Kai heads) – box to the right of the world icons

  ctx.fillStyle = 'rgba(10,20,40,0.6)'; ctx.beginPath(); ctx.roundRect(x + w0 + 6, y, lw, 26, 10); ctx.fill();

  ctx.fillStyle = 'rgba(10,20,40,0.6)'; ctx.beginPath(); ctx.roundRect(x, y, w, 26, 10); ctx.fill();
  drawWorldIcon('mond', x + 15, y + 13, SAVE.done.mond);

}

    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * 2.6, t + 0.09);

    o.connect(g); g.connect(sfxGain); o.start(t); o.stop(t + 0.13);
  }

  // ---- skateboard grind: metal trucks scraping a rail ----
  // 1) lock-in "clank" (inharmonic metal partials)  2) gritty scrape: crackly noise through
  // ringing metal resonances + a lower body  3) short release when Kai leaves the rail
  let grindSrc = null, grindGain = null, gritBuf = null;
  function makeGritBuffer() {
    const len = ac.sampleRate * 2, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    let env = 0, next = 0, lp = 0;
    for (let i = 0; i < len; i++) {
      if (i >= next) { env = 0.45 + Math.random() * 0.55; next = i + Math.floor(ac.sampleRate * (0.004 + Math.random() * 0.02)); }
      env *= 0.9965;                                   // each grain of grit decays quickly
      const n = Math.random() * 2 - 1;
      lp += (n - lp) * 0.35;                           // slightly darker noise
      d[i] = (n * 0.55 + lp * 0.45) * (0.18 + env);
    }
    return buf;
  }
  function clank() {
    const t = ac.currentTime;

    if (!window.speechSynthesis || !text) return;
    // symbols are not read: arrows, dots, = …
    const clean = text.replace(/[◀▶←→↑↓▲▼·=•|]/g, ', ').replace(/[^\p{L}\p{N}\s.,!?¡¿:;'’"„“()%+–-]/gu, ' ').replace(/\s*,\s*(,\s*)+/g, ', ').replace(/([.!?])\s*\./g, '$1').replace(/\s+/g, ' ').trim();
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(clean); u.lang = { de: 'de-DE', en: 'en-US', es: 'es-ES' }[SAVE.lang] || 'de-DE'; u.rate = 0.92;
    speechSynthesis.speak(u);
  } catch (e) {}
}
// a tap in screen coordinates (from the controller): a 🔊 button hit?
function sayClick(hp) {
  if (!canSpeak()) return false;
  const p = { x: hp.x, y: hp.y - DY };
  for (let i = SAY.list.length - 1; i >= 0; i--) { const b = SAY.list[i]; if (p.x >= b.x - 6 && p.x <= b.x + b.w + 6 && p.y >= b.y - 6 && p.y <= b.y + b.h + 6) { Audio.play('tink'); speak(b.text); return true; } }

}

// ---------------- map helpers ----------------
const groundAt = x => GROUND.some(([a, b]) => x > a + 4 && x < b - 4);
const flipZoneAt = x => FLIP_ZONES.find(([a, b]) => x >= a && x <= b);

const ceilAt = x => { const z = flipZoneAt(x); return !!z && !CEIL_GAPS.some(([a, b]) => x > a + 4 && x < b - 4); };
const inHaz = x => HAZ.some(([a, b]) => x > a + 10 && x < b - 10);
function burst(x, y, color, n, speed = 4) { for (let i = 0; i < n; i++) { const a = rand(0, Math.PI * 2), v = rand(1, speed); S.particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1, r: rand(2, 4.5), color, life: 1, g: 0.18 }); } }
function flash(text, f = 80, params) { S.msg = tx(text, params); S.msgTimer = f; }
const kaiBox = () => { const k = S.kai; return k.flip ? { x1: k.x - 26, x2: k.x + 26, y1: k.y + 4, y2: k.y + 108 } : { x1: k.x - 26, x2: k.x + 26, y1: k.y - 108, y2: k.y - 4 }; };
const overlap = (a, b) => a.x1 < b.x2 && a.x2 > b.x1 && a.y1 < b.y2 && a.y2 > b.y1;
const playing = () => S.phase === 'play' || S.phase === 'boss';
const isTouchDev = () => CTRL.touch;
const arenaX = () => S.mid && S.mid.state !== 'gone' ? MID.x : S.boss ? BOSS_X : null;

function buildWorld() {
  S.plats = PLATS.map(p => Object.assign({ x0: p.x, y0: p.y, ph: 0, state: 'idle', st: 0, vy: 0, dx: 0, dy: 0 }, p));
  S.walkers = WALKERS.map(([a, b], i) => ({ x: (a + b) / 2, x1: a, x2: b, dir: i % 2 ? 1 : -1, t: rand(0, 100), dead: false, deadT: 0, kind: i % 3 }));
  S.flyers = FLYERS.map(([a, b, y], i) => ({ x: (a + b) / 2, x1: a, x2: b, hy: y, y, dir: i % 2 ? 1 : -1, t: rand(0, 200), state: 'fly', st: 0, dead: false, deadT: 0, vy: 0, cool: rand(60, 160) }));
  const o = [];
  const coin = (x, y) => o.push({ type: 'coin', x, y, r: 11, p: rand(0, 6) });
  const arc = (x, y, n, gap = 34, lift = 30) => { for (let i = 0; i < n; i++) coin(x + i * gap, y - Math.sin(i / Math.max(1, n - 1) * Math.PI) * lift); };
  for (const [a, b] of GROUND) for (let x = a + 140; x < Math.min(b, BOSS_X) - 160; x += 560) if (!inHaz(x) && !inHaz(x + 140) && !flipZoneAt(x) && !flipZoneAt(x + 140)) arc(x, FLOOR - 40, 5);
  for (let i = 0; i < GROUND.length - 1; i++) { const a = GROUND[i][1], b = GROUND[i + 1][0]; if (b - a < 420 && !flipZoneAt((a + b) / 2)) arc(a - 20, FLOOR - 120 * JUMP_LIFT, 6, (b - a + 40) / 5, 50 * JUMP_LIFT); }
  for (const p of PLATS) if (p.kind === 'rock') arc(p.x + 20, p.y - 34, Math.max(3, Math.floor(p.w / 45)), 38, 0);

  for (const [a, b] of FLIP_ZONES) for (let x = a + 120; x < b - 100; x += 46) if (ceilAt(x - 20) && ceilAt(x + 20)) o.push({ type: 'coin', x, y: CEIL + 40, r: 11, p: rand(0, 6) });
  for (const [x, y] of HEARTS) o.push({ type: 'heart', x, y, r: 14, p: 0 });
  S.objects = o;
  hook('worldInit');
}

// ---------------- control (called by the controller) ----------------
function steerDir(d) {
  if (S.phase === 'game') { hook('gameDir', d); return; }
  const k = S.kai; if (!playing() || S.fly) return;
  k.dir = d;
  if (k.hurtT <= 0 && Math.sign(k.vx) === -d) k.vx = 0;      // turn at once, no sliding
  if (d !== k.face) { k.face = d; Audio.play('flip'); }
}
function steerStop() { if (S.phase === 'game') { hook('gameDir', 0); return; } const k = S.kai; if (!playing()) return; k.dir = 0; }
function steerJump(down) {
  if (S.phase === 'game') { if (down) hook('gameShoot'); return; }
  const k = S.kai;
  if (!playing()) return;
  if (S.fly) { S.fly.up = down; return; }
  if (down) {
    k.jumpHeld = true;
    if (k.ground || k.coyote > 0) { k.vy = k.flip ? -JUMP_V : JUMP_V; k.ground = false; k.platform = null; k.coyote = 0; Audio.play('jump'); }
  } else {
    k.jumpHeld = false;
    if (!k.flip && k.vy < JUMP_CUT) k.vy = JUMP_CUT;
    if (k.flip && k.vy > -JUMP_CUT) k.vy = -JUMP_CUT;
  }
}
const superShot = () => !!(WEAPON.super && SAVE.items[WEAPON.super] && SAVE.weapon[WKEY] !== WEAPON.item);
function shoot() {
  if (S.phase === 'game') { hook('gameShoot'); return; }
  const k = S.kai;
  if (!playing() || !SAVE.items[WEAPON.item] || S.reload > 0) return;
  S.reload = superShot() ? WEAPON.reload2 : WEAPON.reload; k.shootT = 14;
  const x = k.x + k.face * 30, y = k.flip ? k.y + 50 : (S.fly ? k.y - 62 : k.y - 50), vx = k.face * WEAPON.speed + k.vx * 0.5;
  const col = WEAPON.colors[(S.shotN = (S.shotN || 0) + 1) % WEAPON.colors.length];
  S.shots.push({ x, y, vx, vy: WEAPON.vy * (k.flip ? -1 : 1), life: 90, col, g: WEAPON.grav * (k.flip ? -1 : 1) });
  if (superShot()) S.shots.push({ x, y: y + (k.flip ? 8 : -8), vx: vx * 0.95, vy: (WEAPON.vy - 2.6) * (k.flip ? -1 : 1), life: 90, col: WEAPON.colors[(S.shotN + 1) % WEAPON.colors.length], g: WEAPON.grav * (k.flip ? -1 : 1) });
  Audio.play(WEAPON.sound);
}
const CTL = {
  steer: true,
  active: () => playing() || (S.phase === 'game' && !!S.game && !!S.game.steer && !S.game.result),
  showJump: () => (playing() && !(S.boss && S.boss.noJump)) || (S.phase === 'game' && !!S.game && !!S.game.steer && !S.game.result),
  canShoot: () => (playing() && !!SAVE.items[WEAPON.item]) || (S.phase === 'game' && !!S.game && !!S.game.steer && !S.game.result), shoot, auto: true,
  get icon() { return S.phase === 'game' ? 'laser' : WEAPON.icon; },

// keyboard: ← → ride (through the controller), Space / ↑ jump, X shoot
window.addEventListener('keydown', e => {
  if (CUR !== ME || TRANS || PAUSE.on || INV.open || MENU.open) return;
  if (S.phase === 'start' && (e.code === 'Space' || e.code === 'Enter')) { beginWorld(); return; }
  if (hook('worldKey', e)) return;
  if (S.phase === 'shop') { if (e.code === 'Escape' || e.code === 'Enter') leaveShop(); return; }
  if (S.phase === 'game') { if (e.code === 'Space' || e.code === 'KeyX' || e.code === 'ArrowUp') { e.preventDefault(); hook('gameShoot'); } return; }
  if (!playing()) return;
  if (e.code === 'KeyX') { shoot(); return; }
  if (e.repeat) return;
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); steerJump(true); }
});
window.addEventListener('keyup', e => {
  if (CUR !== ME) return;
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') steerJump(false);
});

// ---------------- start / checkpoints ----------------
function beginWorld() {

  S.phase = 'play'; S.noHud = false; SAVE.started = true; SAVE['seen_' + WKEY] = true;
  S.hearts = SAVE.hearts || LIFE_HEARTS; S.coins = SAVE.coins || 0; S.score = SAVE.score || 0; S.fruits = SAVE.fruits || 0;
  const k = S.kai, arrive = ARRIVE[QUERY.get('from')];
  if (arrive != null && !S.begun) k.x = arrive; else k.x = cont ? SAVE['cp_' + WKEY] : START_X;
  k.flip = !!flipZoneAt(k.x); k.flipAnim = k.flip ? 1 : 0;
  k.y = k.flip ? CEIL : FLOOR; k.vy = 0; k.vx = 0; k.dir = 0; k.face = 1; k.ground = true; k.platform = null; k.safeX = k.x;
  S.cpX = Math.max(START_X, k.x); S.cam = clamp(k.x - W * 0.32, 0, BOSS_X); S.begun = true;
  if (arrive != null || !(SAVE.cps && SAVE.cps[WKEY])) setCheckpoint(WKEY); else useCheckpoint(WKEY);

}
function saveProgress() { SAVE.hearts = S.hearts; SAVE.coins = S.coins; SAVE.score = S.score; SAVE.fruits = S.fruits; SAVE.wtime[WKEY] = S.wtime; bumpBest(); writeSave(); }
function addScore(n, x, y, big) { S.score += n; if (x != null) S.pops.push({ x, y, text: '+' + fmtNum(n), t: 0, big }); }
function comboScore(base, x, y) { S.combo++; const m = Math.min(8, 2 ** (S.combo - 1)); addScore(base * m, x, y, m > 1); if (m > 1) S.pops.push({ x, y: y - 24, text: '×' + m, t: 0, col: '#ff9ad0' }); }
function bossSummary(id) {

  SAVE.pts['boss_' + id] = true;
  const sec = S.wtime / 60, tb = timeBonus(sec);

}

// ---------------- getting hurt ----------------
function loseHeart() {

    if (loseLife()) { S.hearts = LIFE_HEARTS; flash('Ein Leben weniger! Weiter geht\'s.', 120); Audio.play('warn'); }
    else { S.hearts = 0; S.phase = 'gameover'; S.game = null; S.fly = null; Audio.play('gameover'); Audio.setBoss(false); saveProgress(); return false; }
  }

}
function hurt(srcX) {

  k.inv = 100; k.hurtT = 24; S.shake = 8;
  k.vy = k.flip ? 6 : -6; k.vx = (k.x < srcX ? -1 : 1) * 5; k.ground = false; k.platform = null;
  Audio.play('crash');

}
function fallOut(text) {

  flash(text || 'Abgestürzt!', 70);
  k.x = k.safeX; k.flip = !!flipZoneAt(k.x); k.flipAnim = k.flip ? 1 : 0; k.y = k.flip ? CEIL : FLOOR;
  k.vy = 0; k.vx = 0; k.dir = 0; k.ground = true; k.platform = null; k.inv = 80;

function resetGame() {
  restartWorldSave();
  S.hearts = SAVE.hearts || LIFE_HEARTS; S.coins = SAVE.coins || 0; S.score = SAVE.score || 0; S.fruits = SAVE.fruits || 0;
  buildWorld(); S.shots = []; S.eshots = []; S.drops = []; S.puddles = []; S.boss = null; S.fly = null; S.game = null; Audio.setBoss(false);
  if (S.mid && S.mid.state !== 'gone') S.mid = null;
  const k = S.kai; k.x = SAVE['cp_' + WKEY] || START_X; k.flip = !!flipZoneAt(k.x); k.flipAnim = k.flip ? 1 : 0; k.y = k.flip ? CEIL : FLOOR;
  k.vx = 0; k.vy = 0; k.dir = 0; k.face = 1; k.inv = 60; k.ground = true; k.platform = null; k.safeX = k.x;

// ---------------- update ----------------
function update(dt) {
  S.t += dt;
  if (S.msgTimer > 0) S.msgTimer -= dt;
  if (S.heartFlash > 0) S.heartFlash -= dt;
  if (S.shopMsgT > 0) S.shopMsgT -= dt;
  if (S.shake > 0) S.shake = Math.max(0, S.shake - 0.5 * dt);
  if (playing()) S.wtime += dt;
  S.saveT = (S.saveT || 0) + dt; if (S.saveT > 120 && playing()) { S.saveT = 0; saveProgress(); }
  for (const p of S.pops) p.t += dt; S.pops = S.pops.filter(p => p.t < 60);
  updateParticles(dt);
  for (const o of S.objects) o.p += 0.05 * dt;
  if (hook('worldPhase', dt)) return;                    // mini games, star quiz, intro …
  if (S.phase === 'shop' || S.phase === 'ask') return;
  if (S.phase === 'leaving') return;
  if (!playing()) { if (S.phase === 'won' && S.boss) S.boss.t += dt; return; }
  if (S.reload > 0) S.reload -= dt;
  updatePlats(dt);
  if (S.fly) hook('updateFly', dt); else updateKai(dt);
  updateWalkers(dt);
  updateFlyers(dt);
  updateDrops(dt);
  updateShots(dt);
  updateEShots(dt);
  updatePuddles(dt);
  updatePickups();
  if (!S.fly) updateSites();
  hook('worldUpdate', dt);
  if (S.mid || (MID && !SAVE.mid[MID.key] && S.kai.x > MID.x + 240 && S.kai.x < MID.x + W)) hook('updateMid', dt);
  if (S.phase === 'boss' || (!S.boss && S.kai.x > BOSS_X + 240)) hook('updateBoss', dt);
  for (const x of CHECKPOINTS) if (S.kai.x > x) reachCheckpoint(x);
  const k = S.kai, ax = arenaX();
  if (ax != null) S.cam += (ax - S.cam) * Math.min(1, 0.08 * dt);
  else {
    const L = W * 0.32, R = W * 0.5, sx = k.x - S.cam;
    let target = S.cam;
    if (sx > R) target = k.x - R; else if (sx < L) target = k.x - L;
    target = clamp(target, 0, BOSS_X);
    if (Math.abs(target - S.cam) > 40) S.cam += (target - S.cam) * Math.min(1, 0.12 * dt);
    else S.cam = target;
  }
}

function updatePlats(dt) {
  for (const p of S.plats) {
    const ox = p.x, oy = p.y;
    if (p.kind === 'move') {
      p.ph += p.sp * dt;
      p.x = p.x0 + (1 - Math.cos(p.ph)) / 2 * p.ax;
      p.y = p.y0 - (1 - Math.cos(p.ph)) / 2 * p.ay;
    } else if (p.kind === 'crumble') {
      if (p.state === 'shake') { p.st += dt; if (p.st > 34) { p.state = 'fall'; p.vy = 1; Audio.play('clank'); burst(p.x + p.w / 2, p.y, PLAT_DUST, 8, 3); } }
      else if (p.state === 'fall') { p.vy += 0.5 * dt; p.y += p.vy * dt; if (p.y > FLOOR + 400) { p.state = 'gone'; p.st = 0; } }
      else if (p.state === 'gone') { p.st += dt; if (p.st > 220 && Math.abs(S.kai.x - (p.x0 + p.w / 2)) > 160) { p.state = 'idle'; p.y = p.y0; p.st = 0; } }
    }
    p.dx = p.x - ox; p.dy = p.y - oy;
  }
}
const platSolid = p => p.state !== 'gone' && p.state !== 'fall';

function updateKai(dt) {
  const k = S.kai, prevY = k.y; k.prevY = prevY;
  if (k.inv > 0) k.inv -= dt;
  if (k.hurtT > 0) k.hurtT -= dt;
  if (k.landT > 0) k.landT -= dt;
  if (k.shootT > 0) k.shootT -= dt;
  k.faceAnim += (k.face - k.faceAnim) * Math.min(1, 0.7 * dt);
  k.flipAnim += ((k.flip ? 1 : 0) - k.flipAnim) * Math.min(1, 0.18 * dt);
  const target = k.dir * SPEED * (S.phase === 'boss' ? 1.05 : 1);
  if (k.hurtT <= 0) {
    if (k.dir === 0) { const s = Math.sign(k.vx); k.vx -= s * Math.min(Math.abs(k.vx), BRAKE * dt); }
    else k.vx += clamp(target - k.vx, -ACC * dt * (k.ground ? 1 : 0.7), ACC * dt * (k.ground ? 1 : 0.7));
  }
  if (k.platform) k.x += k.platform.dx;
  let nx = k.x + k.vx * dt;
  const ax = arenaX(), minX = ax != null ? ax + 40 : 30, maxX = ax != null && S.mid && S.mid.state !== 'gone' ? ax + W - 40 : MAP_END - 40;
  if (nx < minX) { nx = minX; k.vx = 0; } if (nx > maxX) { nx = maxX; k.vx = 0; }
  if (!k.flip && k.y > FLOOR + 6 && groundAt(nx) && !groundAt(k.x)) { nx = k.x; k.vx = 0; }   // inside a gorge: the walls are solid
  k.x = nx;

  // gravity zones: inside one Kai falls UP onto the ceiling, leaving it he falls down again
  const zone = !!flipZoneAt(k.x);
  if (zone !== k.flip) { k.flip = zone; k.ground = false; k.platform = null; k.vy = 0; Audio.play('gravity'); flash(zone ? 'SCHWERKRAFT UMGEDREHT!' : 'Schwerkraft wieder normal', 60); }
  if (k.ground && k.platform) {
    const pl = k.platform;
    if (!platSolid(pl) || k.x < pl.x - 18 || k.x > pl.x + pl.w + 18) { k.ground = false; k.platform = null; k.coyote = 6; }
    else { k.y = pl.y; if (pl.kind === 'crumble' && pl.state === 'idle') { pl.state = 'shake'; pl.st = 0; Audio.play('tink'); } }
  } else if (k.ground) {
    if (k.flip ? !ceilAt(k.x) : !groundAt(k.x)) { k.ground = false; k.coyote = 6; }
  }
  if (!k.ground) {
    if (k.coyote > 0) k.coyote -= dt;
    if (k.flip) {
      // upside down: "falling" means going up
      if (k.vy <= 0) k.jumpHeld = false;
      k.vy -= GRAV * dt * (k.vy > 0 && !k.jumpHeld ? 1.6 : 1); k.vy = Math.max(k.vy, -14); k.y += k.vy * dt;
      if (k.vy < 0 && k.y <= CEIL && prevY >= CEIL - 3 && ceilAt(k.x)) landOn(null, CEIL);
      if (!k.ground && k.y < CEIL - 320) fallOut('Ins All gefallen!');
    } else {
      if (k.vy >= 0) k.jumpHeld = false;
      k.vy += GRAV * dt * (k.vy < 0 && !k.jumpHeld ? 1.6 : 1); k.vy = Math.min(k.vy, 14); k.y += k.vy * dt;
      if (k.vy > 0) {
        for (const pl of S.plats) {
          if (!platSolid(pl) || k.x < pl.x - 14 || k.x > pl.x + pl.w + 14) continue;
          const top = pl.y;
          if (prevY <= top + 3 + Math.max(0, -pl.dy) && k.y >= top) { landOn(pl, top); break; }
        }
        if (!k.ground && k.y >= FLOOR && prevY <= FLOOR + 2 && groundAt(k.x)) landOn(null, FLOOR);
        if (!k.ground && k.y > FLOOR + 260) fallOut(FALL_TEXT);
      }
    }
  }
  if (k.ground && !k.platform) {
    if (k.flip ? ceilAt(k.x - 80) && ceilAt(k.x + 80) : groundAt(k.x - 80) && groundAt(k.x + 80) && !inHaz(k.x - 40) && !inHaz(k.x + 40)) k.safeX = k.x;
  }
  // a hazard pool on the ground (acid / grey puddle): ouch
  if (k.ground && !k.platform && !k.flip && inHaz(k.x)) { if (hurt(k.x + k.face * 40)) flash(HAZ_TEXT, 60); }
}
function landOn(pl, top) {
  const k = S.kai;
  k.y = top; k.vy = 0; k.ground = true; k.platform = pl; k.landT = 8; S.combo = 0;
  Audio.play('land');
}

// ---------------- enemies ----------------
const walkerBox = c => ({ x1: c.x - 26, x2: c.x + 26, y1: FLOOR - 46, y2: FLOOR });
const flyerBox = p => { const s = p.baby ? 0.65 : 1; return { x1: p.x - 34 * s, x2: p.x + 34 * s, y1: p.y - 20 * s, y2: p.y + 20 * s }; };
function stompBounce(top) {
  const k = S.kai;
  k.y = top; k.vy = k.jumpHeld ? JUMP_V * 0.95 : JUMP_V * 0.7; k.ground = false; k.platform = null; k.coyote = 0;
  S.shake = Math.max(S.shake, 3);
}
function updateWalkers(dt) {
  const k = S.kai, kb = kaiBox();
  for (const c of S.walkers) {
    if (c.dead) { c.deadT += dt; continue; }
    if (Math.abs(c.x - k.x) > 1400) continue;
    c.t += dt;
    c.x += c.dir * WALK_SPEED * dt;
    if (c.x < c.x1 || !groundAt(c.x - 30) || inHaz(c.x - 30)) { c.x = Math.max(c.x, c.x1); c.dir = 1; }

function pixelArt(rows, x, y, px, col) {
  for (let r = 0; r < rows.length; r++) for (let c = 0; c < rows[r].length; c++) {
    const ch = rows[r][c]; if (ch === '.') continue;
    ctx.fillStyle = ch === 'W' ? '#ffffff' : ch === 'K' ? '#101018' : col;
    ctx.fillRect(Math.round(x + c * px), Math.round(y + r * px), px, px);

}
// one wave only (Kai: shorter!) – it marches faster from the start, then the mothership comes
const WAVES = [{ rows: 4, cols: 8, step: 11, bomb: 0.012 }];
function startArcade() {
  const k = S.kai; k.vx = 0; k.dir = 0;
  S.game = { id: 'alien', steer: true, t: 0, wave: 0, x: AFX + AFW / 2, dir: 0, shots: [], bombs: [], lives: 3, inv: 0, cool: 0, aliens: [], march: 0, marchN: 0, mdir: 1, frame: 0,
    shields: [], ufo: null, ufoT: 600, mother: null, score: 0, result: null, msg: '', msgT: 0, pause: 90, sparks: [] };
  buildShields(); buildWave(0);
  S.phase = 'game'; Audio.play('blip'); Audio.setBoss(false);
}
function buildWave(i) {
  const g = S.game, w = WAVES[i], gap = 54, small = afBot() - afTop() < 400;
  const rows = small ? 3 : w.rows, rg = small ? 32 : 38;      // a small screen (computer): one row less, so there is room to march down
  g.aliens = [];
  const x0 = AFX + (AFW - (w.cols - 1) * gap - 44) / 2;
  for (let r = 0; r < rows; r++) for (let c = 0; c < w.cols; c++) g.aliens.push({ x: x0 + c * gap, y: afTop() + (small ? 30 : 46) + r * rg, type: r === 0 ? 0 : r < 2 ? 1 : 2, dead: false });
  g.total = g.aliens.length; g.mdir = 1; g.march = 0; g.pause = 90; g.msg = tx('Die Aliens kommen!'); g.msgT = 90;
}
function buildShields() {
  const g = S.game; g.shields = [];
  for (let s = 0; s < 3; s++) {
    const sx = AFX + 90 + s * 200, sy = afBot() - 96;
    for (let r = 0; r < 5; r++) for (let c = 0; c < 9; c++) {
      if (r === 0 && (c === 0 || c === 8)) continue;           // rounded top corners
      if (r >= 3 && c >= 3 && c <= 5) continue;                // the arch underneath
      g.shields.push({ x: sx + c * 8, y: sy + r * 8, hp: 2 });
    }
  }
}
function gameDir(d) { if (S.game) S.game.dir = d; }
function gameShoot() {
  const g = S.game; if (!g || g.result || g.cool > 0 || g.pause > 0) return;
  if (g.shots.length >= 2) return;
  g.shots.push({ x: g.x, y: afBot() - 64 }); g.cool = 14; Audio.play('pew');
}
const aliveAliens = g => g.aliens.filter(a => !a.dead);
function updateArcade(dt) {
  const g = S.game; if (!g) return;
  g.t += dt; if (g.msgT > 0) g.msgT -= dt;
  for (const s of g.sparks) { s.t += dt; s.x += s.vx * dt; s.y += s.vy * dt; } g.sparks = g.sparks.filter(s => s.t < 30);
  if (g.result) return;
  if (g.cool > 0) g.cool -= dt; if (g.inv > 0) g.inv -= dt;
  // Kai on his hoverboard
  g.x = clamp(g.x + g.dir * 6.2 * dt, AFX + 26, AFX + AFW - 26);
  if ((CTRL.shootP.size > 0 || CTRL.right || CTRL.jumpP.size > 0) && !g.result) gameShoot();
  if (g.pause > 0) { g.pause -= dt; return; }
  // Kai's laser shots
  for (const s of g.shots) {
    s.y -= 9.5 * dt;
    for (const a of g.aliens) if (!a.dead && s.x > a.x - 2 && s.x < a.x + 46 && s.y > a.y && s.y < a.y + 32) { a.dead = true; s.y = -9999; arcadeSpark(a.x + 22, a.y + 16, ALIENS[a.type].col); g.score += ALIENS[a.type].pts; Audio.play('invHit'); break; }
    if (s.y < -9000) continue;
    if (hitShield(s.x, s.y)) { s.y = -9999; continue; }
    if (g.ufo && s.x > g.ufo.x && s.x < g.ufo.x + 64 && s.y > g.ufo.y && s.y < g.ufo.y + 24) { arcadeSpark(g.ufo.x + 32, g.ufo.y + 12, '#ff5a4f'); g.ufo = null; s.y = -9999; S.coins += 5; g.score += 150; g.msg = tx('UFO! +5 Münzen'); g.msgT = 80; Audio.play('coin'); Audio.play('invHit'); continue; }
    const m = g.mother;
    if (m && m.hp > 0 && s.x > m.x && s.x < m.x + 168 && s.y > m.y && s.y < m.y + 56) { m.hp--; m.flash = 8; arcadeSpark(s.x, m.y + 50, '#ffd23a'); s.y = -9999; Audio.play('invHit'); if (m.hp <= 0) motherDown(); }
  }
  g.shots = g.shots.filter(s => s.y > afTop());
  if (g.result) return;
  // the march of the aliens: the fewer there are, the faster they go
  const alive = aliveAliens(g);
  if (!g.mother) {
    g.march += dt;
    const w = WAVES[g.wave], every = Math.max(3, w.step * (alive.length / g.total));
    if (g.march >= every && alive.length) {
      g.march = 0; g.frame ^= 1;
      Audio.note([110, 98, 87, 82][g.marchN++ % 4], 0.09, 'square', 0.07);
      const minX = Math.min(...alive.map(a => a.x)), maxX = Math.max(...alive.map(a => a.x + 44));
      if ((g.mdir > 0 && maxX + 10 > AFX + AFW - 6) || (g.mdir < 0 && minX - 10 < AFX + 6)) { g.mdir *= -1; for (const a of alive) a.y += afBot() - afTop() < 400 ? 14 : 28; }
      else for (const a of alive) a.x += 10 * g.mdir;
    }
    // bombs from the lowest alien of a column
    for (const a of alive) {
      if (Math.random() < w.bomb * dt / Math.max(4, alive.length / 3) && !alive.some(b => b !== a && Math.abs(b.x - a.x) < 10 && b.y > a.y)) g.bombs.push({ x: a.x + 22, y: a.y + 32, vy: 2.6 + g.wave * 0.5 });
    }
    // the aliens reached the shields: lost
    if (alive.some(a => a.y + 32 >= afBot() - 100)) { arcadeLose(tx('Die Aliens sind gelandet!')); return; }
    if (!alive.length) {
      S.coins += 5; Audio.play('chime');
      if (g.wave < WAVES.length - 1) { g.wave++; buildWave(g.wave); }
      else { g.mother = { x: AFX + AFW / 2 - 84, y: afTop() + 34, hp: 20, max: 20, t: 0, fire: 90, flash: 0 }; g.pause = 90; g.msg = tx('DAS MUTTERSCHIFF!'); g.msgT = 110; Audio.play('alarm'); }
    }
  } else {
    const m = g.mother; m.t += dt; if (m.flash > 0) m.flash -= dt;
    const weak = 1 - m.hp / m.max;
    m.x = AFX + AFW / 2 - 84 + Math.sin(m.t * (0.014 + weak * 0.012)) * (AFW / 2 - 100);
    m.y = afTop() + 34 + Math.sin(m.t * 0.03) * 10 + weak * 40;
    m.fire -= dt;
    if (m.fire <= 0) {
      m.fire = 70 - weak * 30;
      const n = weak > 0.5 ? 5 : 3;
      for (let i = 0; i < n; i++) g.bombs.push({ x: m.x + 84, y: m.y + 56, vy: 3.2, vx: (i - (n - 1) / 2) * 0.9 });
      Audio.note(330, 0.12, 'sawtooth', 0.06);
    }
  }
  // the bonus UFO
  g.ufoT -= dt;
  if (!g.ufo && g.ufoT <= 0 && !g.mother) { g.ufoT = rand(700, 1000); const left = Math.random() < 0.5; g.ufo = { x: left ? AFX - 64 : AFX + AFW, y: afTop() + 8, vx: left ? 2.4 : -2.4 }; Audio.play('ufo'); }
  if (g.ufo) { g.ufo.x += g.ufo.vx * dt; if (g.ufo.x < AFX - 80 || g.ufo.x > AFX + AFW + 20) g.ufo = null; }
  // bombs
  for (const b of g.bombs) {
    b.y += b.vy * dt; b.x += (b.vx || 0) * dt;
    if (hitShield(b.x, b.y + 8)) { b.y = 9999; continue; }
    if (g.inv <= 0 && Math.abs(b.x - g.x) < 22 && b.y + 10 > afBot() - 58 && b.y < afBot() - 4) {
      b.y = 9999; g.lives--; g.inv = 90; arcadeSpark(g.x, afBot() - 30, '#ff5a4f'); Audio.play('crash'); S.shake = 6;
      if (g.lives <= 0) { arcadeLose(tx('Du wurdest getroffen!')); return; }
    }
  }
  g.bombs = g.bombs.filter(b => b.y < afBot() + 10);
}
function hitShield(x, y) {
  const g = S.game;
  for (const s of g.shields) if (s.hp > 0 && x > s.x - 2 && x < s.x + 10 && y > s.y - 2 && y < s.y + 10) { s.hp--; return true; }
  return false;
}
function arcadeSpark(x, y, col) { const g = S.game; for (let i = 0; i < 10; i++) { const a = rand(0, Math.PI * 2), v = rand(1, 4); g.sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, col }); } }
function motherDown() {
  const g = S.game, m = g.mother;
  for (let i = 0; i < 4; i++) arcadeSpark(m.x + 30 + i * 36, m.y + 28, i % 2 ? '#ffd23a' : '#ff5ad1');
  g.mother = null; g.bombs = [];
  g.result = 'win'; S.coins += 20; SAVE.mini.alien = true;
  g.pts = !SAVE.pts.mini_alien; if (g.pts) { SAVE.pts.mini_alien = true; S.score += PTS.mini; }
  saveProgress(); Audio.play('explosion'); Audio.play('win'); Audio.play('cheer');
}
function arcadeLose(text) { const g = S.game; g.result = 'lose'; g.loseText = text; Audio.play('nomatch'); Audio.play('gameover'); saveProgress(); }
function arcadePointer(p) {
  const g = S.game; if (!g) return;
  if (g.result) {
    if (g.result === 'lose' && inRect(p, GBTN.again)) { startArcade(); return; }
    if (inRect(p, g.result === 'lose' ? GBTN.next2 : GBTN.next)) endArcade();
    return;
  }
  // a mouse click (or a tap in the field) shoots
  if (p.x > AFX && p.x < AFX + AFW) gameShoot();
}
function endArcade() {
  const k = S.kai, gate = SITES.arcade + 120;
  S.game = null; S.phase = 'play'; saveProgress();
  k.x = gate + 220; k.y = FLOOR; k.vy = 0; k.ground = true; k.platform = null; k.dir = 0; k.face = 1;
  Audio.play('tink');
}

  ctx.fillStyle = '#141a36'; for (let i = 0; i < 9; i++) ctx.fillRect(i * 150 - 20, -DY, 10, H + DY);

  for (const b of g.bombs) { ctx.fillStyle = '#ffd23a'; const z = Math.floor(b.y / 6) % 2 ? 2 : -2; ctx.fillRect(b.x - 2 + z, b.y, 4, 4); ctx.fillRect(b.x - 2 - z, b.y + 4, 4, 4); ctx.fillRect(b.x - 2 + z, b.y + 8, 4, 4); }

const QUIZ_ROUNDS = 5, STAR_HP = 5;
function startBoss() {

function updateBoss(dt) {
  if (!S.boss) { startBoss(); return; }

  b.bar += (b.hp / STAR_HP - b.bar) * Math.min(1, 0.1 * dt);

// ---------------- the quiz ----------------
function startQuiz() {
  S.quiz = { pool: [], round: 0, cur: null, t: 0, last: null };
  S.phase = 'stars'; S.kai.dir = 0;
  nextConstellation();
}
function nextConstellation() {
  // 4 different constellations, then always the LÖWE (when he has only one energy left)
  const q = S.quiz;
  if (!q.pool.length) q.pool = Object.keys(CONSTELLATIONS).filter(k => k !== 'loewe' && k !== q.last).sort(() => Math.random() - 0.5);
  const id = S.boss.hp <= 1 ? 'loewe' : q.pool.shift(), C = CONSTELLATIONS[id]; q.last = id;

// =====================================================================
//  LEVEL 4 – COMMON DRAWING (HUD, panels, shop, Kai on the hoverboard, coins, hearts, shots)
//  The world's own draw file brings: drawBackground, drawGround, drawPlat, drawWalker, drawFlyer, drawDrop,
//  drawPuddle and the optional hooks drawSpecial, drawWorldMid, drawWorldFront, drawWorldTop, startPanel, drawShopClerk.
// =====================================================================
function draw() {
  SAY.list = [];
  ctx.save();
  if (S.shake > 0) ctx.translate(rand(-S.shake, S.shake) * 0.6, rand(-S.shake, S.shake) * 0.4);
  if (hook('drawSpecial')) { ctx.restore(); if (!S.noHud && S.phase !== 'intro') drawHUD(); if (!MENU.open) drawScreens(); return; }
  drawBackground();
  ctx.save(); ctx.translate(-S.cam, 0);
  drawGround();
  hook('drawWorldMid');
  drawCheckpoints();
  for (const p of S.plats) if (p.state !== 'gone' && onScreen(p.x - 20, p.w + 40)) drawPlat(p);
  for (const p of S.puddles) if (onScreen(p.x - p.w, p.w * 2)) drawPuddle(p);
  for (const o of S.objects) if (!o.done && onScreen(o.x - 20, 40)) { if (o.type === 'coin') drawCoin(o); else if (o.type === 'heart') drawHeart(o.x, o.y + Math.sin(o.p * 1.3) * 4, 12, true); else drawFruit(o.x, o.y + Math.sin(o.p * 1.3) * 4, 1); }
  for (const c of S.walkers) if (onScreen(c.x - 60, 120) && !(c.dead && c.deadT > 60)) drawWalker(c);
  for (const p of S.flyers) if (onScreen(p.x - 80, 160)) drawFlyer(p);
  for (const s of S.drops) drawDropShadow(s);
  for (const s of S.drops) drawDrop(s);
  hook('drawWorldFront');
  for (const s of S.eshots) drawEShot(s);
  for (const s of S.shots) drawShot(s);
  for (const p of S.particles) { ctx.globalAlpha = Math.max(0, Math.min(1, p.life)); ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); }
  ctx.globalAlpha = 1;
  drawPops(S.pops);
  ctx.restore();
  if (!S.hideKai && !hook('drawKaiOverride')) drawKai();
  hook('drawWorldTop');
  ctx.restore();
  if (!S.noHud) drawHUD();
  if (!MENU.open) drawScreens();
}

// ---------------- read aloud: every text gets a 🔊 button (Kai can't read yet) – in the chosen language ----------------
const SAY = { list: [] };
const canSpeak = () => !!window.speechSynthesis;
function speak(text) {
  try {
    if (!window.speechSynthesis || !text) return;
    // symbols are not read: arrows, dots, = …
    const clean = text.replace(/[◀▶←→↑↓▲▼·=•|]/g, ', ').replace(/[^\p{L}\p{N}\s.,!?¡¿:;'’"„“()%+–-]/gu, ' ').replace(/\s*,\s*(,\s*)+/g, ', ').replace(/([.!?])\s*\./g, '$1').replace(/\s+/g, ' ').trim();

    const u = new SpeechSynthesisUtterance(clean); u.lang = { de: 'de-DE', en: 'en-US', es: 'es-ES' }[SAVE.lang] || 'de-DE'; u.rate = 0.92;

}
// a tap in screen coordinates (from the controller): a 🔊 button hit?
function sayClick(hp) {
  if (!canSpeak()) return false;
  const p = { x: hp.x, y: hp.y - DY };
  for (let i = SAY.list.length - 1; i >= 0; i--) { const b = SAY.list[i]; if (p.x >= b.x - 6 && p.x <= b.x + b.w + 6 && p.y >= b.y - 6 && p.y <= b.y + b.h + 6) { Audio.play('tink'); speak(b.text); return true; } }

}

// ---------------- map helpers ----------------
const groundAt = x => GROUND.some(([a, b]) => x > a + 4 && x < b - 4);
const flipZoneAt = x => FLIP_ZONES.find(([a, b]) => x >= a && x <= b);
// the ceiling of a gravity zone (Kai rides on it upside down) – with gaps to jump over
const ceilAt = x => { const z = flipZoneAt(x); return !!z && !CEIL_GAPS.some(([a, b]) => x > a + 4 && x < b - 4); };
const inHaz = x => HAZ.some(([a, b]) => x > a + 10 && x < b - 10);
function burst(x, y, color, n, speed = 4) { for (let i = 0; i < n; i++) { const a = rand(0, Math.PI * 2), v = rand(1, speed); S.particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1, r: rand(2, 4.5), color, life: 1, g: 0.18 }); } }
function flash(text, f = 80, params) { S.msg = tx(text, params); S.msgTimer = f; }
const kaiBox = () => { const k = S.kai; return k.flip ? { x1: k.x - 26, x2: k.x + 26, y1: k.y + 4, y2: k.y + 108 } : { x1: k.x - 26, x2: k.x + 26, y1: k.y - 108, y2: k.y - 4 }; };
const overlap = (a, b) => a.x1 < b.x2 && a.x2 > b.x1 && a.y1 < b.y2 && a.y2 > b.y1;
const playing = () => S.phase === 'play' || S.phase === 'boss';
const isTouchDev = () => CTRL.touch;
const arenaX = () => S.mid && S.mid.state !== 'gone' ? MID.x : S.boss ? BOSS_X : null;

function buildWorld() {
  S.plats = PLATS.map(p => Object.assign({ x0: p.x, y0: p.y, ph: 0, state: 'idle', st: 0, vy: 0, dx: 0, dy: 0 }, p));
  S.walkers = WALKERS.map(([a, b], i) => ({ x: (a + b) / 2, x1: a, x2: b, dir: i % 2 ? 1 : -1, t: rand(0, 100), dead: false, deadT: 0, kind: i % 3 }));
  S.flyers = FLYERS.map(([a, b, y], i) => ({ x: (a + b) / 2, x1: a, x2: b, hy: y, y, dir: i % 2 ? 1 : -1, t: rand(0, 200), state: 'fly', st: 0, dead: false, deadT: 0, vy: 0, cool: rand(60, 160) }));
  const o = [];
  const coin = (x, y) => o.push({ type: 'coin', x, y, r: 11, p: rand(0, 6) });
  const arc = (x, y, n, gap = 34, lift = 30) => { for (let i = 0; i < n; i++) coin(x + i * gap, y - Math.sin(i / Math.max(1, n - 1) * Math.PI) * lift); };
  for (const [a, b] of GROUND) for (let x = a + 140; x < Math.min(b, BOSS_X) - 160; x += 560) if (!inHaz(x) && !inHaz(x + 140) && !flipZoneAt(x) && !flipZoneAt(x + 140)) arc(x, FLOOR - 40, 5);
  for (let i = 0; i < GROUND.length - 1; i++) { const a = GROUND[i][1], b = GROUND[i + 1][0]; if (b - a < 420 && !flipZoneAt((a + b) / 2)) arc(a - 20, FLOOR - 120 * JUMP_LIFT, 6, (b - a + 40) / 5, 50 * JUMP_LIFT); }
  for (const p of PLATS) if (p.kind === 'rock') arc(p.x + 20, p.y - 34, Math.max(3, Math.floor(p.w / 45)), 38, 0);

  for (const [a, b] of FLIP_ZONES) for (let x = a + 120; x < b - 100; x += 46) if (ceilAt(x - 20) && ceilAt(x + 20)) o.push({ type: 'coin', x, y: CEIL + 40, r: 11, p: rand(0, 6) });
  for (const [x, y] of HEARTS) o.push({ type: 'heart', x, y, r: 14, p: 0 });
  S.objects = o;

}

// ---------------- control (called by the controller) ----------------
function steerDir(d) {

}
function steerStop() { if (S.phase === 'game') { hook('gameDir', 0); return; } const k = S.kai; if (!playing()) return; k.dir = 0; }
function steerJump(down) {
  if (S.phase === 'game') { if (down) hook('gameShoot'); return; }
  const k = S.kai;
  if (!playing()) return;
  if (S.fly) { S.fly.up = down; return; }
  if (down) {
    k.jumpHeld = true;
    if (k.ground || k.coyote > 0) { k.vy = k.flip ? -JUMP_V : JUMP_V; k.ground = false; k.platform = null; k.coyote = 0; Audio.play('jump'); }
  } else {
    k.jumpHeld = false;
    if (!k.flip && k.vy < JUMP_CUT) k.vy = JUMP_CUT;
    if (k.flip && k.vy > -JUMP_CUT) k.vy = -JUMP_CUT;
  }
}
const superShot = () => !!(WEAPON.super && SAVE.items[WEAPON.super] && SAVE.weapon[WKEY] !== WEAPON.item);
function shoot() {
  if (S.phase === 'game') { hook('gameShoot'); return; }
  const k = S.kai;
  if (!playing() || !SAVE.items[WEAPON.item] || S.reload > 0) return;
  S.reload = superShot() ? WEAPON.reload2 : WEAPON.reload; k.shootT = 14;
  const x = k.x + k.face * 30, y = k.flip ? k.y + 50 : (S.fly ? k.y - 62 : k.y - 50), vx = k.face * WEAPON.speed + k.vx * 0.5;
  const col = WEAPON.colors[(S.shotN = (S.shotN || 0) + 1) % WEAPON.colors.length];
  S.shots.push({ x, y, vx, vy: WEAPON.vy * (k.flip ? -1 : 1), life: 90, col, g: WEAPON.grav * (k.flip ? -1 : 1) });
  if (superShot()) S.shots.push({ x, y: y + (k.flip ? 8 : -8), vx: vx * 0.95, vy: (WEAPON.vy - 2.6) * (k.flip ? -1 : 1), life: 90, col: WEAPON.colors[(S.shotN + 1) % WEAPON.colors.length], g: WEAPON.grav * (k.flip ? -1 : 1) });

}

// keyboard: ← → ride (through the controller), Space / ↑ jump, X shoot
window.addEventListener('keydown', e => {
  if (CUR !== ME || TRANS || PAUSE.on || INV.open || MENU.open) return;
  if (S.phase === 'start' && (e.code === 'Space' || e.code === 'Enter')) { beginWorld(); return; }
  if (hook('worldKey', e)) return;
  if (S.phase === 'shop') { if (e.code === 'Escape' || e.code === 'Enter') leaveShop(); return; }
  if (S.phase === 'game') { if (e.code === 'Space' || e.code === 'KeyX' || e.code === 'ArrowUp') { e.preventDefault(); hook('gameShoot'); } return; }
  if (!playing()) return;
  if (e.code === 'KeyX') { shoot(); return; }
  if (e.repeat) return;
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); steerJump(true); }
});

  if (CUR !== ME) return;

// ---------------- start / checkpoints ----------------
function beginWorld() {

  S.phase = 'play'; S.noHud = false; SAVE.started = true; SAVE['seen_' + WKEY] = true;
  S.hearts = SAVE.hearts || LIFE_HEARTS; S.coins = SAVE.coins || 0; S.score = SAVE.score || 0; S.fruits = SAVE.fruits || 0;
  const k = S.kai, arrive = ARRIVE[QUERY.get('from')];

  k.y = k.flip ? CEIL : FLOOR; k.vy = 0; k.vx = 0; k.dir = 0; k.face = 1; k.ground = true; k.platform = null; k.safeX = k.x;
  S.cpX = Math.max(START_X, k.x); S.cam = clamp(k.x - W * 0.32, 0, BOSS_X); S.begun = true;
  if (arrive != null || !(SAVE.cps && SAVE.cps[WKEY])) setCheckpoint(WKEY); else useCheckpoint(WKEY);

}
function saveProgress() { SAVE.hearts = S.hearts; SAVE.coins = S.coins; SAVE.score = S.score; SAVE.fruits = S.fruits; SAVE.wtime[WKEY] = S.wtime; bumpBest(); writeSave(); }
function addScore(n, x, y, big) { S.score += n; if (x != null) S.pops.push({ x, y, text: '+' + fmtNum(n), t: 0, big }); }
function comboScore(base, x, y) { S.combo++; const m = Math.min(8, 2 ** (S.combo - 1)); addScore(base * m, x, y, m > 1); if (m > 1) S.pops.push({ x, y: y - 24, text: '×' + m, t: 0, col: '#ff9ad0' }); }
function bossSummary(id) {
  if (SAVE.pts['boss_' + id]) { S.summary = { repeat: true }; return; }
  SAVE.pts['boss_' + id] = true;
  const sec = S.wtime / 60, tb = timeBonus(sec);

// ---------------- getting hurt ----------------

// ---------------- update ----------------
function update(dt) {
  S.t += dt;
  if (S.msgTimer > 0) S.msgTimer -= dt;
  if (S.heartFlash > 0) S.heartFlash -= dt;
  if (S.shopMsgT > 0) S.shopMsgT -= dt;
  if (S.shake > 0) S.shake = Math.max(0, S.shake - 0.5 * dt);
  if (playing()) S.wtime += dt;
  S.saveT = (S.saveT || 0) + dt; if (S.saveT > 120 && playing()) { S.saveT = 0; saveProgress(); }
  for (const p of S.pops) p.t += dt; S.pops = S.pops.filter(p => p.t < 60);
  updateParticles(dt);
  for (const o of S.objects) o.p += 0.05 * dt;
  if (hook('worldPhase', dt)) return;                    // mini games, star quiz, intro …
  if (S.phase === 'shop' || S.phase === 'ask') return;
  if (S.phase === 'leaving') return;
  if (!playing()) { if (S.phase === 'won' && S.boss) S.boss.t += dt; return; }
  if (S.reload > 0) S.reload -= dt;
  updatePlats(dt);
  if (S.fly) hook('updateFly', dt); else updateKai(dt);
  updateWalkers(dt);
  updateFlyers(dt);
  updateDrops(dt);
  updateShots(dt);
  updateEShots(dt);
  updatePuddles(dt);
  updatePickups();
  if (!S.fly) updateSites();
  hook('worldUpdate', dt);
  if (S.mid || (MID && !SAVE.mid[MID.key] && S.kai.x > MID.x + 240 && S.kai.x < MID.x + W)) hook('updateMid', dt);
  if (S.phase === 'boss' || (!S.boss && S.kai.x > BOSS_X + 240)) hook('updateBoss', dt);
  for (const x of CHECKPOINTS) if (S.kai.x > x) reachCheckpoint(x);
  const k = S.kai, ax = arenaX();
  if (ax != null) S.cam += (ax - S.cam) * Math.min(1, 0.08 * dt);
  else {
    const L = W * 0.32, R = W * 0.5, sx = k.x - S.cam;
    let target = S.cam;
    if (sx > R) target = k.x - R; else if (sx < L) target = k.x - L;
    target = clamp(target, 0, BOSS_X);
    if (Math.abs(target - S.cam) > 40) S.cam += (target - S.cam) * Math.min(1, 0.12 * dt);
    else S.cam = target;
  }
}

function updatePlats(dt) {
  for (const p of S.plats) {
    const ox = p.x, oy = p.y;
    if (p.kind === 'move') {
      p.ph += p.sp * dt;
      p.x = p.x0 + (1 - Math.cos(p.ph)) / 2 * p.ax;
      p.y = p.y0 - (1 - Math.cos(p.ph)) / 2 * p.ay;

// ---------------- Flappy: flies behind Kai and collects coins nearby ----------------
function updateFlappy(dt) {
  const f = S.flappy, k = S.kai; f.t += dt;
  const tx0 = k.x - k.face * 70, ty0 = (S.fly ? k.y - 150 : k.y - 150) + Math.sin(f.t * 0.08) * 12;
  f.x += (tx0 - f.x) * Math.min(1, 0.06 * dt); f.y += (ty0 - f.y) * Math.min(1, 0.06 * dt);
  f.face = Math.sign(k.x - f.x) || 1;
  if (!SAVE.flappy) return;
  for (const o of S.objects) if (!o.done && o.type === 'coin' && Math.abs(o.x - f.x) < 60 && Math.abs(o.y - f.y) < 60) { collect(o); burst(o.x, o.y, '#9fd8ff', 4, 2); }
}

// ---------------- the sad / happy elephants at the gorges ----------------
function updateEles(dt) {
  const k = S.kai;
  for (const e of S.eles) {
    e.t += dt;
    if (S.fly && S.fly.e === e) continue;
    // back home after a flight
    e.fx += (e.home - e.fx) * Math.min(1, 0.03 * dt); e.fy += (FLOOR - e.fy) * Math.min(1, 0.05 * dt);
    if (!playing() || S.fly || !k.ground) continue;
    const id = 'ele' + e.i, back = 'eleBack' + e.i, ga = ELES[e.i];
    // riding right towards the elephant on the left cliff
    if (Math.abs(k.x - e.home) > 260) S.asked[id] = false;
    if (!S.asked[id] && k.x > e.home - 40 && k.x < ga.g1 && k.dir >= 0 && Math.abs(k.x - e.home) < 90) {
      S.asked[id] = true;
      if (!SAVE['ele' + e.i] && S.fruits < 3) { flash('Der Elefant ist traurig. Sammle 3 Mangos für ihn! ({n} / 3)', 150, { n: S.fruits }); Audio.play('denied'); continue; }
      S.ask = id; S.phase = 'ask'; k.vx = 0; k.dir = 0; Audio.play('trumpet'); return;
    }
    // on the right side of the gorge, riding left: fly back
    if (k.x > ga.g2 + 200) S.asked[back] = false;
    if (!S.asked[back] && SAVE['ele' + e.i] && k.dir < 0 && k.x > ga.g2 && k.x < ga.g2 + 90) {
      S.asked[back] = true; S.ask = back; S.phase = 'ask'; k.vx = 0; k.dir = 0; Audio.play('trumpet'); return;
    }
  }
}
function startFly(e, dir) {
  const k = S.kai, ga = ELES[e.i];
  S.fly = { e, dir, x1: dir > 0 ? ga.g2 + 110 : e.home + 60, vy: 0, up: false, t: 0, land: false };
  e.state = 'happy'; k.x = dir > 0 ? e.home : ga.g2 + 40; k.y = FLOOR - 40; k.vx = 0; k.dir = 0; k.face = dir; k.ground = false; k.platform = null;
  Audio.play('trumpet'); Audio.play('flap');
  flash(isTouchDev() ? 'SPRUNG halten = höher fliegen!' : 'Leertaste halten = höher fliegen!', 120);
}
function updateFly(dt) {
  const F = S.fly, k = S.kai, e = F.e; F.t += dt;
  if (k.shootT > 0) k.shootT -= dt;
  k.faceAnim += (k.face - k.faceAnim) * Math.min(1, 0.7 * dt);
  if (!F.land) {
    k.x += F.dir * 4.4 * dt;
    // take off first, then SPRUNG = up, let go = down a little
    const lift = F.t < 40 ? -0.5 : F.up ? -0.42 : 0.24;
    F.vy = clamp(F.vy + lift * dt, -4.5, 3.5); k.y += F.vy * dt;
    if (k.y < -DY + 170) { k.y = -DY + 170; F.vy = Math.max(0, F.vy); }
    if (k.y > FLOOR - 30) { k.y = FLOOR - 30; F.vy = Math.min(0, F.vy) - 1; }
    if ((F.dir > 0 && k.x >= F.x1) || (F.dir < 0 && k.x <= F.x1)) { F.land = true; F.vy = 0; }
  } else {
    k.y += (FLOOR - k.y) * Math.min(1, 0.12 * dt);
    if (Math.abs(k.y - FLOOR) < 2) {
      k.y = FLOOR; k.vy = 0; k.ground = true; k.platform = null; k.safeX = k.x; k.landT = 8; S.fly = null; Audio.play('land'); Audio.play('trumpet');
      e.fx = k.x - F.dir * 30; e.fy = FLOOR - 40;
      return;
    }
  }
  e.fx = k.x; e.fy = k.y + 34;
  updatePickups();
}

// ---------------- the big elephant at the pipe ----------------
function updateBig(dt) {
  const b = S.big; b.t += dt;
  if (b.state === 'eat' && b.t > 90) { b.state = 'wings'; b.t = 0; Audio.play('sparkle'); Audio.play('trumpet'); }
  else if (b.state === 'wings' && b.t > 60) { b.state = 'lift'; b.t = 0; Audio.play('flap'); }
  else if (b.state === 'lift') {
    const u = Math.min(1, b.t / 150);
    b.x = BIG_ELE_X + (PIPE_X + PIPE_W / 2 - BIG_ELE_X) * Math.min(1, u * 2); b.y = FLOOR - Math.sin(Math.min(1, u * 1.4) * Math.PI / 2) * 130;
    b.lid = clamp((u - 0.5) * 2, 0, 1);
    if (u >= 1) { b.state = 'done'; b.t = 0; SAVE.items.fedBig = true; writeSave(); Audio.play('chime'); flash('Der Deckel ist offen! Ab in die Röhre!', 140); S.asked.pipe = false; S.near.pipe = false; }
  } else if (b.state === 'done') { b.x = PIPE_X - 150 + Math.sin(b.t * 0.02) * 80; b.y = FLOOR - 150 + Math.sin(b.t * 0.05) * 20; b.lid = 1; }
}
function worldUpdate(dt) {

function siteReached(id) {

// =====================================================================
//  FOTOSAFARI – with Abu's camera: photograph the funny animals of Aurora 61
//  Animals run, hop, fly and jump across the meadow. A task says which ones (e.g. "3 Regenbogen-Vögel").
//  Tap on the right animal = photo. 3 tasks in 45 seconds. Wrong animal: no problem, just no point.
// =====================================================================
const ANIMALS = {
  vogel: { name: 'Regenbogen-Vogel', plural: 'Regenbogen-Vögel' },
  frosch: { name: 'Propeller-Frosch', plural: 'Propeller-Frösche' },
  schnecke: { name: 'Kuppel-Schnecke', plural: 'Kuppel-Schnecken' },
  fisch: { name: 'Flatter-Fisch', plural: 'Flatter-Fische' },
  elefant: { name: 'Mini-Elefant', plural: 'Mini-Elefanten' },
};
const FOTO_T = 45 * 60;
function startFoto() {
  const k = S.kai; k.vx = 0; k.dir = 0;
  const kinds = Object.keys(ANIMALS).sort(() => Math.random() - 0.5).slice(0, 3);
  S.game = { id: 'foto', t: 0, tasks: kinds.map((kind, i) => ({ kind, need: [3, 2, 2][i], got: 0 })), task: 0, animals: [], spawn: 20, photos: [], flash: 0, aim: null, msg: '', msgT: 0, result: null };
  S.phase = 'game'; Audio.play('camera');
}
const fieldTop = () => -DY + 110;
function spawnAnimal(kind) {
  const g = S.game, left = Math.random() < 0.5, dir = left ? 1 : -1, x = left ? -60 : W + 60;
  const a = { kind, x, y: 0, dir, t: 0, done: false, ph: rand(0, 6) };
  if (kind === 'vogel') { a.y = rand(fieldTop() + 20, 150); a.vx = rand(2.6, 3.6); }
  if (kind === 'frosch') { a.y = FLOOR - 20; a.vx = rand(2.2, 3); }
  if (kind === 'schnecke') { a.y = FLOOR - 16; a.vx = rand(1.1, 1.6); }
  if (kind === 'fisch') { a.x = rand(380, 900); a.y = FLOOR + 10; a.vx = rand(1.5, 2.5) * (Math.random() < 0.5 ? 1 : -1); a.dir = Math.sign(a.vx); a.vy = -rand(9.5, 11.5); }
  if (kind === 'elefant') { a.y = rand(fieldTop() + 40, 170); a.vx = rand(1.8, 2.6); }
  a.vx = Math.abs(a.vx) * a.dir;
  g.animals.push(a);
}
function updateFoto(dt) {
  const g = S.game; if (!g) return;
  for (const p of g.photos) p.t += dt; if (g.flash > 0) g.flash -= dt; if (g.msgT > 0) g.msgT -= dt;
  if (g.result) return;
  g.t += dt;
  // new animals: the wanted kind comes more often
  g.spawn -= dt;
  if (g.spawn <= 0) {
    g.spawn = rand(28, 50);
    const want = g.tasks[g.task].kind, kinds = Object.keys(ANIMALS);
    spawnAnimal(Math.random() < 0.45 ? want : kinds[Math.floor(Math.random() * kinds.length)]);
  }
  for (const a of g.animals) {
    a.t += dt;
    if (a.kind === 'fisch') { a.x += a.vx * dt; a.vy += 0.24 * dt; a.y += a.vy * dt; if (a.y > FLOOR + 30 && a.vy > 0) a.gone = true; }
    else if (a.kind === 'frosch') { a.x += a.vx * dt * (Math.sin(a.t * 0.12) > 0 ? 1.6 : 0.2); a.y = FLOOR - 20 - Math.max(0, Math.sin(a.t * 0.12)) * 70; }
    else { a.x += a.vx * dt; if (a.kind === 'vogel' || a.kind === 'elefant') a.y += Math.sin(a.t * 0.08 + a.ph) * 0.8 * dt; }
    if (a.x < -120 || a.x > W + 120) a.gone = true;
  }
  g.animals = g.animals.filter(a => !a.gone);
  if (g.t >= FOTO_T) { g.result = 'lose'; Audio.play('nomatch'); saveProgress(); }
}
function fotoPointer(p) {
  const g = S.game; if (!g) return;
  if (g.result) {
    if (g.result === 'lose' && inRect(p, GBTN.again)) { startFoto(); return; }
    if (inRect(p, g.result === 'lose' ? GBTN.next2 : GBTN.next)) endFoto();
    return;
  }
  g.aim = { x: p.x, y: p.y, t: 0 }; g.flash = 10; Audio.play('camera');
  let best = null, bd = 60;
  for (const a of g.animals) { if (a.done) continue; const d = Math.hypot(a.x - p.x, a.y - 10 - p.y); if (d < bd) { bd = d; best = a; } }
  if (!best) return;
  best.done = true;
  const task = g.tasks[g.task];
  g.photos.push({ kind: best.kind, t: 0, ok: best.kind === task.kind });
  if (best.kind === task.kind) {
    task.got++; Audio.play('coin');
    if (task.got >= task.need) {
      g.task++; Audio.play('chime');
      if (g.task >= g.tasks.length) { g.task = g.tasks.length - 1; fotoWin(); return; }
      g.msg = tx('Super! Nächste Aufgabe!'); g.msgT = 80;
    }
  } else { g.msg = tx('Das ist ein {a} – gesucht sind {b}!', { a: tx(ANIMALS[best.kind].name), b: tx(ANIMALS[task.kind].plural) }); g.msgT = 110; }
}
function fotoWin() {
  const g = S.game; g.result = 'win'; S.coins += 20; SAVE.mini.foto = true;
  g.pts = !SAVE.pts.mini_foto; if (g.pts) { SAVE.pts.mini_foto = true; S.score += PTS.mini; }
  saveProgress(); Audio.play('win'); Audio.play('cheer');
}
function endFoto() {
  const k = S.kai;
  S.game = null; S.phase = 'play'; saveProgress();
  k.x = SITES.foto + 340; k.y = FLOOR; k.vy = 0; k.ground = true; k.platform = null; k.dir = 0; k.face = 1;
  Audio.play('tink');
}

// ---------------- update ----------------
function update(dt) {

  updateShots(dt);

  hook('worldUpdate', dt);
  if (S.mid || (MID && !SAVE.mid[MID.key] && S.kai.x > MID.x + 240 && S.kai.x < MID.x + W)) hook('updateMid', dt);
  if (S.phase === 'boss' || (!S.boss && S.kai.x > BOSS_X + 240)) hook('updateBoss', dt);
  for (const x of CHECKPOINTS) if (S.kai.x > x) reachCheckpoint(x);
  const k = S.kai, ax = arenaX();
  if (ax != null) S.cam += (ax - S.cam) * Math.min(1, 0.08 * dt);
  else {
    const L = W * 0.32, R = W * 0.5, sx = k.x - S.cam;

}

function updatePlats(dt) {
  for (const p of S.plats) {
    const ox = p.x, oy = p.y;
    if (p.kind === 'move') {
      p.ph += p.sp * dt;
      p.x = p.x0 + (1 - Math.cos(p.ph)) / 2 * p.ax;

    } else if (p.kind === 'crumble') {

      else if (p.state === 'fall') { p.vy += 0.5 * dt; p.y += p.vy * dt; if (p.y > FLOOR + 400) { p.state = 'gone'; p.st = 0; } }
      else if (p.state === 'gone') { p.st += dt; if (p.st > 220 && Math.abs(S.kai.x - (p.x0 + p.w / 2)) > 160) { p.state = 'idle'; p.y = p.y0; p.st = 0; } }

const platSolid = p => p.state !== 'gone' && p.state !== 'fall';

function updateKai(dt) {
  const k = S.kai, prevY = k.y; k.prevY = prevY;

  if (k.landT > 0) k.landT -= dt;

  if (nx < minX) { nx = minX; k.vx = 0; } if (nx > maxX) { nx = maxX; k.vx = 0; }

  }

function landOn(pl, top) {

// ---------------- enemies ----------------
const walkerBox = c => ({ x1: c.x - 26, x2: c.x + 26, y1: FLOOR - 46, y2: FLOOR });
const flyerBox = p => { const s = p.baby ? 0.65 : 1; return { x1: p.x - 34 * s, x2: p.x + 34 * s, y1: p.y - 20 * s, y2: p.y + 20 * s }; };
function stompBounce(top) {

  k.y = top; k.vy = k.jumpHeld ? JUMP_V * 0.95 : JUMP_V * 0.7; k.ground = false; k.platform = null; k.coyote = 0;
  S.shake = Math.max(S.shake, 3);
}
function updateWalkers(dt) {
  const k = S.kai, kb = kaiBox();
  for (const c of S.walkers) {
    if (c.dead) { c.deadT += dt; continue; }
    if (Math.abs(c.x - k.x) > 1400) continue;
    c.t += dt;
    c.x += c.dir * WALK_SPEED * dt;
    if (c.x < c.x1 || !groundAt(c.x - 30) || inHaz(c.x - 30)) { c.x = Math.max(c.x, c.x1); c.dir = 1; }
    if (c.x > c.x2 || !groundAt(c.x + 30) || inHaz(c.x + 30)) { c.x = Math.min(c.x, c.x2); c.dir = -1; }
    if (k.flip || S.fly) continue;
    const cb = walkerBox(c);

    if (k.vy > 0 && (k.prevY ?? k.y) <= cb.y1 + 16) { killWalker(c, true); stompBounce(cb.y1); }
    else hurt(c.x);

}
function killWalker(c, stomped) { c.dead = true; c.deadT = 0; Audio.play('stomp'); burst(c.x, FLOOR - 24, WALK_COLOR, 12, 4); if (stomped) comboScore(PTS.walker, c.x, FLOOR - 70); else addScore(PTS.walker, c.x, FLOOR - 70); }
function updateFlyers(dt) {
  const k = S.kai, kb = kaiBox();
  for (const p of S.flyers) {
    if (p.dead) { p.deadT += dt; p.vy += 0.3 * dt; p.y += p.vy * dt; continue; }
    if (Math.abs(p.x - k.x) > 1400) continue;
    p.t += dt;

      if (p.x < p.x1) { p.x = p.x1; p.dir = 1; } if (p.x > p.x2) { p.x = p.x2; p.dir = -1; }
      p.y += ((p.hy + Math.sin(p.t * 0.05) * 16) - p.y) * Math.min(1, 0.08 * dt);
      p.cool -= dt;
      const dx = k.x - p.x;
      if (p.cool <= 0 && Math.abs(dx) < 330 && Math.abs(dx) > 60 && playing() && !k.flip && !S.fly) { p.state = 'warn'; p.st = 0; p.dir = Math.sign(dx); Audio.play(FLY_SOUND); }
    } else if (p.state === 'warn') {
      p.st += dt; p.y -= 0.6 * dt;
      if (p.st > 30) { p.state = 'dive'; p.st = 0; p.sx = p.x; p.sy = p.y; p.tx = k.x + k.vx * 26; }
    } else if (p.state === 'dive') {
      p.st += dt; const u = Math.min(1, p.st / 70), ax = arenaX(), ex = ax != null ? clamp(p.sx + (p.tx - p.sx) * 2, ax + 50, ax + W - 50) : p.sx + (p.tx - p.sx) * 2;
      p.x = p.sx + (ex - p.sx) * u;
      p.y = p.sy + (FLOOR - 66 - p.sy) * Math.sin(u * Math.PI);

    }

    if (!k.flip && k.vy > 0 && (k.prevY ?? k.y) <= pb.y1 + 18) { killFlyer(p, true); stompBounce(pb.y1); }
    else hurt(p.x);

}
function killFlyer(p, stomped) { p.dead = true; p.deadT = 0; p.vy = -3; Audio.play('stomp'); burst(p.x, p.y, FLY_COLOR, 12, 4); const n = p.baby ? PTS.baby : PTS.flyer; if (stomped) comboScore(n, p.x, p.y - 30); else addScore(n, p.x, p.y - 30); }

// ---------------- things falling from above (drops) – zones set by the world ----------------
function updateDrops(dt) {
  const k = S.kai;
  const zone = DROP_ZONES.find(([a, b]) => k.x > a - 100 && k.x < b + 100);
  if (zone && S.phase === 'play' && !k.flip) {
    S.dropT -= dt;

    }
  } else S.dropT = Math.max(S.dropT, 40);

    if (!s.done && s.y + s.r >= FLOOR && groundAt(s.x)) { s.done = true; burst(s.x, FLOOR - 6, DROP_COLOR, 14, 4); Audio.play(DROP_SOUND); S.shake = Math.max(S.shake, 2); }

// ---------------- Kai's shots ----------------
function updateShots(dt) {
  for (const s of S.shots) {
    s.vy += s.g * dt; s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    if (s.y > FLOOR && groundAt(s.x)) { s.life = 0; burst(s.x, FLOOR - 3, s.col, 4, 2); continue; }

    if (s.life <= 0) continue;

// enemy shots / blobs (bosses): fly with gravity, hurt Kai; some leave a puddle on the ground
function updateEShots(dt) {

}
function updatePuddles(dt) {
  const k = S.kai;
  for (const p of S.puddles) {
    p.t += dt;
    if (p.t > 20 && p.t < p.life - 20 && k.ground && !k.platform && !k.flip && Math.abs(k.x - p.x) < p.w / 2 + 6) hurt(p.x + (k.x < p.x ? 60 : -60));

// ---------------- pickups ----------------
function updatePickups() {
  const k = S.kai, kb = kaiBox();
  for (const o of S.objects) {
    if (o.done) continue;
    if (Math.abs(o.x - k.x) > 100) continue;

function collect(o) {

  if (o.type === 'heart') { S.hearts++; S.heartFlash = -30; burst(o.x, o.y, '#ff3b5c', 14, 3); Audio.play('chest'); flash('+1 HERZ', 50); }

}

// ---------------- places on the way: ask when Kai gets there ----------------
function updateSites() {

function updateBoss(dt) {
